let _scanner=null, _scanMode=null;
function openScanner(mode) {
  _scanMode=mode;
  const lbl=mode==='checkin'?'Check-in':'Check-out';
  const hubHint = state.hub ? `at <strong>${state.hub}</strong>` : 'at your hub entrance';
  document.getElementById('modal-inner').innerHTML=`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">Scan Hub QR Code</div>
    <div class="modal-sub">Point your camera at the QR posted ${hubHint}</div>
    <div id="scan-alert"></div>
    <div class="scanner-wrap"><div id="reader"></div></div>
    <div style="margin-top:14px;display:flex;flex-direction:column;gap:8px">
      <button class="btn btn-outline btn-sm btn-full" onclick="simulateScan()">Simulate scan (demo)</button>
    </div>`;
  document.getElementById('modal').style.display='flex';
  setTimeout(()=>{
    try {
      _scanner=new Html5Qrcode('reader');
      _scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:220,height:220}},onScan,()=>{}).catch(()=>{});
    } catch(e){}
  },300);
}

function onScan(decoded) {
  // Find which hub this QR token belongs to
  const matchedHub = Object.keys(HUB_TOKENS).find(h => HUB_TOKENS[h] === decoded);
  if (matchedHub) {
    markAtt(matchedHub);
  } else {
    document.getElementById('scan-alert').innerHTML=`<div class="alert al-error">Invalid QR — please scan the QR posted at your hub entrance.</div>`;
  }
}

function simulateScan() {
  // For demo: simulate scanning the first hub's QR if tech has no hub yet, else their hub
  const demoHub = state.hub || HUBS[0];
  onScan(HUB_TOKENS[demoHub]);
}

async function markAtt(scannedHub) {
  const t12=nowFmt();
  const hubObj = HUBS.find(h=>h.name===scannedHub);
  const hubId  = hubObj ? hubObj.id : null;
  document.getElementById('scan-alert').innerHTML=`<div class="alert al-info">Saving...</div>`;
  if (_scanMode==='checkin') {
    const attId = await saveCheckin(hubId, state.user.id);
    state.hub    = scannedHub;
    state.hubId  = hubId;
    state.myAttId= attId;
    state.myCheckin = t12;
    renderTopbar();
    state.attendance[state.user.name]={status:'present',checkin:t12,checkout:null,hub:scannedHub,hub_id:hubId,att_id:attId};
  } else {
    await saveCheckout(state.myAttId);
    state.myCheckout=t12;
    state.attendance[state.user.name]={...state.attendance[state.user.name], checkout:t12};
  }
  document.getElementById('scan-alert').innerHTML=`<div class="alert al-success">✓ ${_scanMode==='checkin'?'Checked in at '+scannedHub:'Checked out'} — ${t12}</div>`;
  stopScanner();
  setTimeout(()=>{ closeModal(); navigate('my-attendance'); },1200);
}

// ── PHOTO CAPTURE ENGINE ──
let _photoSession = { phase: null, jobIdx: null, sides: ['front','left','back','right'],
  currentSide: 0, captured: {}, stream: null };

function openPhotoCapture(phase, jobIdx) {
  _photoSession = { phase, jobIdx, sides:['front','left','back','right'], currentSide:0, captured:{}, stream:null };
  const job = state.jobs[jobIdx];
  document.getElementById('pm-title').textContent = phase==='start' ? '📷 Start Photos — '+job.vehicle : '📷 Completion Photos — '+job.vehicle;
  document.getElementById('pm-sub').textContent = 'Take 4 photos: Front, Left, Back, Right side of vehicle';
  renderPhotoThumbs();
  updatePhotoSideLabel();
  document.getElementById('photo-modal').style.display='flex';
  startCamera();
}

function startCamera() {
  const video = document.getElementById('pm-video');
  const canvas = document.getElementById('pm-canvas');
  canvas.style.display='none';
  video.style.display='block';
  navigator.mediaDevices.getUserMedia({ video: { facingMode:'environment', width:{ideal:1280}, height:{ideal:960} } })
    .then(stream => {
      _photoSession.stream = stream;
      video.srcObject = stream;
    })
    .catch(err => {
      console.error('Camera error:', err);
      document.getElementById('scan-alert') && (document.getElementById('scan-alert').innerHTML = '');
      // Show error message, no file upload fallback
      const wrap = document.getElementById('pm-video')?.parentElement;
      if (wrap) wrap.innerHTML = `<div style="padding:40px;text-align:center;color:#fff;font-size:14px">
        <div style="font-size:32px;margin-bottom:12px">📷</div>
        <div style="font-weight:600;margin-bottom:8px">Camera not available</div>
        <div style="font-size:12px;opacity:.7">Please allow camera access in your browser settings and try again.</div>
      </div>`;
    });
}

function stopCamera() {
  if (_photoSession.stream) {
    _photoSession.stream.getTracks().forEach(t=>t.stop());
    _photoSession.stream = null;
  }
}

function capturePhoto() {
  const video = document.getElementById('pm-video');
  const canvas = document.getElementById('pm-canvas');
  const side = _photoSession.sides[_photoSession.currentSide];
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0);
  // Add watermark
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, canvas.height-36, canvas.width, 36);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px sans-serif';
  const job = state.jobs[_photoSession.jobIdx];
  ctx.fillText(`${job.vehicle} · ${side.toUpperCase()} · ${_photoSession.phase.toUpperCase()} · ${new Date().toLocaleString('en-IN')}`, 10, canvas.height-12);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  _photoSession.captured[side] = dataUrl;
  // Show preview
  video.style.display='none';
  canvas.style.display='block';
  document.getElementById('pm-retake-btn').style.display='block';
  document.getElementById('pm-capture-btn').textContent = side === _photoSession.sides[_photoSession.sides.length-1] ? '✓ Save' : '→ Next Side';
  document.getElementById('pm-capture-btn').onclick = confirmPhoto;
  renderPhotoThumbs();
  checkAllCaptured();
}



function retakePhoto() {
  const video = document.getElementById('pm-video');
  const canvas = document.getElementById('pm-canvas');
  video.style.display='block';
  canvas.style.display='none';
  document.getElementById('pm-retake-btn').style.display='none';
  document.getElementById('pm-capture-btn').textContent='📷 Capture';
  document.getElementById('pm-capture-btn').onclick=capturePhoto;
}

function confirmPhoto() {
  const sides = _photoSession.sides;
  const current = sides[_photoSession.currentSide];
  if (!_photoSession.captured[current]) return;
  // Move to next side if not last
  if (_photoSession.currentSide < sides.length - 1) {
    _photoSession.currentSide++;
    updatePhotoSideLabel();
    retakePhoto();
  } else {
    // All sides captured
    retakePhoto();
    renderPhotoThumbs();
    checkAllCaptured();
  }
}

function updatePhotoSideLabel() {
  const side = _photoSession.sides[_photoSession.currentSide];
  document.getElementById('pm-side-label').textContent = side.charAt(0).toUpperCase()+side.slice(1);
}

function renderPhotoThumbs() {
  const sides = _photoSession.sides;
  document.getElementById('pm-thumbs').innerHTML = sides.map((s,i)=>{
    const img = _photoSession.captured[s];
    const isActive = i===_photoSession.currentSide;
    return `<div class="photo-thumb ${img?'done':''} ${isActive?'active':''}" onclick="jumpToSide(${i})">
      ${img ? `<img src="${img}"/><div class="tick">✓</div>` : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.4);font-size:18px">📷</div>`}
      <div class="photo-thumb-label">${s}</div>
    </div>`;
  }).join('');
}

function jumpToSide(i) {
  _photoSession.currentSide = i;
  updatePhotoSideLabel();
  retakePhoto();
}

function checkAllCaptured() {
  const allDone = _photoSession.sides.every(s=>_photoSession.captured[s]);
  const btn = document.getElementById('pm-done-btn');
  btn.style.display = allDone ? 'block' : 'none';
  btn.textContent = _photoSession.phase==='start' ? '✓ Upload & Start' : '✓ Upload & Complete';
  const notesWrap = document.getElementById('pm-notes-wrap');
  if (notesWrap) notesWrap.style.display = (allDone && _photoSession.phase==='end') ? 'block' : 'none';
}

async function finishPhotoSession() {
  const { phase, jobIdx, captured } = _photoSession;
  const job = state.jobs[jobIdx];
  const btn = document.getElementById('pm-done-btn');
  const sides = _photoSession.sides;

  // Validate — all 4 photos must be captured before upload starts
  const missing = sides.filter(s => !captured[s]);
  if (missing.length > 0) {
    const statusEl = document.getElementById('pm-upload-status');
    if (statusEl) statusEl.innerHTML = `<div style="color:#f87171;font-size:13px;margin-top:8px">
      ⚠️ Missing photos: ${missing.join(', ')}. Please capture all 4 sides before submitting.
    </div>`;
    return;
  }

  btn.disabled = true;

  // Show progress UI
  const statusEl = document.getElementById('pm-upload-status');
  const updateProgress = (done, total, currentSide, failed) => {
    if (!statusEl) return;
    if (failed) {
      statusEl.innerHTML = `<div style="color:#f87171;font-size:13px;margin-top:8px">
        ❌ Upload failed for <strong>${failed}</strong> photo. Please try again.
      </div>`;
    } else {
      const pct = Math.round((done/total)*100);
      statusEl.innerHTML = `<div style="margin-top:10px">
        <div style="font-size:13px;color:rgba(255,255,255,.8);margin-bottom:6px">
          Uploading ${done}/${total} — ${currentSide || 'done'}
        </div>
        <div style="background:rgba(255,255,255,.15);border-radius:20px;height:6px;overflow:hidden">
          <div style="background:#4ade80;height:100%;width:${pct}%;transition:width .3s;border-radius:20px"></div>
        </div>
      </div>`;
    }
  };

  updateProgress(0, sides.length, sides[0]);

  // Upload all 4 photos — one at a time with progress, validate each
  const uploaded = [];
  let uploadFailed = false;

  for (let i = 0; i < sides.length; i++) {
    const side = sides[i];
    updateProgress(i, sides.length, side);
    const dataUrl = captured[side];

    // Convert base64 to blob
    const res = await fetch(dataUrl);
    const blob = await res.blob();
    const filename = `${job.db_id}/${phase}/${side}_${Date.now()}.jpg`;
    let photoUrl = dataUrl; // fallback

    if (!_demoMode) {
      try {
        const r = await fetch(`${SUPABASE_URL}/storage/v1/object/job-photos/${filename}`, {
          method: 'POST',
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer '+SUPABASE_KEY, 'Content-Type': 'image/jpeg' },
          body: blob
        });
        if (r.ok) {
          photoUrl = `${SUPABASE_URL}/storage/v1/object/public/job-photos/${filename}`;
        } else {
          console.error(`Photo upload failed for ${side}:`, r.status);
          updateProgress(i, sides.length, null, side);
          uploadFailed = true;
          btn.disabled = false;
          btn.textContent = 'Retry Upload';
          return;
        }
        // Save record to job_photos table
        await sb(`job_photos`, { method: 'POST', body: JSON.stringify({
          work_order_id: job.db_id, phase, side, photo_url: photoUrl, taken_by: state.user.id
        })});
      } catch(e) {
        console.error(`Photo upload error for ${side}:`, e);
        updateProgress(i, sides.length, null, side);
        uploadFailed = true;
        btn.disabled = false;
        btn.textContent = 'Retry Upload';
        return;
      }
    }
    uploaded.push(photoUrl);
    updateProgress(i + 1, sides.length, sides[i+1] || 'done');
  }

  // All 4 uploaded successfully — now update job status
  if (statusEl) statusEl.innerHTML = `<div style="color:#4ade80;font-size:13px;margin-top:8px">✓ All ${sides.length} photos uploaded successfully</div>`;

  const newStatus = phase==='start' ? 'In Progress' : 'Done';
  state.jobs[jobIdx].status = newStatus;
  if (phase==='start') state.jobs[jobIdx].start_photos = uploaded;
  else state.jobs[jobIdx].end_photos = uploaded;

  if (!_demoMode) {
    await updateWOStatus(job.db_id, newStatus);
    const patch = phase==='start'
      ? { status: 'In Progress', started_at: new Date().toISOString(), start_photos_done: true }
      : { status: 'Done', completed_at: new Date().toISOString(), end_photos_done: true };
    await sb(`work_orders?id=eq.${job.db_id}`, { method: 'PATCH', body: JSON.stringify(patch) });
  }

  // Small delay to show success message, then close
  await new Promise(r => setTimeout(r, 800));
  stopCamera();
  document.getElementById('photo-modal').style.display='none';
  navigate('my-jobs');
}

function woPage(key, delta) {
  if (!window._woPg) window._woPg = {ua:0,as:0};
  window._woPg[key] = Math.max(0, window._woPg[key] + delta);
  navigate('workorders');
}
let _woFilterTimer = null;
function debounceWoFilter(scope) {
  clearTimeout(_woFilterTimer);
  _woFilterTimer = setTimeout(() => {
    // Re-render only the table rows in-place without full navigate()
    const role = state.user?.role;
    if (scope === 'sm') {
      const c = document.getElementById('content');
      if (c) {
        // Full re-render but restore focus after
        const el = document.getElementById('wo-reg-filter-sm');
        const pos = el ? el.selectionStart : null;
        navigate('workorders');
        // Restore focus after re-render
        requestAnimationFrame(() => {
          const newEl = document.getElementById('wo-reg-filter-sm');
          if (newEl) { newEl.focus(); if (pos !== null) newEl.setSelectionRange(pos, pos); }
        });
      }
    } else {
      const el = document.getElementById('wo-reg-filter-wide');
      const pos = el ? el.selectionStart : null;
      navigate('workorders');
      requestAnimationFrame(() => {
        const newEl = document.getElementById('wo-reg-filter-wide');
        if (newEl) { newEl.focus(); if (pos !== null) newEl.setSelectionRange(pos, pos); }
      });
    }
  }, 300);
}

function clearWoModelFilter() { _woModelFilterSM=''; _woModelFilterWide=''; }
function woPgWide(key, delta) {
  if (!window._woPgWide) window._woPgWide = {ua:0,as:0};
  window._woPgWide[key] = Math.max(0, window._woPgWide[key] + delta);
  navigate('workorders');
}

async function assignWideJC(jcNum, regNum, hubName, techName) {
  if (!techName) return;
  const techUser = ALL_USERS.find(u=>u.name===techName);
  const hubObj   = HUBS.find(h=>h.name===hubName);

  const dup = await checkVehicleDuplicate(regNum, techName);
  if (dup) {
    showDupPopup(dup, async () => {
      await cancelPreviousWO(dup.woDbId);
      await _doAssignWideJC(jcNum, regNum, techUser, hubObj);
    });
    return;
  }
  await _doAssignWideJC(jcNum, regNum, techUser, hubObj);
}

async function _doAssignWideJC(jcNum, regNum, techUser, hubObj) {
  const woNum = 'WO-'+String(Date.now()).slice(-6);
  // Get issue and submission type from JC lookup
  const jcData = window._jcLookup?.[regNum] || {};
  const issue  = jcData.reason_for_ending || jcData.submission_type || 'OOS Vehicle';
  const woType = (jcData.submission_type||'').toLowerCase().includes('oos') ? 'oos' : 'running_repair';
  const saved = await saveWorkOrder({
    wo_number: woNum, vehicle_reg: regNum, issue,
    job_card_number: jcNum || null,
    assigned_tech_id: techUser?.id || null,
    assigned_tech_name: techUser?.name || null,
    hub_id: hubObj?.id || null,
    hub_name: hubObj?.name || null,
    priority: 'Medium', status: 'Open', wo_type: woType,
    assigned_by_id: state.user.id,
    assigned_by_name: state.user.name || null
  });
  if (saved) {
    if (window._jcCache) window._jcCache = {};
    navigate('workorders');
  } else {
    alert('Failed to assign. Please try again.');
  }
}

function assignTechFromJC(jcNum, regNum, techName) {
  if (!techName) return;
  // Pre-fill the assign form with this vehicle and tech
  document.getElementById('veh-search').value = regNum;
  document.getElementById('wov').value = regNum;
  document.getElementById('veh-selected').style.display = 'block';
  document.getElementById('veh-selected').innerHTML = `✓ <strong>${regNum}</strong> — from JC ${jcNum}`;
  const techSel = document.getElementById('wot');
  if (techSel) {
    for (const opt of techSel.options) {
      if (opt.value === techName) { opt.selected = true; break; }
    }
  }
  // Scroll to form
  document.querySelector('.wo-form-wrap')?.scrollIntoView({behavior:'smooth', block:'start'});
  document.getElementById('woi').focus();
}

function changeTechAlert(jcNum) {
  document.getElementById('modal-inner').innerHTML = `

// ── TECHNICIAN PROFILE ──────────────────────────────────────────────────────
async function loadTechProfile(techName, role) {
  if (!techName) return '<div class="empty-state">No technician selected.</div>';

  const isSelf  = role === 'technician';
  const today   = new Date();
  const todayISO = today.toISOString().slice(0,10);

  // Date range — default to current month, configurable
  if (!window._profDateFrom) window._profDateFrom = new Date(today.getFullYear(), today.getMonth(), 1).toISOString().slice(0,10);
  if (!window._profDateTo)   window._profDateTo   = todayISO;
  const from = window._profDateFrom;
  const to   = window._profDateTo;

  // Calendar always shows current month
  const yr    = today.getFullYear();
  const mo    = today.getMonth() + 1;
  const moStr = String(mo).padStart(2,'0');
  const monthStart = `${yr}-${moStr}-01`;
  const monthEnd   = todayISO;

  // Fetch in parallel
  const [attRows, woRows, userRow, allAttRows] = await Promise.all([
    sb(`attendance?technician_name=eq.${encodeURIComponent(techName)}&date=gte.${monthStart}&date=lte.${monthEnd}&select=date,status,hub_name,checkin_time,checkout_time,total_working_hours&order=date.asc`) || [],
    sb(`work_orders?assigned_tech_name=eq.${encodeURIComponent(techName)}&assigned_at=gte.${from}T00:00:00&assigned_at=lte.${to}T23:59:59&select=id,vehicle_reg,issue,status,priority,wo_type,assigned_at,started_at,completed_at,time_taken_min,hub_name,job_card_number&order=assigned_at.desc&limit=500`) || [],
    (async()=>{ return ALL_USERS.find(u=>u.name===techName)||null; })(),
    sb(`work_orders?assigned_tech_name=eq.${encodeURIComponent(techName)}&select=id,vehicle_reg,issue,status,priority,wo_type,assigned_at,started_at,completed_at,time_taken_min&order=assigned_at.desc&limit=5`) || []
  ]);

  // Attendance stats this month
  const presentDays  = attRows.filter(r=>r.status==='present').length;
  const halfDays     = attRows.filter(r=>r.status==='half_day').length;
  const absentDays   = attRows.filter(r=>r.status==='absent').length;
  const woCount      = attRows.filter(r=>r.status==='week_off').length;
  const workingDays  = presentDays + halfDays + absentDays + woCount || 1;
  const attPct       = Math.round(((presentDays + halfDays*0.5) / Math.max(workingDays,1)) * 100);
  const avgHrsDay    = presentDays > 0
    ? (attRows.filter(r=>r.status==='present'&&r.total_working_hours).reduce((s,r)=>s+r.total_working_hours,0) / presentDays).toFixed(1)
    : '—';

  // Job stats all time
  const totalAssigned  = woRows.length;
  const totalDone      = woRows.filter(j=>j.status==='Done').length;
  const inProgress     = woRows.filter(j=>j.status==='In Progress').length;
  const openJobs       = woRows.filter(j=>j.status==='Open').length;
  const completionRate = totalAssigned ? Math.round((totalDone/totalAssigned)*100) : 0;
  const timedJobs      = woRows.filter(j=>j.time_taken_min&&j.status==='Done');
  const avgMins        = timedJobs.length ? Math.round(timedJobs.reduce((s,j)=>s+j.time_taken_min,0)/timedJobs.length) : 0;

  // This month jobs
  const moJobs     = woRows.filter(j=>(j.assigned_at||'').startsWith(`${yr}-${moStr}`));
  const moDone     = moJobs.filter(j=>j.status==='Done').length;

  // Hub info
  const hubName    = userRow?.assigned_hub_name || attRows[attRows.length-1]?.hub_name || '—';
  const initials   = techName.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();

  // Recent 5 jobs
  const recent = allAttRows.slice(0,5);

  // Mini calendar — this month
  const daysInMonth  = new Date(yr, mo, 0).getDate();
  const days         = Array.from({length:daysInMonth},(_,i)=>i+1);
  const dayNames     = ['S','M','T','W','T','F','S'];
  const attMap       = {};
  attRows.forEach(r=>{ attMap[r.date]=r.status; });
  const cellColor    = s => s==='present'?'#dcfce7':s==='half_day'?'#fef3c7':s==='absent'?'#fee2e2':s==='week_off'?'#f3e8ff':'var(--g100)';
  const cellText     = s => s==='present'?'P':s==='half_day'?'H':s==='absent'?'A':s==='week_off'?'W':'';
  const cellTColor   = s => s==='present'?'#166534':s==='half_day'?'#92400e':s==='absent'?'#991b1b':s==='week_off'?'#6b21a8':'var(--g400)';

  // Productivity score
  const prodPct = Math.min(100, Math.round((parseFloat(avgHrsDay)||0)/8*100));
  const prodColor = prodPct>=80?'var(--green)':prodPct>=50?'#f59e0b':'var(--red)';

  // Productivity for date range
  const prodAssigned = woRows.length;
  const prodDone     = woRows.filter(j=>j.status==='Done').length;
  const prodTimed    = woRows.filter(j=>j.time_taken_min&&j.status==='Done');
  const prodAvgMins  = prodTimed.length ? Math.round(prodTimed.reduce((s,j)=>s+j.time_taken_min,0)/prodTimed.length) : 0;
  const prodRate     = prodAssigned ? Math.round((prodDone/prodAssigned)*100) : 0;

  const backBtn = isSelf ? '' : `<button class="btn btn-outline btn-sm" onclick="navigate('dashboard')" style="display:flex;align-items:center;gap:6px;font-size:12px">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg> Back
  </button>`;

  return `
    <div class="page-hd">

    <!-- Profile header -->

      <div style="flex:1">

        <div style="font-size:13px;color:var(--g500);margin-top:2px">Technician · ${hubName}</div>
        ${userRow?.phone ? `<div style="font-size:12px;color:var(--g400);margin-top:2px">📞 ${userRow.phone}</div>` : ''}
      </div>
      <div style="text-align:center">
        <div style="font-size:28px;font-weight:700;color:${prodColor}">${prodPct}%</div>
        <div style="font-size:11px;color:var(--g400)">Productivity</div>
      </div>
    </div>

    <!-- Date filter -->
    <div style="display:flex;gap:8px;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap">
      <div>
        <label class="form-label" style="font-size:11px">From</label>
        <input type="date" class="form-input" style="width:140px;padding:6px 10px;font-size:12px" value="${from}"
          onchange="window._profDateFrom=this.value;navigate('tech-profile')"/>

    </div>

    <!-- Stats grid for date range -->

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px">
      <div class="card" style="padding:14px;text-align:center">
        <div style="font-size:22px;font-weight:700;color:var(--blue)">${prodAssigned}</div>
        <div style="font-size:11px;color:var(--g500)">Jobs Assigned</div>
      </div>
      <div class="card" style="padding:14px;text-align:center">
        <div style="font-size:22px;font-weight:700;color:var(--green)">${prodDone}</div>
        <div style="font-size:11px;color:var(--g500)">Completed</div>
      </div>
      <div class="card" style="padding:14px;text-align:center">
        <div style="font-size:22px;font-weight:700;color:var(--g700)">${prodRate}%</div>
        <div style="font-size:11px;color:var(--g500)">Completion Rate</div>
      </div>
      <div class="card" style="padding:14px;text-align:center">
        <div style="font-size:22px;font-weight:700;color:var(--g700)">${prodAvgMins?prodAvgMins+'m':'—'}</div>
        <div style="font-size:11px;color:var(--g500)">Avg Min/Job</div>
      </div>
      <div class="card" style="padding:14px;text-align:center">
        <div style="font-size:22px;font-weight:700;color:var(--blue)">${inProgress}</div>
        <div style="font-size:11px;color:var(--g500)">In Progress</div>
      </div>
      <div class="card" style="padding:14px;text-align:center">
        <div style="font-size:22px;font-weight:700;color:#f59e0b">${openJobs}</div>

        <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:#166534">${presentDays}</div><div style="font-size:11px;color:var(--g400)">Present</div></div>

async function loadProductivity(role) {
  const STANDARD_HRS = 8;
  const userCityId   = state.user?.city_id;
  const myCityName   = getCityNameSync(userCityId);
  const isTech       = role==='technician';

  // Date range
  const from = _prodDateFrom;
  const to   = _prodDateTo;

  // Build hub/city scope
  const myHubName = state.hub;
  const hubFilter = isTech ? myHubName
    : role==='hub_manager' ? myHubName
    : _prodHub || null;

  // Fetch work orders in date range
  let woQuery = `work_orders?assigned_at=gte.${from}T00:00:00&assigned_at=lte.${to}T23:59:59&select=assigned_tech_name,status,time_taken_min,hub_name&limit=5000`;
  if (isTech)               woQuery += `&assigned_tech_name=eq.${encodeURIComponent(state.user.name)}`;
  else if (hubFilter)       woQuery += `&hub_name=eq.${encodeURIComponent(hubFilter)}`;

  // Fetch attendance in date range
  let attQuery = `attendance?date=gte.${from}&date=lte.${to}&select=technician_name,date,status,total_working_hours,hub_name&limit=5000`;
  if (isTech)               attQuery += `&technician_name=eq.${encodeURIComponent(state.user.name)}`;
  else if (hubFilter)       attQuery += `&hub_name=eq.${encodeURIComponent(hubFilter)}`;

  const [wos, atts] = await Promise.all([sb(woQuery)||[], sb(attQuery)||[]]);

  // Filter by role scope
  let filtWOs  = wos;
  let filtAtts = atts;
  if (!isTech && role==='area_manager' && !hubFilter) {
    const myHubs = HUBS.filter(h=>h.city_id===userCityId).map(h=>h.name);
    filtWOs  = wos.filter(w=>!w.hub_name||myHubs.includes(w.hub_name));
    filtAtts = atts.filter(a=>!a.hub_name||myHubs.includes(a.hub_name));
  }
  if (role==='head' && _prodCity && !hubFilter) {
    const cityHubs = getHubsForCitySync(_prodCity).map(h=>h.name);
    filtWOs  = wos.filter(w=>!w.hub_name||cityHubs.includes(w.hub_name));
    filtAtts = atts.filter(a=>!a.hub_name||cityHubs.includes(a.hub_name));
  }

  // Build per-tech stats
  const techMap = {};
  const ensureTech = name => {
    if (!techMap[name]) techMap[name] = { assigned:0, completed:0, totalMinutes:0, presentDays:new Set(), totalWorkHrs:0 };
  };

  filtWOs.forEach(w => {
    if (!w.assigned_tech_name) return;
    ensureTech(w.assigned_tech_name);
    techMap[w.assigned_tech_name].assigned++;
    if (w.status==='Done') {
      techMap[w.assigned_tech_name].completed++;
      if (w.time_taken_min) techMap[w.assigned_tech_name].totalMinutes += w.time_taken_min;
    }
  });

  filtAtts.forEach(a => {
    if (!a.technician_name || a.status!=='present') return;
    ensureTech(a.technician_name);
    techMap[a.technician_name].presentDays.add(a.date);
    if (a.total_working_hours) techMap[a.technician_name].totalWorkHrs += a.total_working_hours;
  });

  const techs = Object.entries(techMap)
    .map(([name, d]) => {
      const days     = d.presentDays.size || 1;
      const avgMins  = d.completed>0 ? (d.totalMinutes/d.completed) : 0;
      const avgHrs   = d.totalWorkHrs/days;
      const prodPct  = Math.min(100, Math.round((avgHrs/STANDARD_HRS)*100));
      return { name, assigned:d.assigned, completed:d.completed, avgMins, avgHrs, prodPct, days };
    })
    .sort((a,b)=>b.prodPct-a.prodPct);

  // Hub options
  const hubOpts = (role==='area_manager'
    ? HUBS.filter(h=>h.city_id===userCityId)
    : HUBS
  ).map(h=>`<option value="${h.name}" ${h.name===_prodHub?'selected':''}>${h.name}</option>`).join('');

  const cityNames = ['Bangalore','Hyderabad','NCR','Indore'];
  const cityOpts  = cityNames.map(c=>`<option value="${c}" ${c===_prodCity?'selected':''}>${c}</option>`).join('');

  // CSV export
  window._exportProdCSV = () => {
    const header = ['Technician','Assigned','Completed','Avg Min/Job','Avg Hrs/Day','Days Present','Productivity %'];
    const rows2  = techs.map(t=>[t.name,t.assigned,t.completed,t.avgMins.toFixed(1),t.avgHrs.toFixed(1),t.days,t.prodPct+'%']);
    const csv    = [header,...rows2].map(r=>r.join(',')).join('\n');
    const blob   = new Blob([csv],{type:'text/csv'});
    const url    = URL.createObjectURL(blob);

// ── ATTENDANCE CALENDAR DASHBOARD ──────────────────────────────────────────
async function loadAttCalendar(role) {
  const userCityId = state.user?.city_id || '';
  const myCityName = getCityNameSync(userCityId) || '';

  // Parse selected month
  const [yr, mo] = _calMonth.split('-').map(Number);
  const daysInMonth = new Date(yr, mo, 0).getDate();
  const firstDay    = new Date(yr, mo-1, 1);
  const lastDay     = new Date(yr, mo, 0);
  const startISO    = `${yr}-${String(mo).padStart(2,'0')}-01`;
  const endISO      = `${yr}-${String(mo).padStart(2,'0')}-${String(daysInMonth).padStart(2,'0')}`;

  // Build hub filter
  const cityHubs = role==='hub_manager'
    ? [state.hub]
    : role==='area_manager'
      ? HUBS.filter(h=>h.city_id===userCityId).map(h=>h.name)
      : _calCity ? getHubsForCitySync(_calCity).map(h=>h.name) : HUBS.map(h=>h.name);

  const hubFilter = role==='hub_manager'
    ? state.hub
    : _calHub || null;

  // Fetch attendance for month
  let query = `attendance?date=gte.${startISO}&date=lte.${endISO}&select=technician_name,user_id,date,status,hub_name&limit=5000`;
  if (hubFilter) query += `&hub_name=eq.${encodeURIComponent(hubFilter)}`;

  const rows = await sb(query) || [];

  // Filter by role scope
  let filtered = rows;
  if (role==='hub_manager') {
    filtered = rows.filter(r=>r.hub_name===state.hub || !r.hub_name);
  } else if (role==='area_manager') {
    const myHubs = HUBS.filter(h=>h.city_id===userCityId).map(h=>h.name);
    filtered = rows.filter(r=>!r.hub_name||myHubs.includes(r.hub_name));
  } else if (role==='head' && _calCity && !_calHub) {
    // Head selected city but no specific hub — filter by city's hubs
    const cityHubNames = getHubsForCitySync(_calCity).map(h=>h.name);
    filtered = rows.filter(r=>!r.hub_name||cityHubNames.includes(r.hub_name));
  }

  // Build matrix: { techName: { 'YYYY-MM-DD': status } }
  const matrix = {};
  const techUserIds = {}; // name → user_id
  filtered.forEach(r => {
    if (!r.technician_name) return;
    if (!matrix[r.technician_name]) matrix[r.technician_name] = {};
    matrix[r.technician_name][r.date] = r.status;
    if (r.user_id && !techUserIds[r.technician_name]) techUserIds[r.technician_name] = r.user_id;
  });

  const techs    = Object.keys(matrix).sort();
  const days     = Array.from({length:daysInMonth},(_,i)=>i+1);
  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  // Helper: is weekend
  const isWeekend = d => {
    const day = new Date(yr, mo-1, d).getDay();
    return day===0||day===6;
  };

  // Build date keys
  const dateKey = d => `${yr}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

  // Status cell
  const canMarkWO = role==='hub_manager'; // only SM can mark WO
  const cell = (status, isWknd, techName, dateStr, userId) => {
    if (!status) return `<td style="color:var(--g300);text-align:center;padding:4px 2px;font-size:11px">—</td>`;
    const s = status.toLowerCase();
    if (s==='present') return `<td style="background:#dcfce7;color:#166534;font-weight:600;text-align:center;padding:4px 2px;font-size:11px">P</td>`;
    if (s==='absent') return canMarkWO
      ? `<td style="background:#fee2e2;color:#991b1b;font-weight:600;text-align:center;padding:4px 2px;font-size:11px;cursor:pointer;border-radius:3px" 
          title="Click to mark as Week Off"
          onclick="showWOPopup('${techName}','${dateStr}','${userId||''}')" >A</td>`
      : `<td style="background:#fee2e2;color:#991b1b;font-weight:600;text-align:center;padding:4px 2px;font-size:11px">A</td>`;
    if (s==='leave')    return `<td style="background:#fef9c3;color:#854d0e;font-weight:600;text-align:center;padding:4px 2px;font-size:11px">L</td>`;
    if (s==='week_off')  return `<td style="background:#f3e8ff;color:#6b21a8;font-weight:600;text-align:center;padding:4px 2px;font-size:11px">WO</td>`;
    if (s==='half_day')  return `<td style="background:#fef3c7;color:#92400e;font-weight:600;text-align:center;padding:4px 2px;font-size:11px">HD</td>`;
    return `<td style="text-align:center;padding:4px 2px;font-size:11px">${status.slice(0,1).toUpperCase()}</td>`;
  };

  // Summary per tech
  const summary = tech => {
    const data = matrix[tech]||{};
    const vals  = Object.values(data);
    return {
      P:  vals.filter(v=>v==='present').length,
      HD: vals.filter(v=>v==='half_day').length,
      A:  vals.filter(v=>v==='absent').length,
      L:  vals.filter(v=>v==='leave').length,
    };
  };

  // Month options
  const months = [];
  for (let i=0;i<12;i++) {
    const d = new Date(2026,i,1);
    const val = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    months.push({val, lbl: d.toLocaleDateString('en-IN',{month:'long',year:'numeric'})});
  }

  // Hub options for filter
  const hubOpts = cityHubs.map(h=>`<option value="${h}" ${h===_calHub?'selected':''}>${h}</option>`).join('');
  const cityNames = (window._cities||[]).map(c=>c.name);
  const cityOpts  = cityNames.map(c=>`<option value="${c}" ${c===_calCity?'selected':''}>${c}</option>`).join('');

  // Excel export
  const exportCSV = () => {
    const header = ['Technician',...days.map(d=>`${d}/${mo}`),'Present','Absent','Leave'];
    const rows2  = techs.map(t=>{
      const s = summary(t);
      return [t,...days.map(d=>matrix[t]?.[dateKey(d)]?.slice(0,1).toUpperCase()||''),s.P,s.A,s.L];
    });
    const csv = [header,...rows2].map(r=>r.join(',')).join('\n');
    const blob = new Blob([csv],{type:'text/csv'});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href=url; a.download=`Attendance_${_calMonth}.csv`; a.click();
  };
  window._exportAttCSV = exportCSV;

  return `
    <div class="page-hd">
      <div class="page-hd-text">
        <div class="page-title">Attendance</div>
        <div class="page-sub">${hubFilter||myCityName||'All'} — ${firstDay.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</div>
      </div>
      <button class="btn btn-outline btn-sm" onclick="window._exportAttCSV()" style="display:flex;align-items:center;gap:6px;font-size:12px">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export CSV
      </button>
    </div>
    <div style="display:flex;gap:4px;margin-bottom:16px;border-bottom:2px solid var(--g100);padding-bottom:0">
      <button onclick="_attTab='today';localStorage.setItem('att_tab','today');navigate('attendance')" style="padding:8px 18px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:600;border-bottom:2px solid transparent;color:var(--g500);margin-bottom:-2px">Today</button>
      <button style="padding:8px 18px;border:none;background:none;cursor:default;font-size:13px;font-weight:600;border-bottom:2px solid var(--blue);color:var(--blue);margin-bottom:-2px">Calendar</button>
    </div>

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-end">
      <div>
        <label class="form-label">Month</label>
        <select class="form-select" style="width:190px" onchange="_calMonth=this.value;navigate('attendance')">
          ${months.map(m=>`<option value="${m.val}" ${m.val===_calMonth?'selected':''}>${m.lbl}</option>`).join('')}
        </select>
      </div>
      ${role==='head'?`<div>
        <label class="form-label">City</label>
        <select class="form-select" style="width:150px" onchange="_calCity=this.value;_calHub='';navigate('attendance')">
          <option value="">All Cities</option>${cityOpts}
        </select>
      </div>`:''}
      ${role!=='hub_manager'?`<div>
        <label class="form-label">Hub</label>
        <select class="form-select" style="width:180px" onchange="_calHub=this.value;navigate('attendance')">
          <option value="">All Hubs</option>${hubOpts}
        </select>
      </div>`:''}
    </div>

    <!-- Legend -->
    <div style="display:flex;gap:12px;margin-bottom:12px;font-size:12px;flex-wrap:wrap;align-items:center">
      <span><span style="background:#dcfce7;color:#166534;padding:2px 8px;border-radius:4px;font-weight:600">P</span> Present</span>
      <span><span style="background:#fee2e2;color:#991b1b;padding:2px 8px;border-radius:4px;font-weight:600;cursor:${role==='hub_manager'?'pointer':'default'}">${role==='hub_manager'?'A ↗':'A'}</span> Absent${role==='hub_manager'?' <span style="color:var(--g400)">(tap to mark WO)</span>':''}</span>
      <span><span style="background:#fef9c3;color:#854d0e;padding:2px 8px;border-radius:4px;font-weight:600">L</span> Leave</span>
      <span><span style="background:var(--g100);color:var(--g500);padding:2px 8px;border-radius:4px;font-weight:600">WO</span> Week Off</span>
      <span><span style="background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:4px;font-weight:600">HD</span> Half Day (5–9hrs)</span>
    </div>

    ${techs.length===0
      ? `<div class="empty-state">No attendance data for this period.</div>`
      : `<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
        <table style="border-collapse:collapse;min-width:100%;font-size:12px">
          <thead>
            <tr>
              <th style="position:sticky;left:0;background:var(--g800);color:var(--white);padding:8px 12px;text-align:left;min-width:130px;z-index:2;white-space:nowrap">Technician</th>
              ${days.map(d=>{
                const wknd = isWeekend(d);
                const dn   = dayNames[new Date(yr,mo-1,d).getDay()];
                return `<th style="padding:4px 3px;text-align:center;min-width:32px;background:${wknd?'var(--g200)':'var(--g800)'};color:var(--white);font-weight:500">
                  <div>${d}</div>
                  <div style="font-size:9px;opacity:.7">${dn}</div>
                </th>`;
              }).join('')}
              <th style="padding:8px 6px;text-align:center;background:#166534;color:white;min-width:36px">P</th>
              <th style="padding:8px 6px;text-align:center;background:#92400e;color:white;min-width:36px">HD</th>
              <th style="padding:8px 6px;text-align:center;background:#991b1b;color:white;min-width:36px">A</th>
              <th style="padding:8px 6px;text-align:center;background:#854d0e;color:white;min-width:36px">L</th>
            </tr>
          </thead>
          <tbody>
            ${techs.map((t,ti)=>{
              const s = summary(t);
              const bg = ti%2===0?'var(--white)':'var(--g50)';
              return `<tr>
                <td style="position:sticky;left:0;background:${bg};padding:6px 12px;font-weight:500;border-bottom:1px solid var(--g100);white-space:nowrap;z-index:1">${t}</td>
                ${days.map(d=>{
                  const wknd   = isWeekend(d);
                  const dk     = dateKey(d);
                  const status = matrix[t]?.[dk];
                  const uid    = techUserIds[t] || '';
                  return cell(status, wknd, t, dk, uid);
                }).join('')}
                <td style="text-align:center;font-weight:600;color:#166534;padding:6px 4px">${s.P}</td>
                <td style="text-align:center;font-weight:600;color:#92400e;padding:6px 4px">${s.HD}</td>

        </table>

// Sync helpers — use cached data, no extra Supabase calls
function getCityNameSync(cityId) {
  if (!cityId) return '';
  const c = window._cities?.find(c=>c.id===cityId);
  return c ? c.name : '';
}
function getHubsForCitySync(cityName) {
  if (!cityName) return HUBS;
  const city = window._cities?.find(c=>c.name===cityName);
  if (!city) return HUBS;
  return HUBS.filter(h=>h.city_id===city.id);
}
// Keep async versions as wrappers for backward compat
async function getCityName(cityId) { return getCityNameSync(cityId); }
async function getHubsForCity(cityName) { return getHubsForCitySync(cityName); }

          <td class="mono" style="font-size:12px">${a.checkout||'—'}</td>
          <td>${a.status==='present'
            ? ap==='approved'
              ? `<span class="badge b-present" style="font-size:11px">✓ Approved</span>`
              : ap==='denied'
              ? `<span class="badge b-absent" style="font-size:11px">✗ Denied</span>`
              : `<div style="display:flex;gap:6px">
                  <button class="btn btn-green btn-sm" style="padding:4px 10px;font-size:11px" onclick="approveAtt('${name}','approved')">Approve</button>
                  <button class="btn btn-red btn-sm"   style="padding:4px 10px;font-size:11px" onclick="approveAtt('${name}','denied')">Deny</button>

      Technician Attendance
    </div>` : ''}

    `<div class="tw"><table>
      <thead><tr><th>Technician</th><th>Hub</th><th>Status</th><th>Check-in</th><th>Check-out</th><th>Approval</th></tr></thead>
      <tbody>${entries.map(([t,a])=>{
        const bc=a.status==='present'?'b-present':a.status==='absent'?'b-absent':'b-leave';
        return `<tr>
          <td><strong>${t}</strong></td>
          <td style="font-size:12px;color:var(--g500)">${a.hub||'—'}</td>
          <td><span class="badge ${bc}">${a.status[0].toUpperCase()+a.status.slice(1)}</span></td>

          <td class="mono" style="font-size:12px">${formatTime(a.checkout)}</td>
          <td>${formatApproval(a)}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>`}`;
}

async function renderWorkAssignedAsync() {
  const myHub = state.hub;
  if (!myHub) return '<div class="empty-state">No hub selected.</div>';

  // Load ALL work orders for this hub (not just today)
  let allJobs = [];
  if (!_demoMode) {
    const rows = await sb(
      `work_orders?hub_id=eq.${state.hubId}&select=id,wo_number,vehicle_reg,issue,assigned_tech_name,priority,status,wo_type,assigned_at,started_at,completed_at,job_card_number,current_jc_status&order=assigned_at.desc&limit=1000`
    );
    allJobs = rows || [];
  } else {
    allJobs = state.jobs.map(j=>({
      id: j.db_id, wo_number: j.id, vehicle_reg: j.vehicle,
      issue: j.issue, assigned_tech_name: j.tech, priority: j.priority,
      status: j.status, wo_type: j.wo_type, assigned_at: new Date().toISOString(),
      job_card_number: j.jc_number||null, current_jc_status: null
    }));
  }

  // Get selected date from filter (default today)
  const todayISO = new Date().toISOString().slice(0,10);
  const selDate  = window._waDate || todayISO;

  // Filter by selected date
  const filtered = selDate === 'all'
    ? allJobs
    : allJobs.filter(j => j.assigned_at && j.assigned_at.slice(0,10) === selDate);

  const fmtDate = d => d ? new Date(d).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:true}) : '—';
  const fmtDateOnly = d => d ? new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) : '—';

  // Stats
  const open   = filtered.filter(j=>j.status==='Open').length;
  const inProg = filtered.filter(j=>j.status==='In Progress').length;
  const done   = filtered.filter(j=>j.status==='Done').length;

  const rows = filtered.map(j => {
    const sc = j.status==='Done'?'b-done':j.status==='In Progress'?'b-inprog':'b-open';
    const pc = j.priority==='High'?'b-high':j.priority==='Low'?'b-low':'b-med';
    return `<tr>
      
      <td><strong>${j.vehicle_reg||'—'}</strong></td>
      <td class="mono" style="font-size:11px;color:var(--g400)">${j.job_card_number||'—'}</td>
      <td style="font-size:13px">${j.issue||'—'}</td>
      <td style="font-size:12px">${j.assigned_tech_name||'—'}</td>
      <td><span class="badge ${pc}">${j.priority}</span></td>
      <td><span class="badge ${sc}">${j.status}</span></td>
      <td style="font-size:11px;color:var(--g500)">${fmtDate(j.assigned_at)}</td>
      <td style="font-size:11px;color:var(--g500)">${j.completed_at ? fmtDate(j.completed_at) : '—'}</td>
      <td>${j.status!=='Done'?'<button onclick="smMarkJobDone(\''+j.id+'\')" style="font-size:11px;padding:3px 8px;border:1px solid #ccc;border-radius:4px;background:white;cursor:pointer">Mark Done</button>':'—'}</td>
    </tr>`;
  }).join('');

  return `
    <div class="page-hd">
      <div class="page-hd-text">
        <div class="page-title">Work Assigned</div>
        <div class="page-sub">${myHub}</div>
      </div>
      <button class="btn-refresh" onclick="window._waDate=window._waDate;navigate('work-assigned')" title="Refresh">
        <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
      </button>
    </div>

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap">
      <div>
        <input class="form-input" style="width:180px;font-size:13px" placeholder="Search reg no. or tech..." id="wa-search-input"
          value="${window._waSearch||''}"
          oninput="debounceWaSearch(this.value)"/>
      </div>
      <div>
        <label class="form-label" style="margin-bottom:4px">Date</label>
        <input type="date" class="form-input" style="width:160px;padding:7px 10px"
          value="${selDate==='all'?todayISO:selDate}"
          onchange="window._waDate=this.value;navigate('work-assigned')"/>
      </div>
      <div style="margin-top:18px">
        <button class="btn btn-outline btn-sm" onclick="window._waDate='all';navigate('work-assigned')">All Time</button>
      </div>
      <div style="margin-top:18px">

    <div class="metrics" style="margin-bottom:16px">
      <div class="metric"><div class="metric-lbl">Total</div><div class="metric-val">${filtered.length}</div></div>
      <div class="metric"><div class="metric-lbl">Open</div><div class="metric-val mv-blue">${open}</div></div>
      <div class="metric"><div class="metric-lbl">In Progress</div><div class="metric-val mv-amber">${inProg}</div></div>
      <div class="metric"><div class="metric-lbl">Done</div><div class="metric-val mv-green">${done}</div></div>
    </div>

    ${filtered.length === 0
      ? `<div class="empty-state">No work orders found for ${selDate==='all'?'all time':fmtDateOnly(selDate+'T00:00:00')}.</div>`
      : `<div class="tw"><table>
          <thead><tr>
            <th>Vehicle</th><th>JC No.</th><th>Issue</th>
            <th>Technician</th><th>Priority</th><th>Status</th>
            <th>Assigned At</th><th>Completed At</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table></div>`}`;
}

// ─ GEO CHECK-IN / OUT ─
const GEOFENCE_RADIUS_M = 200;

function getDistanceM(lat1,lng1,lat2,lng2){
  const R=6371000, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function setAttMsg(type,msg){
  const el=document.getElementById('att-status-msg'); if(!el)return;
  const s={loading:'background:var(--blue-lt);color:var(--blue)',success:'background:var(--green-lt);color:var(--green)',error:'background:var(--red-lt);color:var(--red)',warn:'background:var(--amber-lt);color:var(--amber)'};
  el.innerHTML=msg?`<div style="padding:10px 14px;border-radius:10px;font-size:13px;font-weight:500;margin-bottom:14px;${s[type]||''}">${msg}</div>`:'';
}

const TEST_MOBILES=['9043207769','9876543210','9100000001','9000000001','9000000002','9123456789','9123456790','9123456791','9123456792','9123456793'];

function showChangeHubModal() {
  const userCityId = state.user?.city_id;
  const cityHubs   = userCityId ? HUBS.filter(h=>h.city_id===userCityId) : HUBS;
  const hubOpts    = cityHubs
    .filter(h=>h.name!==state.hub) // exclude current hub
    .map(h=>`<option value="${h.name}" data-id="${h.id}">${h.name}</option>`).join('');

  const inner = document.getElementById('modal-inner');
  inner.innerHTML = `
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">Change Hub</div>
    <div class="alert al-warn" style="margin-bottom:16px;font-size:13px;line-height:1.6">
      Changing hub will close your current session at "${state.hub}". You must check in at the new hub via geofencing.
    </div>
    <div class="form-group">
      <label class="form-label">Select new hub</label>
      <select class="form-select" id="change-hub-sel">
        <option value="">Select hub...</option>
        ${hubOpts}
      </select>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-outline" style="flex:1" onclick="closeModal()">Cancel</button>
      <button class="btn btn-blue" style="flex:1" onclick="confirmChangeHub()">Confirm Change</button>
    </div>`;
  document.getElementById('modal').style.display='flex';
}

async function confirmChangeHub() {
  const sel    = document.getElementById('change-hub-sel');
  const newHub = sel?.value;
  const newHubId = HUBS.find(h=>h.name===newHub)?.id;
  if (!newHub) { alert('Please select a hub'); return; }

  closeModal();

  // Save hub1 info before switching
  state.hub1       = state.hub;
  state.hub1Id     = state.hubId;
  state.hub1CheckIn = state.myCheckin;

  // Close current attendance session — mark checkout time
  if (state.myAttId && !_demoMode) {
    const now = new Date().toISOString();
    const checkoutTime = new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
    state.hub1CheckOut = checkoutTime;
    await sb(`attendance?id=eq.${state.myAttId}`, {
      method:'PATCH',
      body: JSON.stringify({ checkout_time: now })
    });
  }

  // Switch to new hub — clear current session, force new check-in
  state.hub       = newHub;
  state.hubId     = newHubId;
  state.hub2      = newHub;
  state.hub2Id    = newHubId;
  state.myCheckin = null;
  state.myCheckout = null;
  state.myAttId   = null;

  // Update session storage
  try { localStorage.setItem('bounce_session', JSON.stringify({
    user:state.user, hub:state.hub, hubId:state.hubId,
    hub1:state.hub1, hub1Id:state.hub1Id, hub1CheckIn:state.hub1CheckIn, hub1CheckOut:state.hub1CheckOut,
    hub2:state.hub2, myCheckin:null, myCheckout:null, myAttId:null
  })); } catch(e){}

  navigate('my-attendance');
}

async function doGeoCheckin(mode){
  // Hard validation — must have hub selected
  if (!state.hub || !state.hubId) {
    setAttMsg('error','Please select a hub before marking attendance.');
    return;
  }
  // Block check-in after 1:30 PM (skip for test numbers)
  if (mode==='checkin' && !TEST_MOBILES.includes(state.user?.mobile)) {
    const now = new Date();
    if (now.getHours() > CHECKIN_CUTOFF_HOUR || (now.getHours()===CHECKIN_CUTOFF_HOUR && now.getMinutes()>=CHECKIN_CUTOFF_MIN)) {
      setAttMsg('error','Check-in is not allowed after 1:30 PM.');
      return;
    }
  }
  const btn=document.getElementById(mode==='checkin'?'btn-checkin':'btn-checkout');
  if(btn){btn.disabled=true;btn.style.opacity='0.6';}
  setAttMsg('loading','Getting your location...');
  let position;
  try{
    position=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:10000,maximumAge:0}));
  }catch(err){
    const msg=err.code===1?'Location permission denied. Please allow location access in browser settings.':err.code===2?'Location unavailable. Try again outdoors.':'Location timed out. Please try again.';
    setAttMsg('error',msg);
    if(btn){btn.disabled=false;btn.style.opacity='1';} return;
  }
  const userLat=position.coords.latitude, userLng=position.coords.longitude, accuracy=Math.round(position.coords.accuracy);
  // Skip geofence for test numbers
  if(_demoMode||TEST_MOBILES.includes(state.user?.mobile)){
    setAttMsg('success','Location verified (test account). Marking attendance...');
    await processCheckin(mode,userLat,userLng,accuracy,null,true); return;
  }
  // Fetch hub coords
  let hubLat=null,hubLng=null;
  if(state.hub){
    const hd=await sb(`hubs?name=eq.${encodeURIComponent(state.hub)}&select=lat,lng&limit=1`);
    if(hd&&hd.length&&hd[0].lat){hubLat=hd[0].lat;hubLng=hd[0].lng;}
  }
  if(hubLat===null){
    setAttMsg('warn','Hub location not configured. Marking attendance without verification.');
    await processCheckin(mode,userLat,userLng,accuracy,null,true); return;
  }
  const dist=Math.round(getDistanceM(userLat,userLng,hubLat,hubLng));
  if(dist<=GEOFENCE_RADIUS_M){
    setAttMsg('success',`Location verified — you are ${dist}m from ${state.hub}. Marking attendance...`);
    await processCheckin(mode,userLat,userLng,accuracy,dist,true);
  }else{
    setAttMsg('error',`You are ${dist}m away from ${state.hub}. Must be within ${GEOFENCE_RADIUS_M}m. Move closer and try again.`);
    if(btn){btn.disabled=false;btn.style.opacity='1';}
  }
}

async function processCheckin(mode,lat,lng,accuracy,distanceM,withinFence){
  const t12=nowFmt(),t24=now24();
  const geoData={lat,lng,accuracy,distance_m:distanceM,within_fence:withinFence,timestamp:new Date().toISOString()};
  if(mode==='checkin'){
    let attId=null;
    if(!_demoMode){
      // Resolve hubId — use state.hubId, fall back to HUBS lookup by name
      const hubName = state.hub || null;
      let hubId = state.hubId || null;
      if (!hubId && hubName) {
        const h = HUBS.find(x => x.name === hubName);
        if (h) { hubId = h.id; state.hubId = h.id; } // also fix state
      }
      const res=await sb('attendance?on_conflict=user_id,date',{
        method:'POST',prefer:'resolution=merge-duplicates,return=representation',
        body:JSON.stringify({
          user_id:         state.user.id,
          technician_name: state.user.name,
          employee_id:     state.user.employee_id || null,
          phone_number:    state.user.mobile,
          hub_id:          hubId,
          hub_name:        hubName,
          date:            new Date().toISOString().slice(0,10),
          status:          'present',
          checkin_time:    new Date().toISOString(),
          geo_checkin:     geoData,
          approval_status: 'pending'
        })
      });
      attId=res?.[0]?.id||null;
      console.log('[checkin] saved att:', attId, 'hub:', hubName, 'hub_id:', hubId);
    }
    state.myCheckin=t12; state.myAttId=attId||'demo-att';
    if (state.hub2 && !state.hub2CheckIn) state.hub2CheckIn = t12;
    state.attendance[state.user.name]={status:'present',checkin:t24,checkout:null,hub:state.hub,att_id:attId};
    try{const s=JSON.parse(localStorage.getItem('bounce_session')||'{}');s.myCheckin=t12;s.myAttId=state.myAttId;s.myCheckinDate=TODAY;localStorage.setItem('bounce_session',JSON.stringify(s));}catch(e){}
  }else{
    if(!_demoMode&&state.myAttId&&!state.myAttId.startsWith('demo')){
      // Calculate working hours and determine final status
      const checkoutTime = new Date();
      const checkinTime  = (() => {
        if (!state.myCheckin) return null;
        const [time, ampm] = state.myCheckin.split(' ');
        let [h, m] = time.split(':').map(Number);
        if (ampm?.toLowerCase()==='pm' && h!==12) h+=12;
        if (ampm?.toLowerCase()==='am' && h===12) h=0;
        const d = new Date(); d.setHours(h,m,0,0); return d;
      })();
      const totalMins = checkinTime ? ((checkoutTime - checkinTime) / 60000) + calcHub1Mins() : 0;
      const totalHrs  = totalMins / 60;
      const finalStatus = totalHrs >= FULL_DAY_MIN_HRS ? 'present'
                        : totalHrs >= HALF_DAY_MIN_HRS ? 'half_day'
                        : 'absent';
      await sb(`attendance?id=eq.${state.myAttId}`,{method:'PATCH',body:JSON.stringify({
        checkout_time: checkoutTime.toISOString(),
        total_working_hours: parseFloat(totalHrs.toFixed(2)),
        status: finalStatus,
        geo_checkout:geoData,
        updated_at:new Date().toISOString()
      })});
    }
    state.myCheckout=t12;
    try{const s=JSON.parse(localStorage.getItem('bounce_session')||'{}');s.myCheckout=t12;localStorage.setItem('bounce_session',JSON.stringify(s));}catch(e){}
  }
  setTimeout(()=>{closeModal&&closeModal();navigate('my-attendance');},1200);
}

// ─ INIT ─
async function initApp() {
  await bootstrap();
  try {
    const saved = localStorage.getItem('bounce_session');
    if (saved) {
      const sess = JSON.parse(saved);
      if (sess && sess.user) {
        state.user       = sess.user;
        state.hub        = sess.hub        || null;
        state.hubId      = sess.hubId      || null;
        // Only restore checkin state if it's from today
        const isToday = sess.myCheckinDate === TODAY;
        state.myCheckin  = (isToday && sess.myCheckin)  ? sess.myCheckin  : null;
        state.myCheckout = (isToday && sess.myCheckout) ? sess.myCheckout : null;
        state.myAttId    = (isToday && sess.myAttId)    ? sess.myAttId    : null;
        if (sess.dashFilterCity) _dashFilterCity = sess.dashFilterCity;
        if (sess.dashFilterHub)  _dashFilterHub  = sess.dashFilterHub;
        // Only restore hub1/hub2 if session is from today
        const sessDate = sess.myCheckinDate || '';
        if (sess.hub1 && sessDate === TODAY) {
          state.hub1=sess.hub1; state.hub1Id=sess.hub1Id;
          state.hub1CheckIn=sess.hub1CheckIn; state.hub1CheckOut=sess.hub1CheckOut;
        }
        if (sess.hub2 && sessDate === TODAY) {
          state.hub2=sess.hub2; state.hub2Id=sess.hub2Id; state.hub2CheckIn=sess.hub2CheckIn;
        }
        if (state.user.role === 'hub_manager' && state.hubId) {
          await Promise.all([loadAttendanceForHub(state.hubId), loadJobsForHub(state.hubId), loadVehiclesForHub(state.hub)]);
        } else if (state.user.role === 'technician') {
          await loadMyAttendance(state.user.id); await loadMyJobs();
        } else { await loadAllHubsData(); }
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('app-shell').style.display  = 'block';
        renderTopbar(); renderNav();
        const defaultPage = state.user.role !== 'technician' ? 'dashboard' : 'my-attendance';
        navigate(sess.currentPage || defaultPage);
        return;
      }
    }
  } catch(e) { localStorage.removeItem('bounce_session'); }
  document.getElementById('login-page').style.display = 'flex';
}
initApp();
</script>
