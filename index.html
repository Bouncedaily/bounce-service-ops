<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bounce Service Ops</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root {
  --blue:#1a56db; --blue-lt:#ebf0ff; --blue-dk:#1040b0;
  --green:#0f9e6e; --green-lt:#e6f7f2;
  --red:#e02424; --red-lt:#fef2f2;
  --amber:#b45309; --amber-lt:#fef3c7;
  --g50:#f9fafb; --g100:#f3f4f6; --g200:#e5e7eb;
  --g300:#d1d5db; --g400:#9ca3af; --g500:#6b7280;
  --g600:#4b5563; --g700:#374151; --g800:#1f2937; --g900:#111827;
  --white:#fff; --r:10px; --rlg:14px;
  --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
  --sh-md:0 4px 16px rgba(0,0,0,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--g50);color:var(--g800);min-height:100vh;font-size:15px}

/* ─ TOPBAR ─ */
.topbar{background:var(--white);border-bottom:1px solid var(--g200);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:var(--g900);text-decoration:none}
.logo-mark{width:32px;height:32px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-mark svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.topbar-right{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--blue-lt);color:var(--blue);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.user-meta{line-height:1.25}
.user-name{font-size:13px;font-weight:600;color:var(--g800)}
.user-sub{font-size:11px;color:var(--g400)}
.hub-tag{font-size:11px;padding:3px 9px;background:var(--blue-lt);color:var(--blue);border-radius:20px;font-weight:500;white-space:nowrap}
.btn-logout{font-size:12px;padding:5px 12px;border:1px solid var(--g200);border-radius:8px;background:var(--white);color:var(--g500);cursor:pointer;font-family:inherit}
.btn-logout:hover{background:var(--g50)}
@media(max-width:640px){.user-meta,.hub-tag{display:none}}

/* ─ LAYOUT ─ */
.layout{display:flex;min-height:calc(100vh - 56px)}
.sidebar{width:216px;background:var(--white);border-right:1px solid var(--g200);padding:12px 0;flex-shrink:0}
.si{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:14px;color:var(--g500);cursor:pointer;border-left:3px solid transparent;transition:all .15s;user-select:none}
.si:hover{background:var(--g50);color:var(--g800)}
.si.active{background:var(--blue-lt);color:var(--blue);border-left-color:var(--blue);font-weight:500}
.si svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.si-section{font-size:10px;font-weight:600;color:var(--g400);text-transform:uppercase;letter-spacing:.08em;padding:16px 20px 4px}
.content{flex:1;padding:28px 24px;overflow:auto}
@media(max-width:700px){
  .sidebar{display:none}
  .content{padding:16px 14px 82px}
}

/* ─ BOTTOM NAV ─ */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--g200);z-index:100;padding:4px 0 env(safe-area-inset-bottom,4px)}
.bnt{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;cursor:pointer;border:none;background:none;font-family:inherit;color:var(--g400);font-size:10px;font-weight:500}
.bnt svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bnt.active{color:var(--blue)}
@media(max-width:700px){.bottom-nav{display:flex}}

/* ─ COMMON ─ */
.page-hd{margin-bottom:20px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.page-hd-text{flex:1}
.page-title{font-size:20px;font-weight:600;color:var(--g900);margin-bottom:2px}
.btn-refresh{display:flex;align-items:center;gap:6px;padding:7px 13px;border:1px solid var(--g200);border-radius:var(--r);background:var(--white);color:var(--g600);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;flex-shrink:0;transition:all .15s}
.btn-refresh:hover{background:var(--g50);border-color:var(--g300)}
.btn-refresh svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s}
.btn-refresh.spinning svg{transform:rotate(360deg)}
.page-sub{font-size:13px;color:var(--g400)}
.card{background:var(--white);border:1px solid var(--g200);border-radius:var(--rlg);padding:20px;box-shadow:var(--sh);margin-bottom:16px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.metric{background:var(--white);border:1px solid var(--g200);border-radius:var(--r);padding:14px 16px}
.metric-lbl{font-size:11px;color:var(--g400);font-weight:500;margin-bottom:4px}
.metric-val{font-size:26px;font-weight:600;color:var(--g900);line-height:1}
.mv-blue{color:var(--blue)} .mv-green{color:var(--green)} .mv-amber{color:var(--amber)} .mv-red{color:var(--red)}
.tw{background:var(--white);border:1px solid var(--g200);border-radius:var(--rlg);overflow:hidden;box-shadow:var(--sh);margin-bottom:20px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:480px}
thead tr{background:var(--g50);border-bottom:1px solid var(--g200)}
th{padding:10px 14px;text-align:left;font-weight:600;font-size:11px;color:var(--g500);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
td{padding:11px 14px;color:var(--g700);border-bottom:1px solid var(--g100);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--g50)}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;display:inline-block;white-space:nowrap}
.b-present{background:var(--green-lt);color:var(--green)}
.b-absent{background:var(--red-lt);color:var(--red)}
.b-leave{background:var(--amber-lt);color:var(--amber)}
.b-open{background:var(--g100);color:var(--g600)}
.b-inprog{background:var(--blue-lt);color:var(--blue)}
.b-done{background:var(--green-lt);color:var(--green)}
.b-high{background:#fef2f2;color:#b91c1c}
.b-med{background:var(--amber-lt);color:#92400e}
.b-low{background:#f0fdf4;color:#166534}
.fl{display:flex} .fc{flex-direction:column} .g8{gap:8px} .g12{gap:12px} .g16{gap:16px}
.ai-c{align-items:center} .jc-sb{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:var(--r);font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;border:none;transition:all .15s}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-blue{background:var(--blue);color:#fff} .btn-blue:hover{background:var(--blue-dk)}
.btn-green{background:var(--green);color:#fff} .btn-green:hover{background:#0a7a55}
.btn-red{background:var(--red);color:#fff} .btn-red:hover{background:#c81e1e}
.btn-outline{background:var(--white);border:1px solid var(--g200);color:var(--g700)} .btn-outline:hover{background:var(--g50)}
.btn-ghost{background:none;border:none;color:var(--g500);cursor:pointer;font-family:inherit;font-size:14px;padding:4px 0}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-full{width:100%}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--g600);margin-bottom:5px}
.form-input,.form-select{width:100%;padding:10px 13px;border:1px solid var(--g200);border-radius:var(--r);font-size:15px;font-family:inherit;color:var(--g800);background:var(--white);outline:none;transition:border .15s,box-shadow .15s}
.form-input:focus,.form-select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.12)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:500px){.form-row{grid-template-columns:1fr}}
.sel-sm{padding:5px 8px;font-size:12px;border:1px solid var(--g200);border-radius:6px;font-family:inherit;color:var(--g700);background:var(--white)}
.alert{padding:11px 14px;border-radius:var(--r);font-size:13px;margin-bottom:14px;font-weight:500;display:flex;align-items:center;gap:8px}
.alert svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.al-success{background:var(--green-lt);color:var(--green)}
.al-error{background:var(--red-lt);color:var(--red)}
.al-info{background:var(--blue-lt);color:var(--blue)}
.al-warn{background:var(--amber-lt);color:var(--amber)}
.divider{height:1px;background:var(--g100);margin:20px 0}
.empty-state{text-align:center;padding:40px 20px;color:var(--g400);font-size:14px}
.mono{font-family:'DM Mono',monospace}

/* ─ LOGIN ─ */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--g50)}
.login-card{background:var(--white);border:1px solid var(--g200);border-radius:18px;padding:36px 32px;width:100%;max-width:420px;box-shadow:var(--sh-md)}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.login-logo-mark{width:40px;height:40px;background:var(--blue);border-radius:10px;display:flex;align-items:center;justify-content:center}
.login-logo-mark svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.login-title{font-size:22px;font-weight:700;color:var(--g900);margin-bottom:4px}
.login-sub{font-size:13px;color:var(--g400);margin-bottom:24px}
.step{display:none} .step.active{display:block}
.phone-row{display:flex;gap:8px}
.phone-prefix{padding:10px 12px;border:1px solid var(--g200);border-radius:var(--r);font-size:15px;font-family:inherit;color:var(--g700);background:var(--g50);white-space:nowrap}

.user-preview{background:var(--g50);border:1px solid var(--g200);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:16px}
.up-avatar{width:40px;height:40px;border-radius:50%;background:var(--blue-lt);color:var(--blue);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.up-name{font-size:15px;font-weight:600;color:var(--g900)}
.up-role{font-size:12px;color:var(--g400)}

.step-back{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--g500);cursor:pointer;margin-bottom:20px;background:none;border:none;font-family:inherit}
.step-back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.step-back:hover{color:var(--g800)}

/* ─ CHECK-IN ─ */
.checkin-hero{background:var(--white);border:1px solid var(--g200);border-radius:var(--rlg);padding:28px 24px;text-align:center;box-shadow:var(--sh);margin-bottom:16px}
.clock-big{font-family:'DM Mono',monospace;font-size:44px;font-weight:500;color:var(--g900);letter-spacing:-2px;margin:6px 0 2px}
.date-lbl{font-size:13px;color:var(--g400);margin-bottom:20px}
.ci-times{display:flex;justify-content:center;gap:36px;margin:12px 0 24px}
.ci-item{display:flex;flex-direction:column;align-items:center;gap:4px}
.ci-lbl{font-size:11px;color:var(--g400);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.ci-val{font-size:17px;font-weight:600;font-family:'DM Mono',monospace;color:var(--g800)}
.ci-val.empty{color:var(--g300)}

/* ─ QR GRID ─ */
.qr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.qr-card{background:var(--white);border:1px solid var(--g200);border-radius:var(--rlg);padding:20px;text-align:center;box-shadow:var(--sh)}
.qr-hub-name{font-size:13px;font-weight:600;color:var(--g700);margin-bottom:2px}
.qr-date{font-size:11px;color:var(--g400);margin-bottom:14px}
.qr-wrap{display:flex;justify-content:center;margin-bottom:12px}
.qr-inner{padding:10px;border:1px solid var(--g200);border-radius:8px;display:inline-block}
.qr-token{font-size:9px;font-family:'DM Mono',monospace;color:var(--g400);word-break:break-all;margin-bottom:12px}
.print-note{font-size:11px;color:var(--g400);background:var(--g50);border-radius:6px;padding:8px 10px;margin-bottom:12px}

/* ─ SCANNER MODAL ─ */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--white);border-radius:var(--rlg);padding:28px 24px;width:100%;max-width:380px;position:relative}
.modal-close{position:absolute;top:14px;right:14px;background:var(--g100);border:none;cursor:pointer;color:var(--g700);font-size:18px;line-height:1;padding:8px;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;z-index:999}
.modal-close:hover{background:var(--g200)}
.modal-title{font-size:16px;font-weight:600;margin-bottom:4px;color:var(--g900)}
.modal-sub{font-size:13px;color:var(--g400);margin-bottom:18px}
.scanner-wrap{border-radius:var(--r);overflow:hidden;background:var(--g900);min-height:260px;position:relative}
#reader{width:100%!important}
#reader video{border-radius:var(--r)}
.wo-form-wrap{background:var(--g50);border:1px solid var(--g200);border-radius:var(--rlg);padding:20px;margin-bottom:20px}
.wo-form-title{font-size:14px;font-weight:600;color:var(--g700);margin-bottom:14px}
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.photo-slot{border:2px dashed var(--g200);border-radius:var(--r);aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;background:var(--g50);transition:border-color .15s}
.photo-slot:hover{border-color:var(--blue)}
.photo-slot.captured{border:2px solid var(--green);background:var(--g900)}
.photo-slot img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.photo-slot-label{font-size:11px;font-weight:600;color:var(--g400);text-transform:uppercase;letter-spacing:.05em;margin-top:6px;position:relative;z-index:1}
.photo-slot-icon{font-size:24px;position:relative;z-index:1}
.photo-slot.captured .photo-slot-label{color:#fff;background:rgba(0,0,0,.5);padding:2px 6px;border-radius:4px}
.photo-slot.captured .photo-slot-icon{display:none}
.photo-retake{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:4px;font-size:10px;padding:3px 7px;cursor:pointer;z-index:2;font-family:inherit}
.photo-progress{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--g50);border:1px solid var(--g200);border-radius:var(--r);font-size:13px;margin-bottom:12px}
.photo-dots{display:flex;gap:6px}
.photo-dot{width:10px;height:10px;border-radius:50%;background:var(--g200);transition:background .2s}
.photo-dot.done{background:var(--green)}
.camera-preview{width:100%;border-radius:var(--r);overflow:hidden;background:var(--g900);position:relative;aspect-ratio:4/3}
.camera-preview video{width:100%;height:100%;object-fit:cover;display:block}
.camera-capture-btn{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;background:#fff;border:4px solid var(--g300);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-md)}
.camera-capture-btn:hover{border-color:var(--blue)}
.camera-capture-btn::after{content:'';width:44px;height:44px;background:var(--blue);border-radius:50%;display:block}
.photo-modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.photo-modal-title{color:#fff;font-size:16px;font-weight:600;margin-bottom:6px;text-align:center}
.photo-modal-sub{color:rgba(255,255,255,.6);font-size:13px;margin-bottom:16px;text-align:center}
.photo-preview{width:100%;max-width:380px;aspect-ratio:4/3;background:#111;border-radius:var(--r);overflow:hidden;position:relative;margin-bottom:14px}
.photo-preview video{width:100%;height:100%;object-fit:cover}
.photo-preview canvas{width:100%;height:100%;object-fit:cover;display:none}
.photo-preview img{width:100%;height:100%;object-fit:cover;display:none}
.photo-side-label{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em}
.photo-sides{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:380px;margin-bottom:14px}
.photo-thumb{aspect-ratio:1;border-radius:6px;overflow:hidden;border:2px solid transparent;position:relative;background:rgba(255,255,255,.1)}
.photo-thumb.done{border-color:var(--green)}
.photo-thumb.active{border-color:#fff}
.photo-thumb img{width:100%;height:100%;object-fit:cover}
.photo-thumb-label{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.6);color:#fff;font-size:9px;text-align:center;padding:2px;font-weight:600}
.photo-thumb .tick{position:absolute;top:3px;right:3px;width:16px;height:16px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff}
.photo-actions{display:flex;gap:10px;width:100%;max-width:380px}
.btn-capture{flex:1;padding:13px;background:var(--white);color:var(--g900);border:none;border-radius:var(--r);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-retake{padding:13px 16px;background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:var(--r);font-size:13px;cursor:pointer;font-family:inherit;display:none}
.btn-photo-done{width:100%;max-width:380px;padding:13px;background:var(--green);color:#fff;border:none;border-radius:var(--r);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px;display:none}

/* ─ SUPABASE NOTE ─ */
.sb-note{background:var(--blue-lt);border:1px solid #bcd0f7;border-radius:var(--r);padding:12px 14px;font-size:12px;color:var(--blue-dk);margin-bottom:20px;line-height:1.6}
.sb-note strong{font-weight:600}
.sb-note code{font-family:'DM Mono',monospace;background:rgba(26,86,219,.1);padding:1px 5px;border-radius:4px;font-size:11px}
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login-page" class="login-page">

    <!-- Step 1: Mobile -->
    <div class="step active" id="step-mobile">
      <div class="login-title">Welcome back</div>
      <div class="login-sub">Enter your registered Bounce mobile number</div>
      <div id="s1-alert"></div>
      <div class="form-group">
        <label class="form-label">Mobile number</label>
        <div class="phone-row">
          <span class="phone-prefix">+91</span>
          <input class="form-input" id="mobile-input" type="tel" inputmode="numeric" maxlength="10" placeholder="98XXXXXXXX" style="flex:1" oninput="onMobileInput(this.value)" onkeydown="if(event.key==='Enter')sendOTP()"/>
        </div>
      </div>
      <!-- Role selector shown only for test number -->
      <div id="test-role-selector" style="display:none;margin-bottom:14px">
        <label class="form-label">Test as role</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <button class="btn btn-outline" id="tr-hub_manager"   onclick="setTestRole('hub_manager')"   style="font-size:13px;padding:8px">Hub Manager</button>
          <button class="btn btn-outline" id="tr-area_manager"  onclick="setTestRole('area_manager')"  style="font-size:13px;padding:8px">Area Manager</button>
          <button class="btn btn-outline" id="tr-head"          onclick="setTestRole('head')"          style="font-size:13px;padding:8px">Head</button>
          <button class="btn btn-outline" id="tr-technician"    onclick="setTestRole('technician')"    style="font-size:13px;padding:8px">Technician</button>
        </div>
      </div>
      <button class="btn btn-blue btn-full" style="padding:13px;" onclick="sendOTP()">Login</button>
    </div>

    <!-- Step 2: OTP removed — direct mobile login -->

    <!-- Step 3: Hub selection (managers only) -->
    <div class="step" id="step-hub">
      <div class="login-title">Select your hub</div>
      <div class="login-sub">Choose the hub you're managing today</div>
      <div id="s3-alert"></div>
      <div id="user-preview" class="user-preview"></div>
      <div class="form-group">
        <label class="form-label">Hub for today</label>
        <select class="form-select" id="hub-select">
          <option value="">Select hub...</option>
        </select>
      </div>
      <button class="btn btn-blue btn-full" style="padding:13px;" onclick="finishLogin()">Continue</button>
    </div>

    <!-- Step 3b: Technician direct entry -->
    <div class="step" id="step-tech-ready">
      <div id="user-preview-tech" class="user-preview"></div>
      <div class="al-info alert" id="tech-ready-note" style="margin-bottom:0">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="tech-ready-msg">Your hub will be set automatically when you scan the QR code at the entrance.</span>
      </div>
      <button class="btn btn-blue btn-full" style="padding:13px;margin-top:16px" id="tech-ready-btn" onclick="finishLogin()">Continue</button>
    </div>
  </div>

// ─ SUPABASE CORE ─
async function sb(path, opts={}) {
  try {
    const r = await fetch(SUPABASE_URL+'/rest/v1/'+path, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer '+SUPABASE_KEY,
        'Content-Type': 'application/json',
        'Prefer': opts.prefer || '',
        ...opts.headers
      },
      method: opts.method || 'GET',
      body: opts.body || undefined
    });
    if (!r.ok) { console.error('Supabase error', r.status, await r.text()); return null; }
    const txt = await r.text();
    return txt ? JSON.parse(txt) : [];
  } catch(e) {
    console.error('Supabase network error:', e);
    return null;
  }
}

// ─ BOOTSTRAP: load hubs + users + vehicles from Supabase, fallback to demo ─
async function bootstrap() {
  const [hubRows, userRows] = await Promise.all([
    sb('hubs?select=id,name,qr_token,city_id&order=name'),
    sb('users?select=id,name,mobile,role,city_id,hub_id&order=name'),
  ]);
  // Hubs
  if (hubRows && hubRows.length) {
    HUBS = hubRows;
    hubRows.forEach(h => { HUB_TOKENS[h.name] = h.qr_token; });

    _demoMode = true;
    HUBS = DEMO_HUBS;
    DEMO_HUBS.forEach(h => { HUB_TOKENS[h.name] = h.qr_token; });

    ALL_USERS = Object.values(DEMO_USERS);
    TECHNICIANS = ALL_USERS.filter(u=>u.role==='technician').map(u=>u.name);

  // Load cities into cache for sync lookups

// ─ LOAD TODAY'S ATTENDANCE FOR A HUB ─
async function loadAttendanceForHub(hubId) {
  state.attendance = {};
  const hubName = HUBS.find(h=>h.id===hubId)?.name || '';
  if (_demoMode) {
    // Demo mode only — use fake data
    DEMO_ATTENDANCE.filter(r=>r.hub_id===hubId).forEach(r => {
      const name = r.users?.name; if (!name) return;
      state.attendance[name] = {
        status: r.status,
        checkin:  r.checkin_time  ? new Date(r.checkin_time).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false}) : null,
        checkout: r.checkout_time ? new Date(r.checkout_time).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false}) : null,
        hub: hubName, hub_id: hubId, att_id: r.id
      };
    });
    return;
  }
  // Live mode — fetch from Supabase, show empty if no rows yet (no fallback to demo)
  const rows = await sb(`attendance?hub_id=eq.${hubId}&date=eq.${TODAY}&select=id,status,checkin_time,checkout_time,user_id,users(name)`);
  if (rows) {
    rows.forEach(r => {
      const name = r.users?.name; if (!name) return;
      state.attendance[name] = {
        status:   r.status,
        checkin:  r.checkin_time  ? new Date(r.checkin_time).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false}) : null,
        checkout: r.checkout_time ? new Date(r.checkout_time).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false}) : null,
        hub: hubName, hub_id: hubId, att_id: r.id
      };
    });
  }
}

// ─ LOAD TODAY'S WORK ORDERS FOR A HUB ─
async function loadJobsForHub(hubId) {
  const hubName = HUBS.find(h=>h.id===hubId)?.name || '';
  let rows;
  if (_demoMode) {
    rows = DEMO_JOBS.filter(r=>r.hub_id===hubId);
  } else {
    rows = await sb(`work_orders?hub_id=eq.${hubId}&select=id,wo_number,vehicle_reg,issue,priority,status,wo_type,assigned_at,users!work_orders_assigned_tech_id_fkey(name)&order=assigned_at.desc`) || [];
  }
  state.jobs = [];
  rows.forEach(r => {
    state.jobs.push({
      db_id:   r.id, id: r.wo_number, vehicle: r.vehicle_reg,
      issue:   r.issue, tech: r.users?.name || 'Unassigned',
      hub:     hubName, priority: r.priority, status: r.status,
      wo_type: r.wo_type || 'running_repair',
      time:    new Date(r.assigned_at).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false})
    });
  });
}

// ─ LOAD ALL HUBS DATA (area_manager / head) ─
async function loadAllHubsData() {
  // Load attendance across all hubs
  let attRows = null;
  if (_demoMode) {
    attRows = DEMO_ATTENDANCE.map(r=>({...r, hubs:{ name: HUBS.find(h=>h.id===r.hub_id)?.name||'' }}));
  } else {
    attRows = await sb(`attendance?date=eq.${TODAY}&select=id,status,checkin_time,checkout_time,user_id,hub_id,users(name),hubs(name)`) || [];
  }
  state.attendance = {};
  attRows.forEach(r => {
    const name = r.users?.name; if (!name) return;
    state.attendance[name] = {
      status:   r.status,
      checkin:  r.checkin_time  ? new Date(r.checkin_time).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false})  : null,
      checkout: r.checkout_time ? new Date(r.checkout_time).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false}) : null,
      hub: r.hubs?.name||'', hub_id: r.hub_id, att_id: r.id
    };
  });
  // Load jobs across all hubs
  let jobRows = null;
  if (!_demoMode) {
    jobRows = await sb(`work_orders?select=id,wo_number,vehicle_reg,issue,priority,status,wo_type,assigned_at,hub_id,users!work_orders_assigned_tech_id_fkey(name),hubs(name)&order=assigned_at.desc`);

    db_id: r.id, id: r.wo_number, vehicle: r.vehicle_reg, issue: r.issue,
    tech: r.users?.name||'Unassigned', hub: r.hubs?.name||'',
    priority: r.priority, status: r.status, wo_type: r.wo_type||'running_repair',
    time: new Date(r.assigned_at).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false})
  }));
}

// ─ LOAD MY ATTENDANCE (technician) ─
async function loadMyAttendance(userId) {
  let rows;
  if (_demoMode) {
    rows = null; // demo tech starts fresh
  } else {
    rows = await sb(`attendance?user_id=eq.${userId}&date=eq.${TODAY}&select=id,status,checkin_time,checkout_time,hub_id,hubs(name)&limit=1`);
  }
  if (rows && rows.length) {
    const r = rows[0];
    state.myCheckin  = r.checkin_time  ? new Date(r.checkin_time).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true})  : null;
    state.myCheckout = r.checkout_time ? new Date(r.checkout_time).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true}) : null;
    state.hub = r.hubs?.name || null; state.hubId = r.hub_id || null; state.myAttId = r.id;
    if (state.hub) state.attendance[state.user.name] = { status:r.status, checkin:state.myCheckin, checkout:state.myCheckout, hub:state.hub, hub_id:state.hubId, att_id:r.id };
  } else {
    state.myCheckin = null; state.myCheckout = null; state.myAttId = null;
  }
}

// ─ LOAD MY JOBS (technician) ─
async function loadMyJobs() {
  let rows;
  if (_demoMode) {
    rows = DEMO_JOBS.filter(j=>j.users?.name===state.user.name);
  } else {
    rows = await sb(`work_orders?assigned_tech_id=eq.${state.user.id}&select=id,wo_number,vehicle_reg,issue,priority,status,wo_type,assigned_at,hubs(name)&order=assigned_at.desc`) || [];
  }
  state.jobs = [];
  // Collect all reg numbers to fetch JC details in one query
  const regNums = [...new Set(rows.map(r=>r.vehicle_reg).filter(Boolean))];
  let jcMap = {};
  if (!_demoMode && regNums.length) {
    const regFilter = regNums.map(r=>`"${r}"`).join(',');
    const jcRows = await sb(`draft_jc?reg_number=in.(${regFilter})&select=reg_number,job_card_number,parts_to_be_changed,submission_type,current_jc_status&order=job_card_opened_date.desc`) || [];
    // Map by reg_number — take most recent JC per vehicle
    jcRows.forEach(j=>{ if (!jcMap[j.reg_number]) jcMap[j.reg_number] = j; });
  }
  rows.forEach(r => {
    const jc = jcMap[r.vehicle_reg] || {};
    state.jobs.push({
      db_id:              r.id,
      id:                 r.wo_number,
      vehicle:            r.vehicle_reg,
      issue:              r.issue,
      tech:               state.user.name,
      hub:                r.hubs?.name||'',
      priority:           r.priority,
      status:             r.status,
      wo_type:            r.wo_type||'running_repair',
      time:               new Date(r.assigned_at).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false}),
      // JC details from draft_jc
      jc_number:          jc.job_card_number || null,
      parts_to_be_changed:jc.parts_to_be_changed || null,
      submission_type:    jc.submission_type || r.wo_type==='oos' ? 'OOS' : 'Running Repair',
    });
  });
}

// ─ SAVE ATTENDANCE (upsert) ─
async function saveCheckin(hubId, userId) {
  if (_demoMode) return 'demo-att-'+Date.now();
  const now = new Date().toISOString();
  const payload = { user_id: userId, hub_id: hubId, date: TODAY, status: 'present', checkin_time: now };
  const result = await sb('attendance?on_conflict=user_id,date', {
    method: 'POST', prefer: 'resolution=merge-duplicates,return=representation',
    body: JSON.stringify(payload)
  });
  return result && result.length ? result[0].id : 'demo-att-fallback';
}

async function saveCheckout(attId) {
  if (_demoMode) return;
  const now = new Date().toISOString();
  await sb(`attendance?id=eq.${attId}`, { method: 'PATCH', body: JSON.stringify({ checkout_time: now }) });
}

// ─ SAVE ATTENDANCE OVERRIDE (manager) ─
async function saveAttOverride(techName, status, hubId) {
  if (_demoMode) return;
  const user = ALL_USERS.find(u=>u.name===techName);
  if (!user) return;
  const now = new Date().toISOString();
  await sb('attendance?on_conflict=user_id,date', {
    method: 'POST', prefer: 'resolution=merge-duplicates',
    body: JSON.stringify({ user_id: user.id, hub_id: hubId, date: TODAY, status,
      checkin_time: status==='present' ? now : null, checkout_time: null })
  });
}

// ─ SAVE WORK ORDER ─
async function saveWorkOrder(wo) {
  if (_demoMode) { return { ...wo, id: 'demo-wo-'+Date.now() }; }
  const r = await fetch(SUPABASE_URL+'/rest/v1/work_orders', {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer '+SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    },
    body: JSON.stringify(wo)
  });
  if (!r.ok) {
    const err = await r.text();
    console.error('saveWorkOrder error:', r.status, err);
    return null;
  }
  const data = await r.json();
  return data && data.length ? data[0] : data;
}

// ─ UPDATE WORK ORDER STATUS ─
async function updateWOStatus(dbId, status) {
  if (_demoMode || !dbId || dbId.startsWith('demo')) return;
  const patch = { status };
  if (status === 'Done') patch.completed_at = new Date().toISOString();
  await sb(`work_orders?id=eq.${dbId}`, { method: 'PATCH', body: JSON.stringify(patch) });
}

// ─ AUTH FLOW ─

function setAlert(id, type, msg) {
  document.getElementById(id).innerHTML = msg
    ? `<div class="alert al-${type}">${msg}</div>` : '';
}

async function sendOTP() {
  const mobile = document.getElementById('mobile-input').value.trim();
  if (!/^\d{10}$/.test(mobile)) { setAlert('s1-alert','error','Enter a valid 10-digit mobile number.'); return; }
  const btn = document.querySelector('#step-mobile .btn-blue');
  btn.textContent = 'Checking...'; btn.disabled = true;
  let user = null;
  try { user = await fetchUserByMobile(mobile); } catch(e) {}
  btn.textContent = 'Login'; btn.disabled = false;
  if (!user) { setAlert('s1-alert','error','Mobile number not registered. Contact your admin.'); return; }
  state.pendingUser = user;
  proceedAfterAuth(user);
}

function proceedAfterAuth(u) {
  const initials = u.name.split(' ').map(x=>x[0]).join('').slice(0,2);
  const previewHTML = `<div class="up-avatar">${initials}</div><div><div class="up-name">${u.name}</div><div class="up-role">${ROLE_LABEL[u.role]||u.role}</div></div>`;
  if (u.role === 'hub_manager') {
    // If user has an assigned hub in DB, skip hub selection entirely
    if (u.assigned_hub_name) {
      state.pendingUser = u;
      state.pendingUser._autoHub = u.assigned_hub_name;
    }
    document.getElementById('user-preview').innerHTML = previewHTML;
    const sel = document.getElementById('hub-select');
    sel.innerHTML = '<option value="">Select hub...</option>';
    const cityHubs = u.city_id ? HUBS.filter(h=>h.city_id===u.city_id) : HUBS;
    (cityHubs.length ? cityHubs : HUBS).forEach(h=>{
      const o=document.createElement('option'); o.value=h.name; o.textContent=h.name;
      if (h.name === u.assigned_hub_name) o.selected = true;
      sel.appendChild(o);
    });
    goStep('step-hub');
  } else {
    document.getElementById('user-preview-tech').innerHTML = previewHTML;
    const msgEl = document.getElementById('tech-ready-msg');
    const btnEl = document.getElementById('tech-ready-btn');
    if (u.role === 'technician') {
      msgEl.textContent = 'Your hub will be set automatically when you scan the QR code at the entrance.';
      btnEl.textContent = 'Go to Attendance';
    } else if (u.role === 'area_manager') {
      msgEl.textContent = 'You will see attendance and jobs across all hubs in your city.';
      btnEl.textContent = 'Go to Dashboard';
    } else {
      msgEl.textContent = 'You will see attendance and jobs across all cities and hubs.';
      btnEl.textContent = 'Go to Dashboard';
    }
    goStep('step-tech-ready');
  }
}

function goStep(id) {
  document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

async function finishLogin() {
  state.user = state.pendingUser;
  if (state.user.role === 'hub_manager') {
    const hubName = document.getElementById('hub-select').value;
    if (!hubName) { setAlert('s3-alert','error','Please select your hub for today.'); return; }
    state.hub = hubName;
    const hubObj = HUBS.find(h=>h.name===hubName);
    state.hubId = hubObj ? hubObj.id : null;
    const btn = document.querySelector('#step-hub .btn-blue');
    btn.textContent = 'Loading...'; btn.disabled = true;
    // Load everything in parallel
    await Promise.all([
      loadAttendanceForHub(state.hubId),
      loadJobsForHub(state.hubId),
      loadVehiclesForHub(state.hub),
      // Pre-fetch JC data so WO tab is instant
      loadDraftJCForHub(state.hub).then(rows => {
        if (!window._jcCache) window._jcCache = {};
        window._jcCache[state.hub] = rows;
      })
    ]);
    btn.textContent = 'Continue'; btn.disabled = false;
  } else if (state.user.role === 'technician') {
    // Hub set by QR scan
    state.hub = null; state.hubId = null;
    state.myCheckin = null; state.myCheckout = null;
    const btn = document.querySelector('#step-tech-ready .btn-blue');
    btn.textContent = 'Loading...'; btn.disabled = true;
    await loadMyAttendance(state.user.id);
    await loadMyJobs();
    btn.textContent = 'Go to Attendance'; btn.disabled = false;
  } else {
    // area_manager / head — no hub filter, load all hubs data
    state.hub = null; state.hubId = null;
    const btn = document.querySelector('#step-tech-ready .btn-blue');
    btn.textContent = 'Loading...'; btn.disabled = true;
    await loadAllHubsData();
    btn.textContent = 'Go to Dashboard'; btn.disabled = false;
  }
  // Log login activity
  if (!_demoMode) {
    sb('login_activity', { method:'POST', prefer:'return=minimal',
      body: JSON.stringify({
        user_id:   state.user.id,
        user_name: state.user.name,
        mobile:    state.user.mobile,
        role:      state.user.role,
        action:    'login',
        hub_name:  state.hub || null,
        city:      null
      })
    });
    sb(`users?id=eq.${state.user.id}`, { method:'PATCH', body: JSON.stringify({last_login_at: new Date().toISOString()}) });
  }
  document.getElementById('login-page').style.display='none';
  document.getElementById('app-shell').style.display='block';
  renderTopbar(); renderNav();
  navigate(state.user.role!=='technician' ? 'dashboard' : 'my-attendance');
}

async function refreshPage(page) {
  const btn = document.querySelector('.btn-refresh');
  if (btn) { btn.classList.add('spinning'); btn.disabled = true; }
  if (state.user.role === 'hub_manager' && state.hubId) {
    await loadAttendanceForHub(state.hubId);
    if (page === 'workorders') await loadJobsForHub(state.hubId);
  } else if (state.user.role === 'area_manager' || state.user.role === 'head') {
    await loadAllHubsData();
  }
  navigate(page);
  // Re-enable after navigation re-renders
  setTimeout(()=>{
    const b = document.querySelector('.btn-refresh');
    if (b) { b.classList.remove('spinning'); b.disabled = false; }
  }, 500);
}

function doLogout() {
  // Technician: warn if completed jobs not closed in DMS
  if (state.user?.role === 'technician') {
    const doneJobs = state.jobs.filter(j => j.status === 'Done');
    if (doneJobs.length > 0) {
      const jobList = doneJobs.map(j =>
        `<div style="padding:6px 0;border-bottom:1px solid var(--g100);font-size:13px">
          <strong>${j.vehicle}</strong>
          ${j.jc_number ? `<span class="mono" style="color:var(--g400);font-size:12px;margin-left:6px">${j.jc_number}</span>` : ''}
        </div>`
      ).join('');
      document.getElementById('modal-inner').innerHTML = `
        <button class="modal-close" onclick="closeModal();_doLogoutNow()">✕</button>
        <div class="modal-title">⚠️ Unclosed Job Cards</div>
        <div class="modal-sub">Please ask your Service Manager to close these job cards in DMS before you leave.</div>
        <div style="margin:12px 0;max-height:200px;overflow-y:auto">${jobList}</div>
        <div class="al-warn alert" style="margin-bottom:12px">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          Ask your SM to close the above job card(s) in DMS.
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-outline btn-full" onclick="closeModal()">Go Back</button>
          <button class="btn btn-red btn-full" onclick="closeModal();_doLogoutNow()">Logout Anyway</button>
        </div>`;
      document.getElementById('modal').style.display='flex';
      return; // wait for user choice
    }
  }
  _doLogoutNow();
}

function _doLogoutNow() {
  if (state.user && !_demoMode) {
    sb('login_activity', { method:'POST', prefer:'return=minimal',
      body: JSON.stringify({
        user_id: state.user.id, user_name: state.user.name,
        mobile: state.user.mobile, role: state.user.role, action: 'logout',
        hub_name: state.hub || null
      })
    });
  }
  state.user=null; state.hub=null; state.myCheckin=null; state.myCheckout=null;
  clearInterval(window._refreshT);
  window._jcCache = {};
  document.getElementById('app-shell').style.display='none';
  document.getElementById('login-page').style.display='flex';
  document.getElementById('mobile-input').value='';
  document.getElementById('test-role-selector').style.display='none';
  goStep('step-mobile');
  setAlert('s1-alert','','');
}

let _clockT = null;
function navigate(page) {
  currentPage = page;  // ← must set BEFORE async calls
  clearInterval(_clockT);
  document.querySelectorAll('.si,.bnt').forEach(e=>e.classList.remove('active'));
  ['si-','bt-'].forEach(p=>{ const e=document.getElementById(p+page); if(e) e.classList.add('active'); });
  const role = state.user?.role;
  const c = document.getElementById('content');
  // Async pages
  if (page==='workorders' && role==='hub_manager') {
    c.innerHTML = '<div style="padding:40px;text-align:center;color:var(--g400)">Loading work orders...</div>';
    (async () => {
      try {
        const html = await renderWorkOrdersAsync();
        if (currentPage===page) c.innerHTML = html;
      } catch(e) {
        console.error('renderWorkOrdersAsync error:', e);
        if (currentPage===page) c.innerHTML = `<div class="empty-state"><div style="font-size:32px;margin-bottom:12px">⚠️</div><div style="font-weight:600;margin-bottom:6px">Failed to load work orders</div><div style="font-size:13px;color:var(--g400);margin-bottom:16px">${e.message}</div><button class="btn btn-blue" onclick="window._jcCache={};navigate('workorders')">Retry</button></div>`;
      }
    })();
    return;
  }
  if (page==='workorders' && (role==='area_manager'||role==='head')) {
    c.innerHTML = '<div style="padding:40px;text-align:center;color:var(--g400)">Loading work orders...</div>';
    (async () => {
      try {
        const html = await renderWorkOrdersWideAsync(role);
        if (currentPage===page) c.innerHTML = html;
      } catch(e) {
        console.error('renderWorkOrdersWideAsync error:', e);
        if (currentPage===page) c.innerHTML = `<div class="empty-state"><div style="font-size:32px;margin-bottom:12px">⚠️</div><div style="font-weight:600;margin-bottom:6px">Failed to load work orders</div><div style="font-size:13px;color:var(--g400);margin-bottom:16px">${e.message}</div><button class="btn btn-blue" onclick="window._jcCache={};navigate('workorders')">Retry</button></div>`;
      }
    })();
    return;
  }
  if (page==='attendance' && (role==='area_manager'||role==='head')) {
    c.innerHTML = renderAttendanceWide(role); return;
  }
  const fns = {
    dashboard:renderDashboard, attendance:renderAttendance,
    'qr-hub':renderQRHub,
    'my-attendance':renderMyAttendance, 'my-jobs':renderMyJobs
  };
  c.innerHTML = (fns[page]||(() => ''))();
  if (page==='qr-hub') generateManagerQR();
  if (page==='dashboard') {
    // Load OOS count from vehicles table
    const hubFilter = state.hub ? `&hub_name=eq.${encodeURIComponent(state.hub)}` : '';
    sb(`vehicles?bike_status=eq.OOS&select=reg_number${hubFilter}`).then(rows=>{
      const el = document.getElementById('oos-count');
      if (el) el.textContent = rows ? rows.length : '—';
    });
  }
  if (page==='my-attendance') {
    document.getElementById('live-clock').textContent = nowFmt();
    _clockT = setInterval(()=>{ const e=document.getElementById('live-clock'); if(e) e.textContent=nowFmt(); else clearInterval(_clockT); },10000);
  }
  // Auto-refresh every 30s for dashboard/attendance, 60s for work orders
  clearInterval(window._refreshT);
  if (state.user && state.user.role==='hub_manager' && state.hubId && ['dashboard','attendance','workorders'].includes(page)) {
    const interval = page==='workorders' ? 60000 : 30000;
    window._refreshT = setInterval(async ()=>{
      if (currentPage !== page) { clearInterval(window._refreshT); return; }
      const c = document.getElementById('content');
      if (!c) return;
      if (page==='workorders') {
        if (window._jcCache) delete window._jcCache[state.hub];
        await loadJobsForHub(state.hubId);
        renderWorkOrdersAsync().then(html=>{ if(currentPage===page) c.innerHTML=html; });
      } else {
        await loadAttendanceForHub(state.hubId);
        c.innerHTML = (page==='dashboard'?renderDashboard:renderAttendance)();
      }
    }, interval);
  }
}

function nowFmt(){ return new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true}); }
function now24(){ return new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false}); }
function todayStr(){ return new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
function dateShort(){ return new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); }

async function mgrAtt(tech,val) {
  if (!state.attendance[tech]) state.attendance[tech]={status:'absent',checkin:null,checkout:null,hub:state.hub,hub_id:state.hubId};
  state.attendance[tech].status=val;
  if(val!=='present'){state.attendance[tech].checkin=null;state.attendance[tech].checkout=null;}
  else if(!state.attendance[tech].checkin) state.attendance[tech].checkin=now24();
  await saveAttOverride(tech, val, state.hubId);
  navigate('attendance');
}

async function approveAtt(tech, decision) {
  if (!state.attendance[tech]) return;
  state.attendance[tech].approval = decision;
  // Save approval to Supabase if live
  if (!_demoMode && state.attendance[tech].att_id) {
    await sb(`attendance?id=eq.${state.attendance[tech].att_id}`, {
      method: 'PATCH',
      body: JSON.stringify({ approval: decision })
    });
  }
  navigate('attendance');
}

async function addWO() {
  const vEl = document.getElementById('wov');
  const v = vEl.value;
  const iss = document.getElementById('woi').value.trim();
  const techName = document.getElementById('wot').value;
  const p = document.getElementById('wop').value;
  const woMsg = document.getElementById('wo-msg');

  if(!v||!iss||!techName){
    woMsg.innerHTML='<div class="alert al-error">Fill all fields and select a technician.</div>';
    return;
  }

  // ── Block 1: Check if vehicle has "JC not opened in DMS" status ──
  const allJcRows = window._jcCache?.[state.hub] || [];
  const vehicleJC = allJcRows.find(j => j.reg_number === v);
  if (vehicleJC && vehicleJC.current_jc_status === 'JC not opened in DMS') {
    woMsg.innerHTML = '';
    alertOpenJCFirst(v);
    return;
  }

  // ── Block 2: Check if vehicle is already assigned (duplicate prevention) ──
  const existingJob = state.jobs.find(j => j.vehicle === v);
  if (existingJob) {
    if (existingJob.status === 'In Progress') {
      woMsg.innerHTML = `<div class="alert al-error">❌ ${v} is already In Progress with <strong>${existingJob.tech}</strong>. Cannot assign again.</div>`;
      return;
    }
    if (existingJob.status === 'Done') {
      woMsg.innerHTML = `<div class="alert al-error">❌ ${v} is already completed by <strong>${existingJob.tech}</strong>. Cannot assign again.</div>`;
      return;
    }
    if (existingJob.status === 'Open') {
      woMsg.innerHTML = `<div class="alert al-warn">⚠️ ${v} is already assigned to <strong>${existingJob.tech}</strong> (not started). Reassigning to <strong>${techName}</strong>...</div>`;
      // Allow reassignment — update existing instead of creating new
      existingJob.tech = techName;
      const techUser = ALL_USERS.find(u=>u.name===techName);
      if (!_demoMode && existingJob.db_id && techUser) {
        await sb(`work_orders?id=eq.${existingJob.db_id}`, {
          method:'PATCH', body:JSON.stringify({assigned_tech_id: techUser.id})
        });
      }
      await loadJobsForHub(state.hubId);
      setTimeout(()=>navigate('workorders'), 900);
      return;
    }
  }

  // Get work type from JC data
  const jcData = window._jcLookup?.[v] || vehicleJC || {};
  const submType = jcData.submission_type || '';
  const woType = submType.toLowerCase().includes('oos') ? 'oos' : 'running_repair';
  const techUser = ALL_USERS.find(u=>u.name===techName);
  const woNum = 'WO-'+String(Date.now()).slice(-6);
  const btn = document.querySelector('.wo-form-wrap .btn-blue');
  btn.textContent='Saving...'; btn.disabled=true;
  const saved = await saveWorkOrder({
    wo_number: woNum, vehicle_reg: v, issue: iss,
    assigned_tech_id: techUser?.id || null,
    hub_id: state.hubId,
    priority: p, status: 'Open',
    wo_type: woType,
    assigned_by_id: state.user.id
  });
  btn.textContent='Assign Work Order'; btn.disabled=false;
  if (saved) {
    document.getElementById('wo-msg').innerHTML=`<div class="alert al-success">✓ ${woNum} (${woType==='oos'?'OOS':'Running Repair'}) assigned to ${techName}</div>`;
    // Clear search fields
    document.getElementById('veh-search').value='';
    document.getElementById('wov').value='';
    document.getElementById('veh-selected').style.display='none';
    await loadJobsForHub(state.hubId);
    setTimeout(()=>navigate('workorders'),900);
  } else {
    document.getElementById('wo-msg').innerHTML='<div class="alert al-error">Failed to save. Please try again.</div>';
  }
}

let _vehResults = [];

function filterVehicles(query) {
  const q = query.trim().toLowerCase();
  const dd = document.getElementById('veh-dropdown');
  const cnt = document.getElementById('veh-count');
  if (!q) {
    dd.style.display='none'; cnt.textContent='';
    const woMsg = document.getElementById('wo-msg');
    const assignBtn = document.querySelector('.wo-form-wrap .btn-blue');
    if (woMsg) woMsg.innerHTML = '';
    if (assignBtn) { assignBtn.disabled=false; assignBtn.style.opacity='1'; }
    return;
  }
  const matched = VEHICLES.filter(v => {
    const reg = (v.reg_number||'').toLowerCase();
    const model = (v.model_name||v.model||'').toLowerCase();
    const rider = (v.current_rider_name||'').toLowerCase();
    return reg.includes(q) || model.includes(q) || rider.includes(q);
  });
  // OOS vehicles first, then active
  _vehResults = [
    ...matched.filter(v=>v.bike_status?.toLowerCase()==='oos'),
    ...matched.filter(v=>v.bike_status?.toLowerCase()!=='oos')
  ].slice(0, 50);
  cnt.textContent = VEHICLES.length > 0 ? `${_vehResults.length} found` : '';
  if (!_vehResults.length) {
    // Fallback: search draft_jc by reg_number
    const jcMatches = (window._jcCache?.[state.hub] || [])
      .filter(j => (j.reg_number||'').toLowerCase().includes(q))
      .slice(0, 20);
    if (jcMatches.length) {
      dd.innerHTML = jcMatches.map((j,i) => {
        const statusColor = j.bike_status?.toLowerCase()==='oos' ? 'var(--red)' : 'var(--green)';
        return `<div onclick="selectVehicleFromJC('${j.reg_number}','${j.job_card_number||''}')" style="padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--g100)"
          onmouseover="this.style.background='var(--g50)'" onmouseout="this.style.background=''">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
            <span style="font-family:'DM Mono',monospace;font-size:13px;font-weight:600;color:var(--g900)">${j.reg_number}</span>
            <span style="font-size:10px;padding:2px 7px;border-radius:10px;background:var(--red-lt);color:${statusColor};font-weight:600">OOS</span>
          </div>
          <div style="font-size:12px;color:var(--g500)">JC: ${j.job_card_number||'—'} · ${j.submission_type||'—'}</div>
        </div>`;
      }).join('');
      cnt.textContent = jcMatches.length + ' in JC';
    } else {
      dd.innerHTML = `<div style="padding:12px 14px;font-size:13px;color:var(--g400)">No vehicles found for "${query}"</div>`;
    }
    dd.style.display='block'; return;
  }
  dd.innerHTML = _vehResults.map((v,i) => {
    const reg = v.reg_number;
    const model = v.model_name || v.model || '';
    const rider = v.current_rider_name || '';
    const odo = v.current_odometer ? `${v.current_odometer.toLocaleString()} km` : '';
    const statusColor = v.bike_status === 'Active_rental' ? 'var(--green)' : 'var(--red)';
    const statusLabel = v.bike_status === 'Active_rental' ? 'Active' : (v.bike_status || '');
    return `<div onclick="selectVehicle(${i})" style="padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--g100);transition:background .1s"
      onmouseover="this.style.background='var(--g50)'" onmouseout="this.style.background=''"
    >
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
        <span style="font-family:'DM Mono',monospace;font-size:13px;font-weight:600;color:var(--g900)">${reg}</span>
        <span style="font-size:10px;padding:2px 7px;border-radius:10px;background:${v.bike_status==='Active_rental'?'var(--green-lt)':'var(--red-lt)'};color:${statusColor};font-weight:600">${statusLabel}</span>
      </div>
      <div style="font-size:12px;color:var(--g500)">${model}${rider?' · '+rider:''}${odo?' · '+odo:''}</div>
    </div>`;
  }).join('');
  dd.style.display='block';
}

  }

  const existingJob = state.jobs.find(j => j.vehicle === v.reg_number);
  const assignBtn = document.querySelector('.wo-form-wrap .btn-blue');
  const woMsg = document.getElementById('wo-msg');
  if (existingJob) {

        ? `Completed by <strong>${existingJob.tech}</strong>`
        : `In Progress by <strong>${existingJob.tech}</strong>`;
      if (woMsg) woMsg.innerHTML = `<div class="alert al-warn">⚠️ ${v.reg_number} is already assigned — ${statusText}. Cannot reassign.</div>`;
      if (assignBtn) { assignBtn.disabled = true; assignBtn.style.opacity = '0.4'; }

      if (woMsg) woMsg.innerHTML = `<div class="alert al-info">ℹ️ ${v.reg_number} is assigned to <strong>${existingJob.tech}</strong> (not started). You can reassign.</div>`;
      if (assignBtn) { assignBtn.disabled = false; assignBtn.style.opacity = '1'; }
    }
  } else {
    if (woMsg) woMsg.innerHTML = '';
    if (assignBtn) { assignBtn.disabled = false; assignBtn.style.opacity = '1'; }
  }
}

let _scanner=null, _scanMode=null;
function openScanner(mode) {

    <div class="modal-sub">Point your camera at the QR posted ${hubHint}</div>

      <button class="btn btn-outline btn-sm btn-full" onclick="simulateScan()">Simulate scan (demo)</button>
    </div>`;
  document.getElementById('modal').style.display='flex';
  setTimeout(()=>{

      _scanner=new Html5Qrcode('reader');
      _scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:220,height:220}},onScan,()=>{}).catch(()=>{});
    } catch(e){}

function onScan(decoded) {
  // Find which hub this QR token belongs to
  const matchedHub = Object.keys(HUB_TOKENS).find(h => HUB_TOKENS[h] === decoded);
  if (matchedHub) {
    markAtt(matchedHub);
  } else {
    document.getElementById('scan-alert').innerHTML=`<div class="alert al-error">Invalid QR — please scan the QR posted at your hub entrance.</div>`;
  }
}

function simulateScan() {
  // For demo: simulate scanning the first hub's QR if tech has no hub yet, else their hub
  const demoHub = state.hub || HUBS[0];
  onScan(HUB_TOKENS[demoHub]);
}

async function markAtt(scannedHub) {
  const t12=nowFmt();
  const hubObj = HUBS.find(h=>h.name===scannedHub);
  const hubId  = hubObj ? hubObj.id : null;
  document.getElementById('scan-alert').innerHTML=`<div class="alert al-info">Saving...</div>`;
  if (_scanMode==='checkin') {
    const attId = await saveCheckin(hubId, state.user.id);
    state.hub    = scannedHub;
    state.hubId  = hubId;
    state.myAttId= attId;
    state.myCheckin = t12;
    renderTopbar();
    state.attendance[state.user.name]={status:'present',checkin:t12,checkout:null,hub:scannedHub,hub_id:hubId,att_id:attId};
  } else {
    await saveCheckout(state.myAttId);
    state.myCheckout=t12;
    state.attendance[state.user.name]={...state.attendance[state.user.name], checkout:t12};
  }
  document.getElementById('scan-alert').innerHTML=`<div class="alert al-success">✓ ${_scanMode==='checkin'?'Checked in at '+scannedHub:'Checked out'} — ${t12}</div>`;
  stopScanner();
  setTimeout(()=>{ closeModal(); navigate('my-attendance'); },1200);
}

// ── PHOTO CAPTURE ENGINE ──
let _photoSession = { phase: null, jobIdx: null, sides: ['front','left','back','right'],
  currentSide: 0, captured: {}, stream: null };

function openPhotoCapture(phase, jobIdx) {
  _photoSession = { phase, jobIdx, sides:['front','left','back','right'], currentSide:0, captured:{}, stream:null };
  const job = state.jobs[jobIdx];
  document.getElementById('pm-title').textContent = phase==='start' ? '📷 Start Photos — '+job.id : '📷 Completion Photos — '+job.id;
  document.getElementById('pm-sub').textContent = 'Take 4 photos: Front, Left, Back, Right side of vehicle';
  renderPhotoThumbs();
  updatePhotoSideLabel();
  document.getElementById('photo-modal').style.display='flex';
  startCamera();
}

function startCamera() {
  const video = document.getElementById('pm-video');
  const canvas = document.getElementById('pm-canvas');
  canvas.style.display='none';
  video.style.display='block';
  navigator.mediaDevices.getUserMedia({ video: { facingMode:'environment', width:{ideal:1280}, height:{ideal:960} } })
    .then(stream => {
      _photoSession.stream = stream;
      video.srcObject = stream;
    })
    .catch(err => {
      console.error('Camera error:', err);
      document.getElementById('scan-alert') && (document.getElementById('scan-alert').innerHTML = '');
      // Show error message, no file upload fallback
      const wrap = document.getElementById('pm-video')?.parentElement;
      if (wrap) wrap.innerHTML = `<div style="padding:40px;text-align:center;color:#fff;font-size:14px">
        <div style="font-size:32px;margin-bottom:12px">📷</div>
        <div style="font-weight:600;margin-bottom:8px">Camera not available</div>
        <div style="font-size:12px;opacity:.7">Please allow camera access in your browser settings and try again.</div>
      </div>`;
    });
}

function stopCamera() {
  if (_photoSession.stream) {
    _photoSession.stream.getTracks().forEach(t=>t.stop());
    _photoSession.stream = null;
  }
}

function capturePhoto() {
  const video = document.getElementById('pm-video');
  const canvas = document.getElementById('pm-canvas');
  const side = _photoSession.sides[_photoSession.currentSide];
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0);
  // Add watermark
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, canvas.height-36, canvas.width, 36);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px sans-serif';
  const job = state.jobs[_photoSession.jobIdx];
  ctx.fillText(`${job.id} · ${side.toUpperCase()} · ${_photoSession.phase.toUpperCase()} · ${new Date().toLocaleString('en-IN')}`, 10, canvas.height-12);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  _photoSession.captured[side] = dataUrl;
  // Show preview
  video.style.display='none';
  canvas.style.display='block';
  document.getElementById('pm-retake-btn').style.display='block';
  document.getElementById('pm-capture-btn').textContent = side === _photoSession.sides[_photoSession.sides.length-1] ? '✓ Save' : '→ Next Side';
  document.getElementById('pm-capture-btn').onclick = confirmPhoto;
  renderPhotoThumbs();
  checkAllCaptured();
}



function retakePhoto() {
  const video = document.getElementById('pm-video');
  const canvas = document.getElementById('pm-canvas');
  video.style.display='block';
  canvas.style.display='none';
  document.getElementById('pm-retake-btn').style.display='none';
  document.getElementById('pm-capture-btn').textContent='📷 Capture';
  document.getElementById('pm-capture-btn').onclick=capturePhoto;
}

function confirmPhoto() {
  const sides = _photoSession.sides;
  const current = sides[_photoSession.currentSide];
  if (!_photoSession.captured[current]) return;
  // Move to next side if not last
  if (_photoSession.currentSide < sides.length - 1) {
    _photoSession.currentSide++;
    updatePhotoSideLabel();
    retakePhoto();
  } else {
    // All sides captured
    retakePhoto();
    renderPhotoThumbs();
    checkAllCaptured();
  }
}

function updatePhotoSideLabel() {
  const side = _photoSession.sides[_photoSession.currentSide];
  document.getElementById('pm-side-label').textContent = side.charAt(0).toUpperCase()+side.slice(1);
}

function renderPhotoThumbs() {
  const sides = _photoSession.sides;
  document.getElementById('pm-thumbs').innerHTML = sides.map((s,i)=>{
    const img = _photoSession.captured[s];
    const isActive = i===_photoSession.currentSide;
    return `<div class="photo-thumb ${img?'done':''} ${isActive?'active':''}" onclick="jumpToSide(${i})">
      ${img ? `<img src="${img}"/><div class="tick">✓</div>` : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.4);font-size:18px">📷</div>`}
      <div class="photo-thumb-label">${s}</div>
    </div>`;
  }).join('');
}

function jumpToSide(i) {
  _photoSession.currentSide = i;
  updatePhotoSideLabel();
  retakePhoto();
}

function checkAllCaptured() {
  const allDone = _photoSession.sides.every(s=>_photoSession.captured[s]);
  document.getElementById('pm-done-btn').style.display = allDone ? 'block' : 'none';
}

async function finishPhotoSession() {
  const { phase, jobIdx, captured } = _photoSession;
  const job = state.jobs[jobIdx];
  const btn = document.getElementById('pm-done-btn');
  btn.textContent = 'Uploading photos...'; btn.disabled = true;

  // Upload each photo to Supabase Storage
  const uploaded = [];
  for (const side of _photoSession.sides) {
    const dataUrl = captured[side];
    if (!dataUrl) continue;
    // Convert base64 to blob
    const res = await fetch(dataUrl);
    const blob = await res.blob();
    const filename = `${job.db_id}/${phase}/${side}_${Date.now()}.jpg`;
    let photoUrl = dataUrl; // fallback to base64 if upload fails
    if (!_demoMode) {
      const r = await fetch(`${SUPABASE_URL}/storage/v1/object/job-photos/${filename}`, {
        method:'POST',
        headers:{ 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY, 'Content-Type':'image/jpeg' },
        body: blob
      });
      if (r.ok) {
        photoUrl = `${SUPABASE_URL}/storage/v1/object/public/job-photos/${filename}`;
      }
      // Save record to job_photos table
      await sb(`job_photos`, { method:'POST', body: JSON.stringify({
        work_order_id: job.db_id, phase, side, photo_url: photoUrl, taken_by: state.user.id
      })});
    }
    uploaded.push(photoUrl);  // store as plain URL array
  }

  // Update job status
  const newStatus = phase==='start' ? 'In Progress' : 'Done';
  state.jobs[jobIdx].status = newStatus;
  if (phase==='start') state.jobs[jobIdx].start_photos = uploaded;
  else state.jobs[jobIdx].end_photos = uploaded;

  if (!_demoMode) {
    await updateWOStatus(job.db_id, newStatus);
    // Update start/end photos flag
    const patch = phase==='start' ? {status:'In Progress', started_at: new Date().toISOString(), start_photos_done:true}
                                  : {status:'Done', completed_at: new Date().toISOString(), end_photos_done:true};
    await sb(`work_orders?id=eq.${job.db_id}`, { method:'PATCH', body: JSON.stringify(patch) });
  }

  stopCamera();
  document.getElementById('photo-modal').style.display='none';
  navigate('my-jobs');
}

function cancelPhotoSession() {
  stopCamera();
  document.getElementById('photo-modal').style.display='none';
}

function stopScanner() { if(_scanner){_scanner.stop().catch(()=>{});_scanner=null;} }
function closeModal() { stopScanner(); document.getElementById('modal').style.display='none'; }
function modalBackdropClick(e) {

          <div id="veh-dropdown" style="display:none;position:absolute;z-index:50;background:var(--white);border:1px solid var(--g200);border-radius:var(--r);box-shadow:var(--sh-md);max-height:220px;overflow-y:auto;width:calc(50% - 28px);min-width:260px"></div>
          <input type="hidden" id="wov"/>
          <div id="veh-selected" style="display:none;margin-top:6px;padding:8px 10px;background:var(--blue-lt);border-radius:6px;font-size:12px;color:var(--blue)"></div>

      <div class="form-row" style="margin-top:12px">
        <div class="form-group" style="margin:0"><label class="form-label">Issue / Service</label><input class="form-input" id="woi" placeholder="Describe the problem"/></div>
        <div class="form-group" style="margin:0"><label class="form-label">Priority</label>
          <select class="form-select" id="wop"><option>High</option><option selected>Medium</option><option>Low</option></select>
        </div>
      </div>
      <div class="form-group" style="margin-top:12px">
        <label class="form-label">Assign to (present at ${myHub})</label>
        <select class="form-select" id="wot">
          <option value="">Select technician...</option>

    <div style="font-size:15px;font-weight:600;color:var(--g800);margin:20px 0 10px">
      Unassigned Work <span class="badge b-absent" style="font-size:11px">${unassignedSorted.length} open</span>
    </div>
    ${unassignedSorted.length===0
      ? `<div class="empty-state" style="padding:20px">No open job cards at this hub.</div>`
      : `<div class="tw" id="wo-ua-table">
          <table><thead>${TH_UA}</thead><tbody>${paginate(unassignedSorted,window._woPg.ua).map(rowUA).join('')}</tbody></table>
          ${pagerHTML(unassignedSorted,window._woPg.ua,'ua')}

    <div style="font-size:15px;font-weight:600;color:var(--g800);margin:20px 0 10px">
      Assigned Work <span class="badge b-inprog" style="font-size:11px">${assignedSorted.length}</span>
    </div>
    ${assignedSorted.length===0
      ? `<div class="empty-state" style="padding:20px">No assigned job cards at this hub.</div>`
      : `<div class="tw" id="wo-as-table">
          <table><thead>${TH_AS}</thead><tbody>${paginate(assignedSorted,window._woPg.as).map(rowAS).join('')}</tbody></table>
          ${pagerHTML(assignedSorted,window._woPg.as,'as')}
        </div>`}`;
}

function woPage(key, delta) {
  if (!window._woPg) window._woPg = {ua:0,as:0};
  window._woPg[key] = Math.max(0, window._woPg[key] + delta);
  navigate('workorders');
}

function assignTechFromJC(jcNum, regNum, techName) {
  if (!techName) return;
  // Pre-fill directly from JC data — no need to search vehicles table
  document.getElementById('veh-search').value = regNum;
  document.getElementById('wov').value = regNum;
  document.getElementById('veh-dropdown').style.display = 'none';
  document.getElementById('veh-selected').style.display = 'block';
  document.getElementById('veh-selected').innerHTML = `✓ <strong>${regNum}</strong> — JC: ${jcNum}`;
  // Show JC info if available in lookup
  const jcInfoEl = document.getElementById('veh-jc-info');
  const jc = window._jcLookup?.[regNum];
  if (jcInfoEl && jc) {
    jcInfoEl.innerHTML = `<div style="margin-top:6px;padding:8px 10px;background:var(--blue-lt);border-radius:6px;font-size:12px;line-height:1.8">
      <strong>JC:</strong> ${jc.job_card_number||'—'} &nbsp;·&nbsp;
      <strong>Labour:</strong> ${jc.labour_time_hours?.toFixed(1)||'—'}h &nbsp;·&nbsp;
      <strong>TAT:</strong> ${jc.overall_tat_days?.toFixed(1)||'—'}d &nbsp;·&nbsp;
      <strong>Type:</strong> ${jc.submission_type||'—'}
    </div>`;
  }
  // Clear any existing warning
  const woMsg = document.getElementById('wo-msg');
  if (woMsg) woMsg.innerHTML = '';
  // Reset assign button
  const assignBtn = document.querySelector('.wo-form-wrap .btn-blue');
  if (assignBtn) { assignBtn.disabled=false; assignBtn.style.opacity='1'; }
  // Select tech
  const techSel = document.getElementById('wot');
  if (techSel) {
    for (const opt of techSel.options) {
      if (opt.value === techName) { opt.selected = true; break; }
    }
  }
  // Scroll to form
  document.querySelector('.wo-form-wrap')?.scrollIntoView({behavior:'smooth', block:'start'});
  document.getElementById('woi').focus();
}

function changeTechAlert(jcNum, techName) {
  const msg = techName
    ? `This job card is assigned to <strong>${techName}</strong> in DMS. Please change the technician's name in DMS for job card <strong>${jcNum}</strong>. Changes will reflect here on the next data sync.`
    : `Please change the Technician Name in DMS for job card <strong>${jcNum}</strong>. Changes will reflect here on the next data sync.`;
  document.getElementById('modal-inner').innerHTML = `
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">Change Technician in DMS</div>
    <div class="modal-sub">Job Card: <strong>${jcNum}</strong></div>
    <div class="al-warn alert" style="margin-bottom:0">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      ${msg}
    </div>`;
  document.getElementById('modal').style.display='flex';
}

function alertOpenJCFirst(regNum) {
  document.getElementById('modal-inner').innerHTML = `
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">Open Job Card in DMS First</div>
    <div class="modal-sub">Vehicle: <strong>${regNum}</strong></div>
    <div class="al-error alert" style="margin-bottom:0">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      This vehicle does not have an open job card in DMS yet. Please open a job card in DMS for <strong>${regNum}</strong> before assigning a technician.
