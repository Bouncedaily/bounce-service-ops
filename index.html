<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bounce Service Ops</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root {
  --blue:#1a56db; --blue-lt:#ebf0ff; --blue-dk:#1040b0;
  --green:#0f9e6e; --green-lt:#e6f7f2;
  --red:#e02424; --red-lt:#fef2f2;
  --amber:#b45309; --amber-lt:#fef3c7;
  --g50:#f9fafb; --g100:#f3f4f6; --g200:#e5e7eb;
  --g300:#d1d5db; --g400:#9ca3af; --g500:#6b7280;
  --g600:#4b5563; --g700:#374151; --g800:#1f2937; --g900:#111827;
  --white:#fff; --r:10px; --rlg:14px;
  --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
  --sh-md:0 4px 16px rgba(0,0,0,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;margin:0}body{font-family:'DM Sans',sans-serif;background:var(--g50);color:var(--g800);font-size:15px}

/* ─ TOPBAR ─ */
.topbar{background:var(--white);border-bottom:1px solid var(--g200);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:var(--g900);text-decoration:none}
.logo-mark{width:32px;height:32px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-mark svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.topbar-right{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--blue-lt);color:var(--blue);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.user-meta{line-height:1.25}
.user-name{font-size:13px;font-weight:600;color:var(--g800)}
.user-sub{font-size:11px;color:var(--g400)}
.hub-tag{font-size:11px;padding:3px 9px;background:var(--blue-lt);color:var(--blue);border-radius:20px;font-weight:500;white-space:nowrap}
.btn-logout{font-size:12px;padding:5px 12px;border:1px solid var(--g200);border-radius:8px;background:var(--white);color:var(--g500);cursor:pointer;font-family:inherit}
.btn-logout:hover{background:var(--g50)}
@media(max-width:640px){.user-meta,.hub-tag{display:none}}

/* ─ LAYOUT ─ */
.layout{display:flex;height:calc(100vh - 56px);overflow:hidden}
.sidebar{width:216px;background:var(--white);border-right:1px solid var(--g200);padding:12px 0;flex-shrink:0}
.si{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:14px;color:var(--g500);cursor:pointer;border-left:3px solid transparent;transition:all .15s;user-select:none}
.si:hover{background:var(--g50);color:var(--g800)}
.si.active{background:var(--blue-lt);color:var(--blue);border-left-color:var(--blue);font-weight:500}
.si svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.si-section{font-size:10px;font-weight:600;color:var(--g400);text-transform:uppercase;letter-spacing:.08em;padding:16px 20px 4px}
.content{flex:1;padding:28px 24px;overflow-y:auto;height:100%;-webkit-overflow-scrolling:touch;box-sizing:border-box;scroll-behavior:auto}
@media(max-width:700px){
  .sidebar{display:none}
  .bottom-nav{display:flex !important}
  .content{padding:16px 14px 140px}
  /* Mobile table horizontal scroll */
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px}
  /* Mobile cards full width */
  .card{border-radius:10px}
  /* Prevent text overflow in tables */
  td,th{white-space:nowrap}
  /* Smaller page title on mobile */
  .page-title{font-size:17px}
  .page-hd{margin-bottom:14px}
  /* Bottom safe area for newer iPhones */
  .bottom-nav{padding-bottom:max(env(safe-area-inset-bottom), 12px)}
  /* Stats grid 2 columns on mobile */
  .stats-grid{grid-template-columns:1fr 1fr !important}
  /* Photo modal full screen on mobile */
  .photo-modal-inner{width:100% !important;height:100% !important;border-radius:0 !important;max-height:100vh !important}
  /* Att calendar font smaller */
  .att-cal td{font-size:10px;padding:3px 1px}
  /* Form inputs full width */
  .form-input,.form-select{width:100% !important;max-width:100%}
  /* Buttons readable on mobile */
  .btn{min-height:40px}
  /* Topbar compact */
  .topbar{padding:10px 14px}
  /* Page header wrap on small screens */
  .page-hd{flex-wrap:wrap;gap:8px}
}

/* ─ BOTTOM NAV ─ */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;width:100%;background:var(--white);border-top:1px solid var(--g200);z-index:1000;padding:4px 0 env(safe-area-inset-bottom,8px);box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.bnt{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 4px;cursor:pointer;border:none;background:none;font-family:inherit;color:var(--g400);font-size:9px;font-weight:500;min-width:0;overflow:hidden}
.bnt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:center}
.bnt svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bnt.active{color:var(--blue)}
@media(max-width:700px){.bottom-nav{display:flex}}

/* ─ COMMON ─ */
.page-hd{margin-bottom:20px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.page-hd-text{flex:1}
.page-title{font-size:20px;font-weight:600;color:var(--g900);margin-bottom:2px}
.btn-refresh{display:flex;align-items:center;gap:6px;padding:7px 13px;border:1px solid var(--g200);border-radius:var(--r);background:var(--white);color:var(--g600);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;flex-shrink:0;transition:all .15s}
.btn-refresh:hover{background:var(--g50);border-color:var(--g300)}
.btn-refresh svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s}
.btn-refresh.spinning svg{transform:rotate(360deg)}
.page-sub{font-size:13px;color:var(--g400)}
.card{background:var(--white);border:1px solid var(--g200);border-radius:var(--rlg);padding:20px;box-shadow:var(--sh);margin-bottom:16px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.metric{background:var(--white);border:1px solid var(--g200);border-radius:var(--r);padding:14px 16px}
.metric-lbl{font-size:11px;color:var(--g400);font-weight:500;margin-bottom:4px}
.metric-val{font-size:26px;font-weight:600;color:var(--g900);line-height:1}
.mv-blue{color:var(--blue)} .mv-green{color:var(--green)} .mv-amber{color:var(--amber)} .mv-red{color:var(--red)}
.tw{background:var(--white);border:1px solid var(--g200);border-radius:var(--rlg);overflow:hidden;box-shadow:var(--sh);margin-bottom:20px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:480px}
thead tr{background:var(--g50);border-bottom:1px solid var(--g200)}
th{padding:10px 14px;text-align:left;font-weight:600;font-size:11px;color:var(--g500);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
td{padding:11px 14px;color:var(--g700);border-bottom:1px solid var(--g100);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--g50)}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;display:inline-block;white-space:nowrap}
.b-present{background:var(--green-lt);color:var(--green)}
.b-absent{background:var(--red-lt);color:var(--red)}
.b-leave{background:var(--amber-lt);color:var(--amber)}
.b-open{background:var(--g100);color:var(--g600)}
.b-inprog{background:var(--blue-lt);color:var(--blue)}
.b-done{background:var(--green-lt);color:var(--green)}
.b-high{background:#fef2f2;color:#b91c1c}
.b-med{background:var(--amber-lt);color:#92400e}
.b-low{background:#f0fdf4;color:#166534}
.fl{display:flex} .fc{flex-direction:column} .g8{gap:8px} .g12{gap:12px} .g16{gap:16px}
.ai-c{align-items:center} .jc-sb{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:var(--r);font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;border:none;transition:all .15s}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-blue{background:var(--blue);color:#fff} .btn-blue:hover{background:var(--blue-dk)}
.btn-green{background:var(--green);color:#fff} .btn-green:hover{background:#0a7a55}
.btn-red{background:var(--red);color:#fff} .btn-red:hover{background:#c81e1e}
.btn-outline{background:var(--white);border:1px solid var(--g200);color:var(--g700)} .btn-outline:hover{background:var(--g50)}
.btn-ghost{background:none;border:none;color:var(--g500);cursor:pointer;font-family:inherit;font-size:14px;padding:4px 0}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-full{width:100%}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--g600);margin-bottom:5px}
.form-input,.form-select{width:100%;padding:10px 13px;border:1px solid var(--g200);border-radius:var(--r);font-size:15px;font-family:inherit;color:var(--g800);background:var(--white);outline:none;transition:border .15s,box-shadow .15s}
.form-input:focus,.form-select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.12)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:500px){.form-row{grid-template-columns:1fr}}
.sel-sm{padding:5px 8px;font-size:12px;border:1px solid var(--g200);border-radius:6px;font-family:inherit;color:var(--g700);background:var(--white)}
.alert{padding:11px 14px;border-radius:var(--r);font-size:13px;margin-bottom:14px;font-weight:500;display:flex;align-items:center;gap:8px}
.alert svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.al-success{background:var(--green-lt);color:var(--green)}
.al-error{background:var(--red-lt);color:var(--red)}
.al-info{background:var(--blue-lt);color:var(--blue)}
.al-warn{background:var(--amber-lt);color:var(--amber)}
.divider{height:1px;background:var(--g100);margin:20px 0}
.empty-state{text-align:center;padding:40px 20px;color:var(--g400);font-size:14px}
.mono{font-family:'DM Mono',monospace}

/* ─ LOGIN ─ */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--g50)}
.login-card{background:var(--white);border:1px solid var(--g200);border-radius:18px;padding:36px 32px;width:100%;max-width:420px;box-shadow:var(--sh-md)}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.login-logo-mark{width:40px;height:40px;background:var(--blue);border-radius:10px;display:flex;align-items:center;justify-content:center}
.login-logo-mark svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.login-title{font-size:22px;font-weight:700;color:var(--g900);margin-bottom:4px}
.login-sub{font-size:13px;color:var(--g400);margin-bottom:24px}
.step{display:none} .step.active{display:block}
.phone-row{display:flex;gap:8px}
.phone-prefix{padding:10px 12px;border:1px solid var(--g200);border-radius:var(--r);font-size:15px;font-family:inherit;color:var(--g700);background:var(--g50);white-space:nowrap}

.user-preview{background:var(--g50);border:1px solid var(--g200);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:16px}
.up-avatar{width:40px;height:40px;border-radius:50%;background:var(--blue-lt);color:var(--blue);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.up-name{font-size:15px;font-weight:600;color:var(--g900)}
.up-role{font-size:12px;color:var(--g400)}

.step-back{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--g500);cursor:pointer;margin-bottom:20px;background:none;border:none;font-family:inherit}
.step-back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.step-back:hover{color:var(--g800)}

/* ─ CHECK-IN ─ */
.checkin-hero{background:var(--white);border:1px solid var(--g200);border-radius:var(--rlg);padding:28px 24px;text-align:center;box-shadow:var(--sh);margin-bottom:16px}
.clock-big{font-family:'DM Mono',monospace;font-size:44px;font-weight:500;color:var(--g900);letter-spacing:-2px;margin:6px 0 2px}
.date-lbl{font-size:13px;color:var(--g400);margin-bottom:20px}
.ci-times{display:flex;justify-content:center;gap:36px;margin:12px 0 24px}
.ci-item{display:flex;flex-direction:column;align-items:center;gap:4px}
.ci-lbl{font-size:11px;color:var(--g400);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.ci-val{font-size:17px;font-weight:600;font-family:'DM Mono',monospace;color:var(--g800)}
.ci-val.empty{color:var(--g300)}

/* ─ QR GRID ─ */
.qr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.qr-card{background:var(--white);border:1px solid var(--g200);border-radius:var(--rlg);padding:20px;text-align:center;box-shadow:var(--sh)}
.qr-hub-name{font-size:13px;font-weight:600;color:var(--g700);margin-bottom:2px}
.qr-date{font-size:11px;color:var(--g400);margin-bottom:14px}
.qr-wrap{display:flex;justify-content:center;margin-bottom:12px}
.qr-inner{padding:10px;border:1px solid var(--g200);border-radius:8px;display:inline-block}
.qr-token{font-size:9px;font-family:'DM Mono',monospace;color:var(--g400);word-break:break-all;margin-bottom:12px}
.print-note{font-size:11px;color:var(--g400);background:var(--g50);border-radius:6px;padding:8px 10px;margin-bottom:12px}

/* ─ SCANNER MODAL ─ */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--white);border-radius:var(--rlg);padding:28px 24px;width:100%;max-width:380px;position:relative}
.modal-close{position:absolute;top:14px;right:14px;background:none;border:none;cursor:pointer;color:var(--g400);font-size:20px;line-height:1;padding:4px}
.modal-title{font-size:16px;font-weight:600;margin-bottom:4px;color:var(--g900)}
.modal-sub{font-size:13px;color:var(--g400);margin-bottom:18px}
.scanner-wrap{border-radius:var(--r);overflow:hidden;background:var(--g900);min-height:260px;position:relative}
#reader{width:100%!important}
#reader video{border-radius:var(--r)}
.wo-form-wrap{background:var(--g50);border:1px solid var(--g200);border-radius:var(--rlg);padding:20px;margin-bottom:20px}
.wo-form-title{font-size:14px;font-weight:600;color:var(--g700);margin-bottom:14px}
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.photo-slot{border:2px dashed var(--g200);border-radius:var(--r);aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;background:var(--g50);transition:border-color .15s}
.photo-slot:hover{border-color:var(--blue)}
.photo-slot.captured{border:2px solid var(--green);background:var(--g900)}
.photo-slot img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.photo-slot-label{font-size:11px;font-weight:600;color:var(--g400);text-transform:uppercase;letter-spacing:.05em;margin-top:6px;position:relative;z-index:1}
.photo-slot-icon{font-size:24px;position:relative;z-index:1}
.photo-slot.captured .photo-slot-label{color:#fff;background:rgba(0,0,0,.5);padding:2px 6px;border-radius:4px}
.photo-slot.captured .photo-slot-icon{display:none}
.photo-retake{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:4px;font-size:10px;padding:3px 7px;cursor:pointer;z-index:2;font-family:inherit}
.photo-progress{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--g50);border:1px solid var(--g200);border-radius:var(--r);font-size:13px;margin-bottom:12px}
.photo-dots{display:flex;gap:6px}
.photo-dot{width:10px;height:10px;border-radius:50%;background:var(--g200);transition:background .2s}
.photo-dot.done{background:var(--green)}
.camera-preview{width:100%;border-radius:var(--r);overflow:hidden;background:var(--g900);position:relative;aspect-ratio:4/3}
.camera-preview video{width:100%;height:100%;object-fit:cover;display:block}
.camera-capture-btn{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;background:#fff;border:4px solid var(--g300);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-md)}
.camera-capture-btn:hover{border-color:var(--blue)}
.camera-capture-btn::after{content:'';width:44px;height:44px;background:var(--blue);border-radius:50%;display:block}
.photo-modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.photo-modal-title{color:#fff;font-size:16px;font-weight:600;margin-bottom:6px;text-align:center}
.photo-modal-sub{color:rgba(255,255,255,.6);font-size:13px;margin-bottom:16px;text-align:center}
.photo-preview{width:100%;max-width:380px;aspect-ratio:4/3;background:#111;border-radius:var(--r);overflow:hidden;position:relative;margin-bottom:14px}
.photo-preview video{width:100%;height:100%;object-fit:cover}
.photo-preview canvas{width:100%;height:100%;object-fit:cover;display:none}
.photo-preview img{width:100%;height:100%;object-fit:cover;display:none}
.photo-side-label{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em}
.photo-sides{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:380px;margin-bottom:14px}
.photo-thumb{aspect-ratio:1;border-radius:6px;overflow:hidden;border:2px solid transparent;position:relative;background:rgba(255,255,255,.1)}
.photo-thumb.done{border-color:var(--green)}
.photo-thumb.active{border-color:#fff}
.photo-thumb img{width:100%;height:100%;object-fit:cover}
.photo-thumb-label{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.6);color:#fff;font-size:9px;text-align:center;padding:2px;font-weight:600}
.photo-thumb .tick{position:absolute;top:3px;right:3px;width:16px;height:16px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff}
.photo-actions{display:flex;gap:10px;width:100%;max-width:380px}
.btn-capture{flex:1;padding:13px;background:var(--white);color:var(--g900);border:none;border-radius:var(--r);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-retake{padding:13px 16px;background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:var(--r);font-size:13px;cursor:pointer;font-family:inherit;display:none}
.btn-photo-done{width:100%;max-width:380px;padding:13px;background:var(--green);color:#fff;border:none;border-radius:var(--r);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px;display:none}

/* ─ SUPABASE NOTE ─ */
.sb-note{background:var(--blue-lt);border:1px solid #bcd0f7;border-radius:var(--r);padding:12px 14px;font-size:12px;color:var(--blue-dk);margin-bottom:20px;line-height:1.6}
.sb-note strong{font-weight:600}
.sb-note code{font-family:'DM Mono',monospace;background:rgba(26,86,219,.1);padding:1px 5px;border-radius:4px;font-size:11px}
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login-page" class="login-page" style="display:none">

    <!-- Step 1: Mobile -->
    <div class="step active" id="step-mobile">
      <div class="login-title">Welcome back</div>
      <div class="login-sub">Enter your registered Bounce mobile number</div>
      <div id="s1-alert"></div>
      <div class="form-group">
        <label class="form-label">Mobile number</label>
        <div class="phone-row">
          <span class="phone-prefix">+91</span>
          <input class="form-input" id="mobile-input" type="tel" inputmode="numeric" maxlength="10" placeholder="98XXXXXXXX" style="flex:1" oninput="onMobileInput(this.value)" onkeydown="if(event.key==='Enter')sendOTP()"/>
        </div>
      </div>
      <!-- Role selector shown only for test number -->
      <div id="test-role-selector" style="display:none;margin-bottom:14px">
        <label class="form-label">Test as role</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <button class="btn btn-outline" id="tr-hub_manager"   onclick="setTestRole('hub_manager')"   style="font-size:13px;padding:8px">Hub Manager</button>
          <button class="btn btn-outline" id="tr-area_manager"  onclick="setTestRole('area_manager')"  style="font-size:13px;padding:8px">Area Manager</button>
          <button class="btn btn-outline" id="tr-head"          onclick="setTestRole('head')"          style="font-size:13px;padding:8px">Head</button>
          <button class="btn btn-outline" id="tr-technician"    onclick="setTestRole('technician')"    style="font-size:13px;padding:8px">Technician</button>
        </div>
      </div>
      <button class="btn btn-blue btn-full" style="padding:13px;" onclick="sendOTP()">Login</button>
    </div>

    <!-- Step 2: OTP removed — direct mobile login -->

    <!-- Step 3: Hub selection (managers only) -->
    <div class="step" id="step-hub">
      <div class="login-title">Select your hub</div>
      <div class="login-sub">Choose the hub you're managing today</div>
      <div id="s3-alert"></div>
      <div id="user-preview" class="user-preview"></div>
      <div class="form-group">
        <label class="form-label">Hub for today</label>
        <select class="form-select" id="hub-select">
          <option value="">Select hub...</option>
        </select>
      </div>
      <button class="btn btn-blue btn-full" style="padding:13px;" onclick="finishLogin()">Continue</button>
    </div>

    <!-- Step 3b: Technician direct entry -->
    <div class="step" id="step-tech-ready">
      <div id="user-preview-tech" class="user-preview" style="margin-bottom:16px"></div>
      <!-- Hub picker for technicians -->
      <div id="tech-hub-picker" style="display:none">
        <div class="form-group">
          <label class="form-label">Select your hub for today</label>
          <select class="form-select" id="tech-hub-select">
            <option value="">Select hub...</option>
          </select>
        </div>
      </div>
      <!-- Info note for area_manager / head -->
      <div id="tech-role-note" style="display:none">
        <div class="al-info alert" style="margin-bottom:0">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span id="tech-ready-msg"></span>
        </div>
      </div>
      <button class="btn btn-blue btn-full" style="padding:13px;margin-top:16px" id="tech-ready-btn" onclick="finishLogin()">Continue</button>
    </div>
  </div>
</div>

// ─ SUPABASE CORE ─
async function sb(path, opts={}) {
  try {
    const r = await fetch(SUPABASE_URL+'/rest/v1/'+path, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer '+SUPABASE_KEY,
        'Content-Type': 'application/json',
        'Prefer': opts.prefer || '',
        ...opts.headers
      },
      method: opts.method || 'GET',
      body: opts.body || undefined
    });
    if (!r.ok) { console.error('Supabase error', r.status, await r.text()); return null; }
    const txt = await r.text();
    return txt ? JSON.parse(txt) : [];
  } catch(e) {
    console.error('Supabase network error:', e);
    return null;
  }
}

// ─ BOOTSTRAP: load hubs + users + vehicles from Supabase, fallback to demo ─
async function bootstrap() {
  const [hubRows, userRows] = await Promise.all([
    sb('hubs?select=id,name,qr_token,city_id&order=name'),
    sb('users?select=id,name,mobile,role,city_id,hub_id&order=name'),

  // Hubs
  if (hubRows && hubRows.length) {
    HUBS = hubRows;
    hubRows.forEach(h => { HUB_TOKENS[h.name] = h.qr_token; });

    _demoMode = true;
    HUBS = DEMO_HUBS;
    DEMO_HUBS.forEach(h => { HUB_TOKENS[h.name] = h.qr_token; });

// ─ LOAD TODAY'S ATTENDANCE FOR A HUB ─
async function loadAttendanceForHub(hubId) {
  state.attendance = {};
  // Resolve hub name — try HUBS lookup, then state.hub as reliable fallback
  const hubName = (hubId ? HUBS.find(h=>h.id===hubId)?.name : null) || state.hub || '';
  // Resolve hub id — try param, then HUBS lookup by name
  const resolvedHubId = hubId || (hubName ? HUBS.find(h=>h.name===hubName)?.id : null);

  if (_demoMode) {
    DEMO_ATTENDANCE.filter(r=>r.hub_id===resolvedHubId).forEach(r => {
      const name = r.users?.name; if (!name) return;
      state.attendance[name] = {
        status: r.status,
        checkin:  r.checkin_time  ? new Date(r.checkin_time).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false}) : null,
        checkout: r.checkout_time ? new Date(r.checkout_time).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false}) : null,
        hub: hubName, hub_id: resolvedHubId, att_id: r.id
      };
    });
    return;
  }

  // Fetch all today's attendance — filter client-side to avoid column name issues
  const allRows = await sb(`attendance?date=eq.${TODAY}&select=id,status,checkin_time,checkout_time,user_id,hub_id,hub_name,technician_name,approval_status,approved_by_name,remarks,users!attendance_user_id_fkey(name),hubs(name)`);
  
  // Filter to this hub — match by hub_id, hub_name column, or hubs(name) join
  const seen = new Set();
  const rows = (allRows||[]).filter(r => {
    if (!r.user_id || seen.has(r.user_id)) return false;
    const matchById   = resolvedHubId && r.hub_id === resolvedHubId;
    const matchByCol  = hubName && r.hub_name === hubName;
    const matchByJoin = hubName && r.hubs?.name === hubName;
    if (!matchById && !matchByCol && !matchByJoin) return false;
    seen.add(r.user_id); return true;
  });
  console.log('[loadAttendanceForHub]', hubName, '→ total today:', (allRows||[]).length, '→ this hub:', rows.length, '→ names:', Object.keys(state.attendance));
  rows.forEach(r => {
    const name = r.users?.name || r.technician_name; if (!name) return;
    state.attendance[name] = {
      status:   r.status,
      checkin:  r.checkin_time  ? new Date(r.checkin_time).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false}) : null,
      checkout: r.checkout_time ? new Date(r.checkout_time).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false}) : null,
      hub: hubName, hub_id: resolvedHubId, att_id: r.id,
      approval: r.approval_status, approved_by: r.approved_by_name, remarks: r.remarks
    };
  });
  console.log('[loadAttendanceForHub]', hubName, '→', Object.keys(state.attendance).length, 'records');
}

// ── Duplicate vehicle assignment check ──────────────────────────────────────
async function checkVehicleDuplicate(regNum, newTechName) {
  if (_demoMode || !regNum) return null;
  const todayISO = new Date().toISOString().slice(0,10);
  const rows = await sb(`work_orders?vehicle_reg=eq.${encodeURIComponent(regNum)}&status=in.(Open,In Progress,Done)&assigned_at=gte.${todayISO}T00:00:00&select=id,wo_number,status,assigned_tech_id,assigned_tech_name,users!work_orders_assigned_tech_id_fkey(name)&order=assigned_at.desc&limit=5`);
  if (!rows || !rows.length) return null;
  const inProg = rows.find(r=>r.status==='In Progress');
  if (inProg) return { status:'in_progress', tech: inProg.assigned_tech_name||inProg.users?.name||'another technician', woId: inProg.wo_number, woDbId: inProg.id };
  const done = rows.find(r=>r.status==='Done');
  if (done) return { status:'done', tech: done.assigned_tech_name||done.users?.name||'a technician', woId: done.wo_number, woDbId: done.id };
  const open = rows.find(r=>r.status==='Open');
  if (open) {
    const existingTech = open.assigned_tech_name || open.users?.name || '';
    if (newTechName && existingTech && existingTech === newTechName) {
      return { status:'same_tech', tech: existingTech, woId: open.wo_number, woDbId: open.id };
    }
    return { status:'open', tech: existingTech||'another technician', woId: open.wo_number, woDbId: open.id };
  }
  return null;
}

// ── WEEK OFF MARKING ────────────────────────────────────────────────────────
async function markWeekOff(techName, date, userId) {
  // Get week boundaries (Mon-Sun)
  const d       = new Date(date);
  const day     = d.getDay(); // 0=Sun
  const monday  = new Date(d); monday.setDate(d.getDate() - (day===0?6:day-1));
  const sunday  = new Date(monday); sunday.setDate(monday.getDate()+6);
  const monISO  = monday.toISOString().slice(0,10);
  const sunISO  = sunday.toISOString().slice(0,10);

  // Count existing WOs for this tech this week
  const existing = await sb(`attendance?technician_name=eq.${encodeURIComponent(techName)}&status=eq.week_off&date=gte.${monISO}&date=lte.${sunISO}&select=id,date`);
  const usedWOs  = (existing||[]).length;

  if (usedWOs >= _woPerWeekLimit) {
    return { ok: false, msg: `${techName} has already used ${usedWOs}/${_woPerWeekLimit} week off(s) this week (${monISO} – ${sunISO}).` };
  }

  // Check if attendance record exists for this date
  const attRows = await sb(`attendance?technician_name=eq.${encodeURIComponent(techName)}&date=eq.${date}&select=id`);

  if (attRows && attRows.length) {
    // Update existing record
    await sb(`attendance?id=eq.${attRows[0].id}`, {
      method: 'PATCH',
      body: JSON.stringify({ status: 'week_off', updated_at: new Date().toISOString() })
    });
  } else {
    // Insert new attendance record as week_off
    const hubObj = HUBS.find(h=>h.name===state.hub);
    await sb('attendance', {
      method: 'POST',
      prefer: 'return=minimal',
      body: JSON.stringify({
        user_id: userId || null,
        technician_name: techName,
        hub_id: state.hubId || null,
        hub_name: state.hub || null,
        date: date,
        status: 'week_off',
        created_at: new Date().toISOString(),
        updated_at: new Date().toISOString()
      })
    });
  }

  return { ok: true, msg: `Week off marked for ${techName} on ${date}. (${usedWOs+1}/${_woPerWeekLimit} this week)` };
}

async function saveWorkOrder(wo) {
  if (_demoMode) { return { ...wo, id: 'demo-wo-'+Date.now() }; }
  const r = await fetch(SUPABASE_URL+'/rest/v1/work_orders', {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer '+SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    },
    body: JSON.stringify(wo)
  });
  if (!r.ok) {
    const err = await r.text();
    console.error('saveWorkOrder error:', r.status, err);
    return null;
  }
  const data = await r.json();
  return data && data.length ? data[0] : data;
}

async function updateWOStatus(dbId, status) {
  if (_demoMode || !dbId || dbId.startsWith('demo')) return;
  const patch = { status };
  if (status === 'Done') patch.completed_at = new Date().toISOString();
  await sb(`work_orders?id=eq.${dbId}`, { method: 'PATCH', body: JSON.stringify(patch) });
}

async function proceedAfterAuth(u) {
  const initials = u.name.split(' ').map(x=>x[0]).join('').slice(0,2);
  const previewHTML = `<div class="up-avatar">${initials}</div><div><div class="up-name">${u.name}</div><div class="up-role">${ROLE_LABEL[u.role]||u.role}</div></div>`;
  if (u.role === 'hub_manager') {
    document.getElementById('user-preview').innerHTML = previewHTML;
    // Check if SM already has attendance today → skip hub selection
    const todayAtt = await sb(`attendance?user_id=eq.${u.id}&date=eq.${TODAY}&select=id,hub_id,hub_name,checkin_time,checkout_time,hubs(name)&order=checkin_time.asc&limit=1`);
    if (todayAtt && todayAtt.length) {
      const r = todayAtt[0];
      const hubName = r.hubs?.name || r.hub_name || u.assigned_hub_name || '';
      const hubObj  = HUBS.find(h=>h.name===hubName);
      state.pendingUser = u;
      state.pendingUser._autoHub = hubName;
      // Check if hub was changed today — get latest att record too
      const allTodayAtt = await sb(`attendance?user_id=eq.${u.id}&date=eq.${TODAY}&select=id,hub_id,hub_name,checkin_time,checkout_time,hubs(name)&order=checkin_time.asc`) || [];
      const latestAtt = allTodayAtt[allTodayAtt.length-1];
      const currentHub = latestAtt?.hubs?.name || latestAtt?.hub_name || hubName;
      const currentHubObj = HUBS.find(h=>h.name===currentHub) || hubObj;
      state.hub   = currentHub;
      state.hubId = currentHubObj?.id || latestAtt?.hub_id || r.hub_id || null;
      state.myCheckin  = r.checkin_time  ? new Date(r.checkin_time).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true})  : null;
      state.myCheckout = latestAtt?.checkout_time ? new Date(latestAtt.checkout_time).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true}) : null;
      state.myAttId    = latestAtt?.id || r.id;
      // Restore hub1/hub2 if changed
      if (allTodayAtt.length > 1) {
        state.hub1 = hubName; state.hub1Id = hubObj?.id || r.hub_id;
        state.hub1CheckIn  = state.myCheckin;
        state.hub1CheckOut = r.checkout_time ? new Date(r.checkout_time).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true}) : null;
        state.hub2 = currentHub; state.hub2Id = currentHubObj?.id;
        state.hub2CheckIn  = latestAtt?.checkin_time ? new Date(latestAtt.checkin_time).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true}) : null;
      }
      // Show first hub as original check-in hub
      document.getElementById('s3-alert').innerHTML = `<div class="alert al-info" style="margin-bottom:0">Already checked in today at <strong>${hubName}</strong>${allTodayAtt.length>1?' → <strong>'+currentHub+'</strong>':''}.</div>`;
      goStep('step-hub');
      // Auto-continue after brief pause
      setTimeout(async () => {
        state.user = state.pendingUser;
        await Promise.all([loadAttendanceForHub(state.hubId), loadJobsForHub(state.hubId), loadVehiclesForHub(state.hub),
          loadDraftJCForHub(state.hub).then(rows => { if (!window._jcCache) window._jcCache = {}; window._jcCache[state.hub] = rows; })]);
        try { localStorage.setItem('bounce_session', JSON.stringify({user:state.user,hub:state.hub,hubId:state.hubId,myCheckin:state.myCheckin,myCheckout:state.myCheckout,myAttId:state.myAttId||null})); } catch(e){}
        document.getElementById('login-page').style.display='none';
        document.getElementById('app-shell').style.display='block';
        renderTopbar(); renderNav();
        navigate('dashboard');
      }, 1200);
      return;
    }
    // No attendance today — show hub selection as usual
    if (u.assigned_hub_name) { state.pendingUser = u; state.pendingUser._autoHub = u.assigned_hub_name; }
    const sel = document.getElementById('hub-select');
    sel.innerHTML = '<option value="">Select hub...</option>';
    const cityHubs = u.city_id ? HUBS.filter(h=>h.city_id===u.city_id) : HUBS;
    (cityHubs.length ? cityHubs : HUBS).forEach(h=>{
      const o=document.createElement('option'); o.value=h.name; o.textContent=h.name;
      if (h.name === u.assigned_hub_name) o.selected = true;
      sel.appendChild(o);
    });
    goStep('step-hub');
  } else {
    document.getElementById('user-preview-tech').innerHTML = previewHTML;
    const btnEl    = document.getElementById('tech-ready-btn');
    const picker   = document.getElementById('tech-hub-picker');
    const roleNote = document.getElementById('tech-role-note');
    if (u.role === 'technician') {
      // Check if technician already has attendance today → lock to that hub
      const todayAtt = await sb(`attendance?user_id=eq.${u.id}&date=eq.${TODAY}&select=id,hub_id,hub_name,checkin_time,checkout_time,hubs(name)&order=checkin_time.asc&limit=1`);
      if (todayAtt && todayAtt.length) {
        const r = todayAtt[0];
        const hubName = r.hubs?.name || '';
        const hubObj  = HUBS.find(h=>h.name===hubName);
        state.pendingUser = u;
        state.hub   = hubName;
        state.hubId = hubObj?.id || r.hub_id || null;
        state.myCheckin  = r.checkin_time  ? new Date(r.checkin_time).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true})  : null;
        state.myCheckout = r.checkout_time ? new Date(r.checkout_time).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true}) : null;
        state.myAttId    = r.id;
        // Show locked hub, hide dropdown
        picker.style.display   = 'none';
        roleNote.style.display = 'block';
        document.getElementById('tech-ready-msg').innerHTML = `Already checked in today at <strong>${hubName}</strong>.`;
        btnEl.textContent = 'Go to My Attendance';
      } else {
        // No attendance today — show hub picker
        picker.style.display   = 'block';
        roleNote.style.display = 'none';
        btnEl.textContent      = 'Continue';
        const sel = document.getElementById('tech-hub-select');
        sel.innerHTML = '<option value="">Select your hub for today...</option>';
        const cityHubs = u.city_id ? HUBS.filter(h=>h.city_id===u.city_id) : HUBS;
        (cityHubs.length ? cityHubs : HUBS).forEach(h=>{
          const o=document.createElement('option'); o.value=h.name; o.textContent=h.name;
          if (u.assigned_hub_name && h.name===u.assigned_hub_name) o.selected=true;
          sel.appendChild(o);
        });
      }
    } else {
      picker.style.display   = 'none';
      roleNote.style.display = 'block';
      const msgEl = document.getElementById('tech-ready-msg');
      if (u.role==='area_manager') {
        msgEl.textContent = 'You will see attendance and jobs across all hubs in your city.';
        btnEl.textContent = 'Go to Dashboard';
      } else {
        msgEl.textContent = 'You will see attendance and jobs across all cities and hubs.';
        btnEl.textContent = 'Go to Dashboard';
      }
    }
    goStep('step-tech-ready');
  }
}

async function finishLogin() {
  state.user = state.pendingUser;
  if (state.user.role === 'hub_manager') {
    const hubName = document.getElementById('hub-select').value;
    if (!hubName) { setAlert('s3-alert','error','Please select your hub for today.'); return; }
    state.hub = hubName;
    const hubObj = HUBS.find(h=>h.name===hubName);
    state.hubId = hubObj ? hubObj.id : null;
    const btn = document.querySelector('#step-hub .btn-blue');
    btn.textContent = 'Loading...'; btn.disabled = true;
    // Load everything in parallel — include SM's own attendance
    await Promise.all([
      loadAttendanceForHub(state.hubId),
      loadJobsForHub(state.hubId),
      loadVehiclesForHub(state.hub),
      loadMyAttendance(state.user.id),
      loadDraftJCForHub(state.hub).then(rows => {
        if (!window._jcCache) window._jcCache = {};
        window._jcCache[state.hub] = rows;
      })
    ]);
    btn.textContent = 'Continue'; btn.disabled = false;
  } else if (state.user.role === 'technician') {
    // If hub already set from today's attendance record, skip selection
    if (state.hub && state.hubId) {
      const btn = document.querySelector('#step-tech-ready .btn-blue');
      btn.textContent = 'Loading...'; btn.disabled = true;
      await loadMyAttendance(state.user.id);
      await loadMyJobs();
      btn.textContent = 'Go to My Attendance'; btn.disabled = false;
    } else {
      // Get hub from dropdown
      const techSel = document.getElementById('tech-hub-select');
      const selectedHub = techSel ? techSel.value : '';
      if (!selectedHub) {
        const existing = document.getElementById('tech-hub-err');
        if (!existing) {
          const err = document.createElement('div');
          err.id='tech-hub-err'; err.className='alert al-error'; err.style.marginBottom='8px';
          err.textContent='Please select your hub for today.';
          if (techSel) techSel.parentElement.insertAdjacentElement('afterend', err);
        }
        return;
      }
      const existing = document.getElementById('tech-hub-err');
      if (existing) existing.remove();
      const hubObj = HUBS.find(h=>h.name===selectedHub);
      state.hub   = selectedHub;
      state.hubId = hubObj?.id || null;
      state.myCheckin = null; state.myCheckout = null;
      const btn = document.querySelector('#step-tech-ready .btn-blue');
      btn.textContent = 'Loading...'; btn.disabled = true;
      await loadMyAttendance(state.user.id);
      await loadMyJobs();
      btn.textContent = 'Continue'; btn.disabled = false;
    }
  } else {
    // area_manager / head — no hub filter, load all hubs data
    state.hub = null; state.hubId = null;
    _dashFilterCity = ''; _dashFilterHub = '';   // always start fresh on login
    const btn = document.querySelector('#step-tech-ready .btn-blue');
    btn.textContent = 'Loading...'; btn.disabled = true;
    await loadAllHubsData();
    btn.textContent = 'Go to Dashboard'; btn.disabled = false;
  }
  try {
    localStorage.setItem('bounce_session', JSON.stringify({
      user: state.user, hub: state.hub, hubId: state.hubId,
      myCheckin: state.myCheckin, myCheckout: state.myCheckout, myAttId: state.myAttId || null
    }));
  } catch(e) {}

  document.getElementById('login-page').style.display='none';
  document.getElementById('app-shell').style.display='block';
  renderTopbar(); renderNav();
  navigate(state.user.role!=='technician' ? 'dashboard' : 'my-attendance');
}

async function refreshPage(page) {
  const btn = document.querySelector('.btn-refresh');
  if (btn) { btn.classList.add('spinning'); btn.disabled = true; }
  if (state.user.role === 'hub_manager' && state.hubId) {
    await loadAttendanceForHub(state.hubId);
    if (page === 'workorders') await loadJobsForHub(state.hubId);
  } else if (state.user.role === 'area_manager' || state.user.role === 'head') {
    await loadAllHubsData();
  }
  navigate(page);
  // Re-enable after navigation re-renders
  setTimeout(()=>{
    const b = document.querySelector('.btn-refresh');
    if (b) { b.classList.remove('spinning'); b.disabled = false; }
  }, 500);
}

let _clockT = null;
// ── OOS count refresh — called from navigate, filter changes, and auto-refresh ──
function refreshOosCount() {
  const el = document.getElementById('oos-count');
  if (!el) return;
  el.textContent = '…';
  const role   = state.user?.role;
  const isWide = role==='area_manager' || role==='head';

  // Build the hub list to filter by — resolve at call time so filters are current
  let hubsToQuery = null; // null = no filter (all)

  if (!isWide) {
    // SM: always their own hub
    hubsToQuery = state.hub ? [state.hub] : [];
  } else if (_dashFilterHub) {
    // Specific hub selected
    hubsToQuery = [_dashFilterHub];
  } else if (_dashFilterCity) {
    // City selected — get hub names for that city from _cities + HUBS
    const cityObj = (window._cities||[]).find(c=>c.name===_dashFilterCity);
    hubsToQuery = cityObj
      ? HUBS.filter(h=>h.city_id===cityObj.id).map(h=>h.name)
      : [];
  } else if (role==='area_manager') {
    // AM with no filter — scope to their city
    hubsToQuery = HUBS.filter(h=>h.city_id===state.user.city_id).map(h=>h.name);
  }
  // Head with no city/hub filter → hubsToQuery = null = fetch all

  // Build query — use hub_name=in.(...) for multi-hub, =eq. for single
  let query = 'vehicles?bike_status=eq.OOS&select=reg_number,hub_name';
  if (hubsToQuery === null) {
    // no filter — fetch all
  } else if (hubsToQuery.length === 0) {
    // impossible filter — short-circuit
    const el2 = document.getElementById('oos-count');
    if (el2) el2.textContent = '0';
    return;
  } else if (hubsToQuery.length === 1) {
    query += `&hub_name=eq.${encodeURIComponent(hubsToQuery[0])}`;
  } else {
    query += `&hub_name=in.(${hubsToQuery.map(h=>encodeURIComponent(h)).join(',')})`;
  }

  sb(query).then(rows=>{
    const el2 = document.getElementById('oos-count');
    if (!el2) return;
    if (!rows) { el2.textContent='—'; return; }
    const unique = [...new Set(rows.map(r=>r.reg_number))];
    el2.textContent = unique.length;
  });
}

function navigate(page) {
  currentPage = page;  // ← must set BEFORE async calls
  // Persist current page so browser refresh returns here
  try {
    const s=JSON.parse(localStorage.getItem('bounce_session')||'{}');
    s.currentPage=page;
    s.dashFilterCity=_dashFilterCity;
    s.dashFilterHub=_dashFilterHub;
    localStorage.setItem('bounce_session',JSON.stringify(s));
  } catch(e){}
  clearInterval(_clockT);
  document.querySelectorAll('.si,.bnt').forEach(e=>e.classList.remove('active'));
  ['si-','bt-'].forEach(p=>{ const e=document.getElementById(p+page); if(e) e.classList.add('active'); });
  const role = state.user?.role;
  const c = document.getElementById('content');
  // Async pages
  if (page==='work-assigned' && role==='hub_manager') {
    c.innerHTML = '<div style="padding:40px;text-align:center;color:var(--g400)">Loading...</div>';
    renderWorkAssignedAsync().then(html=>{ if(currentPage===page) c.innerHTML=html; });
    return;
  }
  if (page==='workorders' && role==='hub_manager') {
    c.innerHTML = '<div style="padding:40px;text-align:center;color:var(--g400)">Loading work orders...</div>';
    (async () => {
      try {
        const html = await renderWorkOrdersAsync();
        if (currentPage===page) c.innerHTML = html;
      } catch(e) {
        console.error('renderWorkOrdersAsync error:', e);
        if (currentPage===page) c.innerHTML = `<div class="empty-state"><div style="font-size:32px;margin-bottom:12px">⚠️</div><div style="font-weight:600;margin-bottom:6px">Failed to load work orders</div><div style="font-size:13px;color:var(--g400);margin-bottom:16px">${e.message}</div><button class="btn btn-blue" onclick="window._jcCache={};navigate('workorders')">Retry</button></div>`;
      }
    })();
    return;
  }
  if (page==='workorders' && (role==='area_manager'||role==='head')) {
    c.innerHTML = '<div style="padding:40px;text-align:center;color:var(--g400)">Loading work orders...</div>';
    (async () => {
      try {
        const html = await renderWorkOrdersWideAsync(role);
        if (currentPage===page) c.innerHTML = html;

function nowFmt(){ return new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true}); }

function calcDuration(checkinStr, checkedOut) {
  const parse12 = s => {
    if (!s) return null;
    const [time, ampm] = s.split(' ');
    let [h, m] = time.split(':').map(Number);
    if (ampm?.toLowerCase()==='pm' && h!==12) h+=12;
    if (ampm?.toLowerCase()==='am' && h===12) h=0;
    const d = new Date(); d.setHours(h,m,0,0); return d;
  };
  const start = parse12(checkinStr);
  const end   = checkedOut ? parse12(checkedOut) : new Date();
  if (!start) return '--:--';
  const diff = end - start;
  if (diff < 0) return '--:--';
  const h = Math.floor(diff/3600000);
  const m = Math.floor((diff%3600000)/60000);
  const s = Math.floor((diff%60000)/1000);
  return checkedOut
    ? `${h}h ${m}m`
    : `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

let _durationTimer = null;

function injectSmTabBar(active) {
  const t = active || _smAttTab || 'my-attendance';
  const bar = document.createElement('div');
  bar.style.cssText = 'display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid var(--g100);padding-bottom:0';

    btn.onclick = () => { _smAttTab=id; localStorage.setItem('sm_att_tab',id); navigate('attendance'); };
    bar.appendChild(btn);
  });
  const pageHd = document.querySelector('#content .page-hd');
  if (pageHd) pageHd.insertAdjacentElement('afterend', bar);
}
function calcTotalHours() {
  const hub1Mins = calcHub1Mins();
  const p = s => {
    if (!s) return null;
    const [time, ampm] = s.split(' ');
    let [h, m] = time.split(':').map(Number);
    if (ampm?.toLowerCase()==='pm' && h!==12) h+=12;
    if (ampm?.toLowerCase()==='am' && h===12) h=0;
    const d = new Date(); d.setHours(h,m,0,0); return d;
  };
  const start = p(state.myCheckin), end = p(state.myCheckout);
  const hub2Mins = (!start||!end) ? 0 : Math.max(0,(end-start)/60000);
  const total = hub1Mins + hub2Mins;
  const h = Math.floor(total/60), m = Math.round(total%60);
  return `${h}h ${m}m`;
}

function calcHub1Mins() {
  // Calculate hub1 working minutes if tech changed hubs
  if (!state.hub1CheckIn || !state.hub1CheckOut) return 0;
  const parse12 = s => {
    if (!s) return null;
    const [time, ampm] = s.split(' ');
    let [h, m] = time.split(':').map(Number);
    if (ampm?.toLowerCase()==='pm' && h!==12) h+=12;
    if (ampm?.toLowerCase()==='am' && h===12) h=0;
    const d = new Date(); d.setHours(h,m,0,0); return d;
  };
  const start = parse12(state.hub1CheckIn);
  const end   = parse12(state.hub1CheckOut);
  if (!start||!end) return 0;
  return Math.max(0, (end - start) / 60000); // minutes
}

function startDurationTimer() {
  clearInterval(_durationTimer);
  _durationTimer = setInterval(()=>{
    const el = document.getElementById('duration-timer');
    if (!el) { clearInterval(_durationTimer); return; }
    // Include hub1 time as offset
    const hub1Mins = calcHub1Mins();
    const parse12 = s => {
      if (!s) return null;
      const [time, ampm] = s.split(' ');
      let [h, m] = time.split(':').map(Number);
      if (ampm?.toLowerCase()==='pm' && h!==12) h+=12;
      if (ampm?.toLowerCase()==='am' && h===12) h=0;
      const d = new Date(); d.setHours(h,m,0,0); return d;
    };
    const start = parse12(state.myCheckin);
    if (!start) { el.textContent='00:00:00'; return; }
    const hub2Ms  = Math.max(0, new Date() - start);
    const totalMs = hub2Ms + (hub1Mins * 60000);
    const h = Math.floor(totalMs/3600000);
    const m = Math.floor((totalMs%3600000)/60000);
    const s = Math.floor((totalMs%60000)/1000);
    el.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }, 1000);
}

    if (!filterCity) return true;
    const h = HUBS.find(h=>h.name===hubName);

    const cityHubIds = HUBS.filter(x=>x.city_id===h.city_id).map(x=>x.id);

function renderAttendance() {
  const myHub = state.hub;

  // Build tech list from state.attendance (already loaded fresh before this renders)
  const allTechs = Object.entries(state.attendance).map(([name, a]) => ({
    name,
    att: a,
    userId: ALL_USERS.find(u=>u.name===name)?.id || null
  }));

  const presentTechs = allTechs.filter(({att}) => att.status==='present');
  const absentTechs  = allTechs.filter(({att}) => att.status==='absent' || att.status==='week_off');

  return `
    <div class="page-hd">
      <div class="page-hd-text"><div class="page-title">Attendance</div><div class="page-sub">${myHub} — ${dateShort()}</div></div>
      <button class="btn-refresh" onclick="refreshPage('attendance')" title="Refresh">
        <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
      </button>
    </div>
    <div style="display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid var(--g100);padding-bottom:0">
      <button onclick="_attTab='today';localStorage.setItem('att_tab','today');navigate('attendance')" style="padding:8px 18px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:600;border-bottom:2px solid ${_attTab==='today'?'var(--blue)':'transparent'};color:${_attTab==='today'?'var(--blue)':'var(--g500)'};margin-bottom:-2px">Today</button>
      <button onclick="_attTab='calendar';localStorage.setItem('att_tab','calendar');navigate('attendance')" style="padding:8px 18px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:600;border-bottom:2px solid ${_attTab==='calendar'?'var(--blue)':'transparent'};color:${_attTab==='calendar'?'var(--blue)':'var(--g500)'};margin-bottom:-2px">Calendar</button>
    </div>

    ${_attTab==='calendar' ? '<div id="att-cal-inner"><div style=\"padding:20px;text-align:center;color:var(--g400)\">Loading...</div></div>' : allTechs.length===0 ? `<div class="empty-state" style="margin-top:40px">No attendance records for ${myHub} today.</div>` : `

    <!-- Present techs -->
    ${presentTechs.length ? `
    <div style="font-size:13px;font-weight:600;color:var(--g500);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">
      Present — ${presentTechs.length}
    </div>
    <div class="tw" style="margin-bottom:24px"><table>
      <thead><tr><th>Technician</th><th>Check-in</th><th>Check-out</th><th>Approval</th></tr></thead>
      <tbody>${presentTechs.map(({name:t,att:a})=>{
        const ap=a.approval;
        return `<tr>
          <td><strong>${t}</strong></td>
          <td class="mono" style="font-size:12px">${a.checkin||'—'}</td>
          <td class="mono" style="font-size:12px">${a.checkout||'—'}</td>
          <td>${ap==='approved'
            ? `<span class="badge b-present" style="font-size:11px">✓ Approved</span>`
            : ap==='denied'
            ? `<span class="badge b-absent" style="font-size:11px">✗ Denied</span>`
            : `<div style="display:flex;gap:6px">
                <button class="btn btn-green btn-sm" style="padding:4px 10px;font-size:11px" onclick="approveAtt('${t}','approved')">Approve</button>
                <button class="btn btn-red btn-sm"   style="padding:4px 10px;font-size:11px" onclick="approveAtt('${t}','denied')">Deny</button>
              </div>`}
          </td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>` : ''}

    <!-- Absent techs — shown read-only; WO marking done via Calendar tab -->
    ${absentTechs.length ? `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <div style="font-size:13px;font-weight:600;color:var(--g500);text-transform:uppercase;letter-spacing:.05em">
        Absent — ${absentTechs.length}
      </div>
      <div style="font-size:11px;color:var(--g400)">Go to <strong>Calendar</strong> tab to mark Week Off</div>
    </div>
    <div class="tw"><table>
      <thead><tr><th>Technician</th><th>Status</th></tr></thead>
      <tbody>${absentTechs.map(({name:t,att:a})=>{
        const isWO = a.status==='week_off';
        return `<tr>
          <td><strong>${t}</strong></td>
          <td><span class="badge ${isWO?'b-leave':'b-absent'}" style="font-size:11px">${isWO?'Week Off':'Absent'}</span></td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>` : ''}
    `}`;
}

function showWOPopup(techName, date, userId) {
  const inner = document.getElementById('modal-inner');
  inner.innerHTML = `
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">Mark as Week Off</div>
    <div class="modal-sub">${techName} — ${date}</div>
    <div class="alert al-warn" style="margin:12px 0;font-size:13px;line-height:1.6">
      Mark "${techName}" as Week Off for ${date}? Allowance: ${_woPerWeekLimit} per week.
    </div>
    <div style="display:flex;gap:10px;margin-top:4px">
      <button class="btn btn-outline" style="flex:1" onclick="closeModal()">Cancel</button>
      <button class="btn btn-blue"    style="flex:1" onclick="closeModal();doMarkWO('${techName}','${date}','${userId}')">Yes, Mark Week Off</button>
    </div>`;
  document.getElementById('modal').style.display='flex';
}

async function doMarkWO(techName, date, userId) {
  const msgEl = document.getElementById('wo-msg-'+techName.replace(/\s/g,'_'));
  if (msgEl) msgEl.innerHTML = '<span style="color:var(--g400)">Checking...</span>';
  const result = await markWeekOff(techName, date, userId||null);
  if (result.ok) {
    // Update local state
    if (!state.attendance[techName]) state.attendance[techName]={};
    state.attendance[techName].status = 'week_off';
    // Stay on calendar tab and refresh
    _attTab = 'calendar';
    setTimeout(()=>navigate('attendance'), 500);
  } else {
    // Show error in a toast-style alert
    const errEl = document.createElement('div');
    errEl.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#fee2e2;color:#991b1b;padding:10px 20px;border-radius:8px;font-size:13px;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.15)';
    errEl.textContent = result.msg;
    document.body.appendChild(errEl);
    setTimeout(()=>errEl.remove(), 4000);
  }
}

async function mgrAtt(tech,val) {
  if (!state.attendance[tech]) state.attendance[tech]={status:'absent',checkin:null,checkout:null,hub:state.hub,hub_id:state.hubId};
  state.attendance[tech].status=val;
  if(val!=='present'){state.attendance[tech].checkin=null;state.attendance[tech].checkout=null;}
  else if(!state.attendance[tech].checkin) state.attendance[tech].checkin=now24();
  await saveAttOverride(tech, val, state.hubId);
  navigate('attendance');
}

async function approveAtt(tech, decision) {
  if (!state.attendance[tech]) return;
  state.attendance[tech].approval = decision;
  // Save approval to Supabase if live
  if (!_demoMode && state.attendance[tech].att_id) {
    await sb(`attendance?id=eq.${state.attendance[tech].att_id}`, {
      method: 'PATCH',
      body: JSON.stringify({ approval: decision })
    });
  }
  navigate('attendance');
}

    .filter(([name, a]) => a.status==='present' && a.hub===myHub)
    .map(([name]) => name);

    <div class="page-hd"><div class="page-title">Work Orders</div><div class="page-sub">${myHub} — assign and track jobs</div></div>

      <div class="wo-form-title">Assign new work order</div>

        <div class="form-group" style="margin:0">
          <label class="form-label">Vehicle <span style="color:var(--g400);font-weight:400">(type reg no. or model to search)</span></label>

            <input class="form-input" id="veh-search" placeholder="e.g. KA05AP or e1+x..." autocomplete="off"

          </div>
          <div id="veh-dropdown" style="display:none;position:absolute;z-index:50;background:var(--white);border:1px solid var(--g200);border-radius:var(--r);box-shadow:var(--sh-md);max-height:220px;overflow-y:auto;width:calc(50% - 28px);min-width:260px">
          </div>

          <div id="veh-selected" style="display:none;margin-top:6px;padding:8px 10px;background:var(--blue-lt);border-radius:6px;font-size:12px;color:var(--blue)"></div>
        </div>
        <div class="form-group" style="margin:0">
          <label class="form-label">Work Type</label>
          <select class="form-select" id="wotype" onchange="onWOTypeChange()">
            <option value="running_repair">Running Repair</option>
            <option value="oos">OOS (Out of Service)</option>
          </select>
        </div>
      </div>

      <div class="form-row" style="margin-top:12px">
        <div class="form-group" style="margin:0">
          <label class="form-label">Issue / Service</label>
          <input class="form-input" id="woi" placeholder="Describe the problem"/>
        </div>
        <div class="form-group" style="margin:0">
          <label class="form-label">Priority</label>

        <label class="form-label">Assign to (present at ${myHub})</label>
        <select class="form-select" id="wot">

          ${avail.length===0
            ? `<option disabled>No technicians present at this hub</option>`
            : avail.map(t=>`<option value="${t}">${t}</option>`).join('')}

      </div>

      <div id="oos-note" style="display:none;background:var(--red-lt);border:1px solid #fca5a5;border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--red);margin-bottom:8px">
        ⚠️ OOS — vehicle will be marked out of service until resolved.

      <button class="btn btn-blue" style="margin-top:4px" onclick="addWO()">Assign Work Order</button>
    </div>
    <div id="wo-msg"></div>
    ${hubJobs.length===0
      ? `<div class="empty-state">No work orders for ${myHub} yet.</div>`
      : `<div class="tw"><table>
          <thead><tr><th>Vehicle</th><th>Issue</th><th>Technician</th><th>Type</th><th>Priority</th><th>Status</th><th>Update</th></tr></thead>
          <tbody>${hubJobs.map(j=>{
            const gi=state.jobs.indexOf(j);
            const sc=j.status==='Done'?'b-done':j.status==='In Progress'?'b-inprog':'b-open';
            const pc=j.priority==='High'?'b-high':j.priority==='Low'?'b-low':'b-med';

              <td><span class="badge ${pc}">${j.priority}</span></td>
              <td><span class="badge ${sc}">${j.status}</span></td>

function onWOTypeChange() {
  const t = document.getElementById('wotype').value;
  const note = document.getElementById('oos-note');
  if (note) note.style.display = t==='oos' ? 'block' : 'none';
}

async function addWO() {
  const vEl = document.getElementById('wov');
  const v = vEl.value;
  const iss = document.getElementById('woi').value.trim();
  const techName = document.getElementById('wot').value;
  const p = document.getElementById('wop').value;
  // Get work type from JC data (submission_type), fallback to hidden field or 'running_repair'
  const jcData = window._jcLookup?.[v] || {};
  const submType = jcData.submission_type || '';
  const woType = submType.toLowerCase().includes('oos') ? 'oos' : 'running_repair';
  if(!v||!iss||!techName){document.getElementById('wo-msg').innerHTML='<div class="alert al-error">Fill all fields and select a technician.</div>';return;}
  const techUser = ALL_USERS.find(u=>u.name===techName);
  const btn = document.querySelector('.wo-form-wrap .btn-blue');

  // Duplicate vehicle check
  const dup = await checkVehicleDuplicate(v, techName);
  if (dup) {
    showDupPopup(dup, async () => {
      await cancelPreviousWO(dup.woDbId);
      await _doSaveWO_SM(v, iss, p, woType, techUser, {id: state.hubId}, btn);
    });
    return;
  }
  await _doSaveWO_SM(v, iss, p, woType, techUser, {id: state.hubId}, btn);
}

async function _doSaveWO_SM(v, iss, p, woType, techUser, hubObj, btn) {
  const woNum = 'WO-'+String(Date.now()).slice(-6);
  if (btn) { btn.textContent='Saving...'; btn.disabled=true; }
  const saved = await saveWorkOrder({
    wo_number: woNum, vehicle_reg: v, issue: iss,
    job_card_number: (window._jcLookup?.[v]?.job_card_number) || null,
    assigned_tech_id: techUser?.id || null,
    assigned_tech_name: techUser?.name || null,
    hub_id: hubObj?.id || null,
    hub_name: hubObj?.name || state.hub || null,
    priority: p, status: 'Open',
    wo_type: woType,
    assigned_by_id: state.user.id,
    assigned_by_name: state.user.name || null
  });
  if (btn) { btn.textContent='Assign Work Order'; btn.disabled=false; }
  if (saved) {
    document.getElementById('wo-msg').innerHTML=`<div class="alert al-success">✓ ${v} assigned to ${techName}</div>`;
    document.getElementById('veh-search').value='';
    document.getElementById('wov').value='';
    document.getElementById('veh-selected').style.display='none';
    await loadJobsForHub(state.hubId);
    setTimeout(()=>navigate('workorders'),900);
  } else {
    document.getElementById('wo-msg').innerHTML='<div class="alert al-error">Failed to save. Please try again.</div>';
  }
}
async function updJob(i,val){
  state.jobs[i].status=val;
  navigate('workorders');
  await updateWOStatus(state.jobs[i].db_id, val);
}

// ── AM/Head work order assignment ─────────────────────────────────────────
async function loadHubForAssign(hubName) {
  if (!hubName) return;
  _amAssignHub = hubName;
  if (!window._woPgWide) window._woPgWide = {ua:0,as:0};
  window._woPgWide = {ua:0,as:0};
  // Load vehicles and attendance for this hub so assign form is populated
  await Promise.all([
    loadVehiclesForHub(hubName),
    loadAttendanceForHub(HUBS.find(h=>h.name===hubName)?.id)
  ]);
  // Clear JC cache for this hub so fresh data loads
  if (window._jcCache) delete window._jcCache[hubName];
  navigate('workorders');
}

async function addWOWide() {
  const hubName = _amAssignHub;
  if (!hubName) {
    document.getElementById('wo-msg-wide').innerHTML='<div class="alert al-error">Please select a hub first.</div>';
    return;
  }
  const v        = document.getElementById('wov-wide')?.value;
  const iss      = document.getElementById('woi-wide')?.value.trim();
  const techName = document.getElementById('wot-wide')?.value;
  const p        = document.getElementById('wop-wide')?.value || 'Medium';
  if (!v)        { document.getElementById('wo-msg-wide').innerHTML='<div class="alert al-error">Please select a vehicle.</div>'; return; }
  // Check vehicle belongs to selected hub
  const selVeh = VEHICLES.find(veh=>veh.reg_number===v);
  if (selVeh) {
    const vehHub = selVeh.hub_name || (HUBS.find(h=>h.id===selVeh.hub_id)?.name) || '';
    if (vehHub && vehHub !== hubName) {
      document.getElementById('wo-msg-wide').innerHTML=`<div class="alert al-error">This vehicle belongs to "${vehHub}". Please select a vehicle from "${hubName}".</div>`;
      return;
    }
  }
  if (!iss)      { document.getElementById('wo-msg-wide').innerHTML='<div class="alert al-error">Please describe the issue.</div>'; return; }
  if (!techName) { document.getElementById('wo-msg-wide').innerHTML='<div class="alert al-error">Please select a technician.</div>'; return; }
  const jcData  = window._jcLookup?.[v] || {};
  const submType = jcData.submission_type || '';
  const woType  = submType.toLowerCase().includes('oos') ? 'oos' : 'running_repair';
  const techUser = ALL_USERS.find(u=>u.name===techName);
  const hubObj  = HUBS.find(h=>h.name===hubName);
  const btn     = document.querySelector('#wo-form-wide .btn-blue');

  const dup = await checkVehicleDuplicate(v, techName);
  if (dup) {
    showDupPopup(dup, async () => {
      await cancelPreviousWO(dup.woDbId);
      await _doSaveWO_Wide(v, iss, p, woType, techUser, hubObj, hubName, techName, btn);
    });
    return;
  }
  await _doSaveWO_Wide(v, iss, p, woType, techUser, hubObj, hubName, techName, btn);
}

async function _doSaveWO_Wide(v, iss, p, woType, techUser, hubObj, hubName, techName, btn) {
  const woNum = 'WO-'+String(Date.now()).slice(-6);
  if (btn) { btn.textContent='Saving...'; btn.disabled=true; }
  const saved = await saveWorkOrder({
    wo_number: woNum, vehicle_reg: v, issue: iss,
    job_card_number: (window._jcLookup?.[v]?.job_card_number) || null,
    assigned_tech_id: techUser?.id || null,
    assigned_tech_name: techUser?.name || null,
    hub_id: hubObj?.id || null,
    hub_name: hubObj?.name || null,
    priority: p, status: 'Open',
    wo_type: woType,
    assigned_by_id: state.user.id,
    assigned_by_name: state.user.name || null
  });
  if (btn) { btn.textContent='Assign Work Order'; btn.disabled=false; }
  if (saved) {
    document.getElementById('wo-msg-wide').innerHTML=`<div class="alert al-success">✓ ${v} assigned to ${techName} at ${hubName}</div>`;
    document.getElementById('veh-search-wide').value='';
    document.getElementById('wov-wide').value='';
    const vsd = document.getElementById('veh-selected-wide');
    if (vsd) vsd.style.display='none';
  } else {
    document.getElementById('wo-msg-wide').innerHTML='<div class="alert al-error">Failed to save. Please try again.</div>';
  }
}

function filterVehiclesWide(query) {
  const dd  = document.getElementById('veh-dropdown-wide');
  const cnt = document.getElementById('veh-count-wide');
  if (!dd) return;
  const q = (query||'').toLowerCase().trim();
  if (q.length < 2) { dd.style.display='none'; if(cnt) cnt.textContent=''; return; }
  const matches = VEHICLES.filter(v=>
    (v.reg_number||'').toLowerCase().includes(q) ||
    (v.model_name||'').toLowerCase().includes(q)
  );
  // OOS first
  window._vehResultsWide = [
    ...matches.filter(v=>v.bike_status==='OOS'),
    ...matches.filter(v=>v.bike_status!=='OOS')
  ].slice(0, 50);
  if (cnt) cnt.textContent = matches.length ? matches.length+' found' : '';
  if (!window._vehResultsWide.length) {
    dd.innerHTML = `<div style="padding:12px 14px;font-size:13px;color:var(--g400)">No vehicles found for "${query}"</div>`;
    dd.style.display='block'; return;
  }
  dd.innerHTML = window._vehResultsWide.map((v,i) => {
    const model       = v.model_name || '';
    const statusColor = v.bike_status==='Active_rental' ? 'var(--green)' : 'var(--red)';
    const statusLabel = v.bike_status==='Active_rental' ? 'Active' : (v.bike_status||'');
    const jc          = window._jcLookup?.[v.reg_number];
    const jcNum       = jc?.job_card_number  || '—';
    const subType     = jc?.submission_type  || '—';
    const parts       = jc?.parts_to_be_changed
      ? jc.parts_to_be_changed.split(',').filter(p=>p.trim()).length + ' part(s)'
      : '—';
    const jcStatus    = jc?.current_jc_status || '';
    return `<div onclick="selectVehicleWide(${i})" style="padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--g100);transition:background .1s"
      onmouseover="this.style.background='var(--g50)'" onmouseout="this.style.background=''">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
        <span style="font-family:'DM Mono',monospace;font-size:13px;font-weight:600;color:var(--g900)">${v.reg_number}</span>
        <span style="font-size:10px;padding:2px 7px;border-radius:10px;background:${v.bike_status==='Active_rental'?'var(--green-lt)':'var(--red-lt)'};color:${statusColor};font-weight:600">${statusLabel}</span>
      </div>
      <div style="font-size:12px;color:var(--g500);margin-bottom:2px">${model}</div>
      ${jc ? `<div style="font-size:11px;color:var(--g400)">JC: ${jcNum} &nbsp;·&nbsp; Type: ${subType} &nbsp;·&nbsp; Parts: ${parts}${jcStatus?' &nbsp;·&nbsp; '+jcStatus:''}</div>` : ''}
    </div>`;
  }).join('');
  dd.style.display='block';
}

function selectVehicleWide(idx) {
  const v = window._vehResultsWide[idx];
  document.getElementById('wov-wide').value = v.reg_number;
  document.getElementById('veh-search-wide').value = v.reg_number;
  document.getElementById('veh-dropdown-wide').style.display='none';
  const model       = v.model_name || '';
  const statusLabel = v.bike_status==='Active_rental' ? 'Active' : (v.bike_status||'');
  const statusColor = v.bike_status==='Active_rental' ? 'var(--green)' : 'var(--red)';
  const jc          = window._jcLookup?.[v.reg_number];
  const jcNum       = jc?.job_card_number || '—';
  const subType     = jc?.submission_type || '—';
  const parts       = jc?.parts_to_be_changed
    ? jc.parts_to_be_changed.split(',').filter(p=>p.trim()).length + ' part(s)'
    : '—';
  const jcStatus    = jc?.current_jc_status || '';
  const jcEl = document.getElementById('veh-jc-info-wide');
  if (jcEl) {
    jcEl.innerHTML = `<div style="margin-top:8px;padding:10px 12px;background:var(--g50);border:1px solid var(--g200);border-radius:8px;font-size:12px;line-height:1.9">
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:4px">
        <span style="font-family:'DM Mono',monospace;font-weight:600;color:var(--g900)">${v.reg_number}</span>
        <span style="font-size:10px;padding:2px 7px;border-radius:10px;background:${v.bike_status==='Active_rental'?'var(--green-lt)':'var(--red-lt)'};color:${statusColor};font-weight:600">${statusLabel}</span>
      </div>

function renderMyJobs() {
  const myJobs = state.jobs.filter(j=>j.tech===state.user.name);
  // Date filter
  const todayISO = new Date().toISOString().slice(0,10);
  const selDate  = window._myJobsDate || todayISO;
  const filteredJobs = selDate === 'all'
    ? myJobs
    : myJobs.filter(j=>
        // Always show Open/In Progress — pending from any day
        j.status === 'Open' || j.status === 'In Progress' ||
        // Done/other jobs — filter by selected date
        (j.assigned_at||'').slice(0,10) === selDate
      );
  const activeJob = filteredJobs.find(j=>j.status==='In Progress');
  // FIFO: sort Open jobs by assigned_at ascending — only oldest can be started
  const _prio = {High:0,Medium:1,Low:2};
  const openJobs = filteredJobs.filter(j=>j.status==='Open').sort((a,b)=>
    (_prio[a.priority]??1) - (_prio[b.priority]??1) ||
    new Date(a.assigned_at||0) - new Date(b.assigned_at||0)
  );
  const firstOpenJob = openJobs[0];
  const open=openJobs.length;
  const inProg=filteredJobs.filter(j=>j.status==='In Progress').length;
  const done=filteredJobs.filter(j=>j.status==='Done').length;
  const fmtSel = selDate==='all'?'All Time':new Date(selDate+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
  return `
    <div class="page-hd"><div class="page-hd-text"><div class="page-title">My Jobs</div><div class="page-sub">${state.hub||''}</div></div></div>

    </div>

    <div class="metrics" style="margin-bottom:14px">
      <div class="metric"><div class="metric-lbl">Total</div><div class="metric-val">${filteredJobs.length}</div></div>
      <div class="metric"><div class="metric-lbl">Open</div><div class="metric-val mv-blue">${open}</div></div>
      <div class="metric"><div class="metric-lbl">In Progress</div><div class="metric-val mv-amber">${inProg}</div></div>
      <div class="metric"><div class="metric-lbl">Done</div><div class="metric-val mv-green">${done}</div></div>

    ${activeJob ? `<div class="alert al-info" style="margin-bottom:14px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      Active: <strong>${activeJob.vehicle}</strong> — Complete it before starting another.
    </div>` : openJobs.length>1 ? `<div class="alert al-warn" style="margin-bottom:14px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      Priority order: Start <strong>${firstOpenJob?.vehicle||'first job'}</strong> (${firstOpenJob?.priority||'High'} priority) first. Other jobs are locked.
    </div>` : ''}
    ${filteredJobs.length===0?`<div class="empty-state">No jobs found for ${fmtSel}.</div>`:''}
    ${filteredJobs.map(j=>{
      const gi=state.jobs.indexOf(j);
      const sc=j.status==='Done'?'b-done':j.status==='In Progress'?'b-inprog':'b-open';

      const tc=j.wo_type==='oos'?'b-absent':'b-open';

        <div class="fl jc-sb g12" style="align-items:flex-start">
          <div style="flex:1;min-width:0">
            <div style="margin-bottom:2px">
              <strong style="font-size:15px;color:var(--g900)">${j.vehicle}</strong>
              ${j.jc_number ? `<span class="mono" style="font-size:12px;color:var(--g400);margin-left:8px">${j.jc_number}</span>` : ''}

              </div>
            </div>` : ''}
            <div class="fl g8" style="flex-wrap:wrap;margin-top:4px">
              <span class="badge ${sc}">${j.status}</span>
              <span class="badge ${pc}">${j.priority}</span>
            </div>
            ${startPhotos.length ? `<div style="margin-top:10px;font-size:11px;color:var(--green);font-weight:600;margin-bottom:4px">✓ START PHOTOS</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              ${startPhotos.map(p=>`<img src="${typeof p==='string'?p:p.url}" style="width:52px;height:52px;object-fit:cover;border-radius:6px;border:1px solid var(--g200)"/>`).join('')}
            </div>` : ''}
            ${endPhotos.length ? `<div style="margin-top:8px;font-size:11px;color:var(--green);font-weight:600;margin-bottom:4px">✓ END PHOTOS</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              ${endPhotos.map(p=>`<img src="${typeof p==='string'?p:p.url}" style="width:52px;height:52px;object-fit:cover;border-radius:6px;border:1px solid var(--g200)"/>`).join('')}

// ─ VEHICLE SEARCH ─
let _vehResults = [];

function filterVehicles(query) {
  const q = query.trim().toLowerCase();
  const dd = document.getElementById('veh-dropdown');
  const cnt = document.getElementById('veh-count');
  if (!q) { dd.style.display='none'; cnt.textContent=''; return; }
  const matched = VEHICLES.filter(v => {
    const reg = (v.reg_number||'').toLowerCase();
    const model = (v.model_name||v.model||'').toLowerCase();
    const rider = (v.current_rider_name||'').toLowerCase();
    return reg.includes(q) || model.includes(q) || rider.includes(q);
  });
  // OOS vehicles first, then active
  _vehResults = [
    ...matched.filter(v=>v.bike_status==='OOS'),
    ...matched.filter(v=>v.bike_status!=='OOS')
  ].slice(0, 50);
  cnt.textContent = VEHICLES.length > 0 ? `${_vehResults.length} found` : '';
  if (!_vehResults.length) {
    dd.innerHTML = `<div style="padding:12px 14px;font-size:13px;color:var(--g400)">No vehicles found for "${query}"</div>`;
    dd.style.display='block'; return;
  }
  dd.innerHTML = _vehResults.map((v,i) => {
    const reg = v.reg_number;
    const model = v.model_name || v.model || '';
    const rider = v.current_rider_name || '';
    const odo = v.current_odometer ? `${v.current_odometer.toLocaleString()} km` : '';
    const statusColor = v.bike_status === 'Active_rental' ? 'var(--green)' : 'var(--red)';
    const statusLabel = v.bike_status === 'Active_rental' ? 'Active' : (v.bike_status || '');
    const jc       = window._jcLookup?.[v.reg_number];
    const jcNum    = jc?.job_card_number  || '—';
    const subType  = jc?.submission_type  || '—';
    const parts    = jc?.parts_to_be_changed
      ? jc.parts_to_be_changed.split(',').filter(p=>p.trim()).length + ' part(s)'
      : '—';
    const jcStat   = jc?.current_jc_status || '';
    return `<div onclick="selectVehicle(${i})" style="padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--g100);transition:background .1s"
      onmouseover="this.style.background='var(--g50)'" onmouseout="this.style.background=''"
    >
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
        <span style="font-family:'DM Mono',monospace;font-size:13px;font-weight:600;color:var(--g900)">${reg}</span>
        <span style="font-size:10px;padding:2px 7px;border-radius:10px;background:${v.bike_status==='Active_rental'?'var(--green-lt)':'var(--red-lt)'};color:${statusColor};font-weight:600">${statusLabel}</span>
      </div>
      <div style="font-size:12px;color:var(--g500);margin-bottom:2px">${model}</div>
      ${jc ? `<div style="font-size:11px;color:var(--g400)">JC: ${jcNum} &nbsp;·&nbsp; Type: ${subType} &nbsp;·&nbsp; Parts: ${parts}${jcStat?' &nbsp;·&nbsp; '+jcStat:''}</div>` : ''}
    </div>`;
  }).join('');
  dd.style.display='block';
}

function selectVehicle(idx) {
  const v = _vehResults[idx];
  document.getElementById('wov').value = v.reg_number;
  document.getElementById('veh-search').value = v.reg_number;
  document.getElementById('veh-dropdown').style.display='none';
  const model = v.model_name || v.model || '';
