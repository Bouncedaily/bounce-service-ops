// ─ AREA MANAGER / HEAD WORK ORDERS & ATTENDANCE ──────────────────────────
let _areaSelectedHub = '';
let _headSelectedCity = '';
let _headSelectedHub  = '';

async function renderWorkOrdersWideAsync(role) {
  const userCityId = state.user.city_id;
  const userCity   = userCityId ? (HUBS.find(h=>h.city_id===userCityId) ? ['Bangalore','Hyderabad','NCR','Indore'].find(c=>HUBS.filter(h=>h.city_id===userCityId).length>0) : '') : '';
  // Get city name from cities list
  const myCityName = getCityNameSync(userCityId);
  const allCities  = [...new Set(HUBS.map(h=>h.city_id))];
  const cityNames  = role==='head' ? ['Bangalore','Hyderabad','NCR','Indore'] : [myCityName];

  const selectedCity = role==='head' ? (_headSelectedCity||cityNames[0]) : myCityName;
  const cityHubs     = HUBS.filter(h => {
    if (role==='head') return true;
    return h.city_id === userCityId;
  });
  const selectedHub  = role==='head' ? (_headSelectedHub||'') : (_areaSelectedHub||'');
  const hubsForCity  = role==='head'
    ? (selectedCity ? getHubsForCitySync(selectedCity) : cityHubs)
    : cityHubs;

  if (!window._jcCache) window._jcCache = {};
  const cacheKey = selectedHub || selectedCity || 'all';
  if (!window._jcCache[cacheKey]) {
    if (selectedHub) {
      window._jcCache[cacheKey] = await loadDraftJCForHub(selectedHub);
    } else if (selectedCity || role==='area_manager') {
      window._jcCache[cacheKey] = await loadDraftJCForCity(role==='area_manager' ? myCityName : selectedCity);
    } else {
      window._jcCache[cacheKey] = await loadAllDraftJC();
    }
  }
  const jcRows = window._jcCache[cacheKey];

  // Only show bikes where bike_status is OOS (vehicles currently out of service)
  const oosJcRows  = jcRows.filter(j => j.bike_status?.toLowerCase() === 'oos');
  const unassigned = oosJcRows.filter(j=>j.current_jc_status==='Job Open' || j.current_jc_status==='JC not opened in DMS');
  const assigned   = oosJcRows.filter(j=>j.current_jc_status!=='Billed' && j.current_jc_status!=='Job Open' && j.current_jc_status!=='JC not opened in DMS');

  // Get present technicians for the selected hub (for assignment)
  const availTechs = selectedHub
    ? Object.entries(state.attendance).filter(([,a])=>a.status==='present'&&a.hub===selectedHub).map(([n])=>n)
    : [];

  const formatDate = d => d ? new Date(d).toLocaleDateString('en-IN') : '—';
  const TH = `<tr><th>Reg No.</th><th>Hub</th><th>JC Number</th><th>DMS JC ID</th><th>Reason</th><th>TAT</th><th>Labour</th><th>Type</th><th>JC Opened</th><th>Technician</th><th>Action</th></tr>`;
  const tableRow = (j, showChange) => {
    const pc = j.overall_tat_days>3?'b-absent':j.overall_tat_days>1?'b-med':'b-present';
    return `<tr>
      <td class="mono" style="font-size:12px">${j.reg_number||'—'}</td>
      <td style="font-size:11px;color:var(--g500)">${j.hub_name||'—'}</td>
      <td class="mono" style="font-size:11px;color:var(--g400)">${j.job_card_number||'—'}</td>
      <td class="mono" style="font-size:11px;color:var(--g400)">${j.dms_jc_id||'—'}</td>
      <td style="font-size:12px">${j.reason_for_ending||'—'}</td>
      <td><span class="badge ${pc}">${j.overall_tat_days?.toFixed(1)||'—'}d</span></td>
      <td style="font-size:12px">${j.labour_time_hours?.toFixed(1)||'—'}h</td>
      <td style="font-size:12px">${j.submission_type||'—'}</td>
      <td style="font-size:12px">${formatDate(j.job_card_opened_date)}</td>
      <td style="font-size:12px">${j.technician_name||'—'}</td>
      ${showChange?`<td><button class="btn btn-outline btn-sm" onclick="changeTechAlert('${j.job_card_number}','${j.technician_name||''}')">Change Tech</button></td>`:'<td>—</td>'}
    </tr>`;
  };

  const hubOptions = hubsForCity.map(h=>`<option value="${h.name}" ${h.name===selectedHub?'selected':''}>${h.name}</option>`).join('');
  const cityOptions = ['Bangalore','Hyderabad','NCR','Indore'].map(c=>`<option value="${c}" ${c===selectedCity?'selected':''}>${c}</option>`).join('');

  return `
    <div class="page-hd"><div class="page-hd-text"><div class="page-title">Work Orders</div>
    <div class="page-sub">${selectedHub||selectedCity||'All'}</div></div></div>
    <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
      ${role==='head'?`<select class="form-select" style="width:160px" onchange="_headSelectedCity=this.value;_headSelectedHub='';navigate('workorders')">
        <option value="">All Cities</option>${cityOptions}</select>`:''}
      <select class="form-select" style="width:180px" onchange="${role==='head'?'_headSelectedHub':'_areaSelectedHub'}=this.value;navigate('workorders')">
        <option value="">All Hubs</option>${hubOptions}</select>
    </div>
    ${selectedHub && availTechs.length>0 ? `
    <div class="wo-form-wrap">
      <div class="wo-form-title">Quick Assign — ${selectedHub}</div>
      <div class="form-row">
        <div class="form-group" style="margin:0"><label class="form-label">Vehicle</label>
          <input class="form-input" id="veh-search" placeholder="Reg no..." autocomplete="off" oninput="filterVehicles(this.value)" onfocus="showVehDropdown()"/>
          <div id="veh-dropdown" style="display:none;position:absolute;z-index:50;background:var(--white);border:1px solid var(--g200);border-radius:var(--r);box-shadow:var(--sh-md);max-height:200px;overflow-y:auto;width:300px"></div>
          <input type="hidden" id="wov"/>
          <div id="veh-selected" style="display:none;margin-top:4px;font-size:12px;color:var(--blue)"></div>
          <div id="veh-jc-info"></div>
        </div>
        <div class="form-group" style="margin:0"><label class="form-label">Technician (present at ${selectedHub})</label>
          <select class="form-select" id="wot"><option value="">Select...</option>${availTechs.map(t=>`<option>${t}</option>`).join('')}</select>
        </div>
      </div>
      <div class="form-row" style="margin-top:10px">
        <div class="form-group" style="margin:0"><label class="form-label">Issue</label><input class="form-input" id="woi" placeholder="Describe job"/></div>
      </div>
      <input type="hidden" id="wotype" value=""/>
      <button class="btn btn-blue" style="margin-top:12px" onclick="addWO('${selectedHub}')">Assign Work Order</button>
      <div id="wo-msg" style="margin-top:8px"></div>
    </div>` : ''}

    <div style="font-size:15px;font-weight:600;color:var(--g800);margin:12px 0 8px">
      Unassigned Work <span class="badge b-absent">${unassigned.length}</span>
    </div>
    ${unassigned.length===0 ? `<div class="empty-state" style="padding:16px">No open JCs.</div>`
      : `<div class="tw"><table><thead>${TH}</thead><tbody>${unassigned.map(j=>tableRow(j,false)).join('')}</tbody></table></div>`}
    <div style="font-size:15px;font-weight:600;color:var(--g800);margin:16px 0 8px">
      Assigned Work <span class="badge b-inprog">${assigned.length}</span>
    </div>
    ${assigned.length===0 ? `<div class="empty-state" style="padding:16px">No assigned JCs.</div>`
      : `<div class="tw"><table><thead>${TH}</thead><tbody>${assigned.map(j=>tableRow(j,true)).join('')}</tbody></table></div>`}`;
}

// Sync helpers — use cached data, no extra Supabase calls
function getCityNameSync(cityId) {
  if (!cityId) return '';
  const c = window._cities?.find(c=>c.id===cityId);
  return c ? c.name : '';
}
function getHubsForCitySync(cityName) {
  if (!cityName) return HUBS;
  const city = window._cities?.find(c=>c.name===cityName);
  if (!city) return HUBS;
  return HUBS.filter(h=>h.city_id===city.id);
}
// Keep async versions as wrappers for backward compat
async function getCityName(cityId) { return getCityNameSync(cityId); }
async function getHubsForCity(cityName) { return getHubsForCitySync(cityName); }

// ─ AREA MANAGER ATTENDANCE WITH HUB FILTER ───────────────────────────────
let _areaAttHub = '';
function renderAttendanceWide(role) {
  const userCityId = state.user.city_id;
  const cityHubs   = HUBS.filter(h => role==='area_manager' ? h.city_id===userCityId : true);
  const selHub     = _areaAttHub || '';
  const entries    = selHub
    ? Object.entries(state.attendance).filter(([,a])=>a.hub===selHub)
    : Object.entries(state.attendance);

  const hubOptions = cityHubs.map(h=>`<option value="${h.name}" ${h.name===selHub?'selected':''}>${h.name}</option>`).join('');
  const formatTime = t => t||'—';
  const formatApproval = (a) => {
    const ap = a.approval;
    if (a.status!=='present') return '<span style="color:var(--g300);font-size:12px">—</span>';
    if (ap==='approved') return '<span class="badge b-present">✓ Approved</span>';
    if (ap==='denied')   return '<span class="badge b-absent">✗ Denied</span>';
    return '<span class="badge b-open">Pending</span>';
  };

  return `
    <div class="page-hd">
      <div class="page-hd-text"><div class="page-title">Attendance</div><div class="page-sub">${selHub||'All Hubs'} — ${dateShort()}</div></div>
      <button class="btn-refresh" onclick="refreshPage('attendance')" title="Refresh">
        <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
      </button>
    </div>
    <div style="margin-bottom:14px">
      <select class="form-select" style="width:200px" onchange="_areaAttHub=this.value;navigate('attendance')">
        <option value="">All Hubs</option>${hubOptions}
      </select>
    </div>
    ${entries.length===0 ? `<div class="empty-state">No attendance data yet.</div>` :
    `<div class="tw"><table>
      <thead><tr><th>Technician</th><th>Hub</th><th>Status</th><th>Check-in</th><th>Check-out</th><th>Approval</th></tr></thead>
      <tbody>${entries.map(([t,a])=>{
        const bc=a.status==='present'?'b-present':a.status==='absent'?'b-absent':'b-leave';
        return `<tr>
          <td><strong>${t}</strong></td>
          <td style="font-size:12px;color:var(--g500)">${a.hub||'—'}</td>
          <td><span class="badge ${bc}">${a.status[0].toUpperCase()+a.status.slice(1)}</span></td>
          <td class="mono" style="font-size:12px">${formatTime(a.checkin)}</td>
          <td class="mono" style="font-size:12px">${formatTime(a.checkout)}</td>
          <td>${formatApproval(a)}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>`}`;
}

// ─ DASHBOARD WITH CITY/HUB FILTERS & IDLE/OOS WIDGETS ───────────────────
let _dashFilterCity = '';
let _dashFilterHub  = '';

// ─ CLOSE JC SECTION ─
// Shows completed work orders that need job card closure in DMS
function closeJCSection(jobs, hubName) {
  const doneJobs = jobs.filter(j => j.status === 'Done');
  if (!doneJobs.length) return '';

  // Cross-reference with draft_jc to find jobs not yet billed
  const jcCache = window._jcCache?.[hubName] || [];
  const jcMap = {};
  jcCache.forEach(j => { if (j.reg_number) jcMap[j.reg_number] = j; });

  // Jobs that are Done in our system — show with JC details if available
  const rows = doneJobs.map(j => {
    const jc = jcMap[j.vehicle] || {};
    const notBilled = jc.current_jc_status && jc.current_jc_status !== 'Billed';
    const statusColor = notBilled ? 'var(--red)' : 'var(--green)';
    const statusLabel = notBilled ? jc.current_jc_status : (jc.current_jc_status || 'Check DMS');
    return `<tr>
      <td><strong>${j.vehicle}</strong></td>
      <td class="mono" style="font-size:11px;color:var(--g400)">${jc.job_card_number || '—'}</td>
      <td class="mono" style="font-size:11px;color:var(--g400)">${jc.dms_jc_id || '—'}</td>
      <td style="font-size:12px">${j.tech}</td>
      <td style="font-size:12px;color:${statusColor};font-weight:500">${statusLabel}</td>
      <td>${notBilled
        ? `<span style="font-size:11px;padding:3px 10px;background:var(--red-lt);color:var(--red);border-radius:20px;font-weight:600">⚠️ Close in DMS</span>`
        : `<span style="font-size:11px;padding:3px 10px;background:var(--green-lt);color:var(--green);border-radius:20px;font-weight:600">✓ Done</span>`}
      </td>
    </tr>`;
  }).join('');

  const pendingClose = doneJobs.filter(j => {
    const jc = jcMap[j.vehicle];
    return jc && jc.current_jc_status && jc.current_jc_status !== 'Billed';
  }).length;

  return `
    <div style="margin-top:24px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div style="font-size:15px;font-weight:600;color:var(--g800)">
          Close Job Cards
          ${pendingClose>0 ? `<span style="margin-left:8px;font-size:11px;padding:3px 10px;background:var(--red-lt);color:var(--red);border-radius:20px;font-weight:600">${pendingClose} pending</span>` : ''}
        </div>
        <div style="font-size:12px;color:var(--g400)">Completed today — close in DMS to bill</div>
      </div>
      <div class="tw"><table>
        <thead><tr><th>Vehicle</th><th>JC Number</th><th>DMS JC ID</th><th>Technician</th><th>DMS Status</th><th>Action</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
}
