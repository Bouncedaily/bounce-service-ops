<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bounce Service Ops — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --blue:#1a56db;--blue-lt:#ebf0ff;--blue-dk:#1040b0;
  --green:#0f9e6e;--green-lt:#e6f7f2;
  --red:#e02424;--red-lt:#fef2f2;
  --amber:#b45309;--amber-lt:#fef3c7;
  --purple:#7c3aed;--purple-lt:#f5f3ff;
  --g50:#f9fafb;--g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;
  --g400:#9ca3af;--g500:#6b7280;--g600:#4b5563;--g700:#374151;
  --g800:#1f2937;--g900:#111827;--white:#fff;
  --r:10px;--rlg:14px;--sh:0 1px 3px rgba(0,0,0,.08);--sh-md:0 4px 16px rgba(0,0,0,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--g50);color:var(--g800);min-height:100vh;font-size:15px}
.mono{font-family:'DM Mono',monospace}

/* Login */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%)}
.login-card{background:var(--white);border-radius:18px;padding:36px 32px;width:100%;max-width:400px;box-shadow:var(--sh-md)}
.admin-badge{display:inline-flex;align-items:center;gap:6px;background:var(--purple-lt);color:var(--purple);font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;margin-bottom:20px;text-transform:uppercase;letter-spacing:.06em}
.login-title{font-size:22px;font-weight:700;color:var(--g900);margin-bottom:4px}
.login-sub{font-size:13px;color:var(--g400);margin-bottom:24px}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--g600);margin-bottom:5px}
.form-input,.form-select{width:100%;padding:10px 13px;border:1px solid var(--g200);border-radius:var(--r);font-size:15px;font-family:inherit;color:var(--g800);background:var(--white);outline:none;transition:border .15s,box-shadow .15s}
.form-input:focus,.form-select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:var(--r);font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;border:none;transition:all .15s}
.btn-purple{background:var(--purple);color:#fff}.btn-purple:hover{background:#6d28d9}
.btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{background:var(--blue-dk)}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#0a7a55}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:#c81e1e}
.btn-outline{background:var(--white);border:1px solid var(--g200);color:var(--g700)}.btn-outline:hover{background:var(--g50)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-full{width:100%}
.alert{padding:10px 14px;border-radius:var(--r);font-size:13px;margin-bottom:12px;font-weight:500}
.al-error{background:var(--red-lt);color:var(--red)}
.al-success{background:var(--green-lt);color:var(--green)}
.al-info{background:var(--blue-lt);color:var(--blue)}
.al-warn{background:var(--amber-lt);color:var(--amber)}

/* Shell */
.topbar{background:linear-gradient(90deg,#1a1a2e,#0f3460);border-bottom:1px solid rgba(255,255,255,.1);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:#fff}
.logo img{height:28px;width:auto}
.admin-pill{font-size:11px;padding:3px 10px;background:var(--purple);color:#fff;border-radius:20px;font-weight:600;letter-spacing:.05em}
.topbar-right{display:flex;align-items:center;gap:12px}
.admin-name{font-size:13px;color:rgba(255,255,255,.8)}
.btn-logout{font-size:12px;padding:5px 12px;border:1px solid rgba(255,255,255,.2);border-radius:8px;background:transparent;color:rgba(255,255,255,.8);cursor:pointer;font-family:inherit}
.btn-logout:hover{background:rgba(255,255,255,.1)}

.layout{display:flex;min-height:calc(100vh - 56px)}
.sidebar{width:220px;background:var(--white);border-right:1px solid var(--g200);padding:12px 0;flex-shrink:0}
.si{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:14px;color:var(--g500);cursor:pointer;border-left:3px solid transparent;transition:all .15s}
.si:hover{background:var(--g50);color:var(--g800)}
.si.active{background:var(--purple-lt);color:var(--purple);border-left-color:var(--purple);font-weight:500}
.si-section{font-size:10px;font-weight:600;color:var(--g400);text-transform:uppercase;letter-spacing:.08em;padding:16px 20px 4px}
.content{flex:1;padding:28px 24px;overflow:auto}

/* Tables */
.tw{background:var(--white);border:1px solid var(--g200);border-radius:var(--rlg);overflow:hidden;box-shadow:var(--sh);margin-bottom:20px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
thead tr{background:var(--g50);border-bottom:1px solid var(--g200)}
th{padding:10px 14px;text-align:left;font-weight:600;font-size:11px;color:var(--g500);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
td{padding:11px 14px;color:var(--g700);border-bottom:1px solid var(--g100);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--g50)}

.badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;display:inline-block;white-space:nowrap}
.b-active{background:var(--green-lt);color:var(--green)}
.b-inactive{background:var(--red-lt);color:var(--red)}
.b-admin{background:var(--purple-lt);color:var(--purple)}
.b-head{background:#fef3c7;color:#92400e}
.b-area{background:var(--blue-lt);color:var(--blue)}
.b-hub{background:#f0fdf4;color:#166534}
.b-tech{background:var(--g100);color:var(--g600)}

.page-title{font-size:20px;font-weight:700;color:var(--g900);margin-bottom:4px}
.page-sub{font-size:13px;color:var(--g400);margin-bottom:20px}
.card{background:var(--white);border:1px solid var(--g200);border-radius:var(--rlg);padding:20px;box-shadow:var(--sh);margin-bottom:16px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:24px}
.metric{background:var(--white);border:1px solid var(--g200);border-radius:var(--r);padding:14px 16px}
.metric-lbl{font-size:11px;color:var(--g400);font-weight:500;margin-bottom:4px}
.metric-val{font-size:26px;font-weight:700;color:var(--g900);line-height:1}
.mv-blue{color:var(--blue)}.mv-green{color:var(--green)}.mv-red{color:var(--red)}.mv-purple{color:var(--purple)}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--white);border-radius:var(--rlg);padding:28px 24px;width:100%;max-width:480px;position:relative;max-height:90vh;overflow-y:auto}
.modal-close{position:absolute;top:14px;right:14px;background:var(--g100);border:none;cursor:pointer;color:var(--g700);font-size:18px;padding:8px;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;z-index:999}
.modal-close:hover{background:var(--g200)}
.modal-title{font-size:17px;font-weight:700;margin-bottom:4px;color:var(--g900)}
.modal-sub{font-size:13px;color:var(--g400);margin-bottom:20px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions-row{display:flex;gap:8px;flex-wrap:wrap}
.search-bar{display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.search-input{flex:1;min-width:200px;padding:9px 13px;border:1px solid var(--g200);border-radius:var(--r);font-size:14px;font-family:inherit;outline:none}
.search-input:focus{border-color:var(--blue)}
.sel-sm{padding:5px 8px;font-size:12px;border:1px solid var(--g200);border-radius:6px;font-family:inherit;color:var(--g700);background:var(--white)}
.toggle{position:relative;display:inline-block;width:40px;height:22px}
.toggle input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:var(--g300);border-radius:22px;transition:.3s}
.slider:before{position:absolute;content:"";height:16px;width:16px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.3s}
input:checked+.slider{background:var(--green)}
input:checked+.slider:before{transform:translateX(18px)}
.section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;display:inline-block;margin:2px}
.tag-perm{background:var(--blue-lt);color:var(--blue)}
.empty-state{text-align:center;padding:40px 20px;color:var(--g400);font-size:14px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-page" style="display:none" class="login-page">
  <div class="login-card">
    <div class="admin-badge">Admin Portal</div>
    <div class="login-title">Bounce Service Ops</div>
    <div class="login-sub">Admin access only — enter your mobile number</div>
    <div id="login-alert"></div>
    <div class="form-group">
      <label class="form-label">Mobile Number</label>
      <div style="display:flex;gap:8px">
        <span style="padding:10px 12px;border:1px solid var(--g200);border-radius:var(--r);background:var(--g50);color:var(--g700);white-space:nowrap">+91</span>
        <input class="form-input" id="mobile-input" type="tel" inputmode="numeric" maxlength="10" placeholder="Enter mobile number" onkeydown="if(event.key==='Enter')doAdminLogin()" style="flex:1"/>
      </div>
    </div>
    <button class="btn btn-purple btn-full" style="padding:13px" onclick="doAdminLogin()">Access Admin Portal</button>
    <p style="font-size:11px;color:var(--g400);text-align:center;margin-top:14px">Restricted to authorised admin users only</p>
  </div>
</div>

<!-- APP -->
<div id="loading-screen" style="position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999">
  <img src="https://bouncedaily.in/logo%20%281%29.png" alt="Bounce" style="height:48px;width:auto;margin-bottom:16px" onerror="this.style.display='none'"/>
  <div style="font-size:14px;font-weight:600;color:#374151;margin-bottom:16px">Admin Portal</div>
  <div style="width:36px;height:36px;border:3px solid #e5e7eb;border-top-color:#7c3aed;border-radius:50%;animation:spin .8s linear infinite"></div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</div>
<div id="app-shell" style="display:none">
  <div class="topbar">
    <div class="logo">
      <img src="https://bouncedaily.in/logo%20%281%29.png" alt="Bounce" onerror="this.style.display='none'"/>
      <span>Service Ops</span>
      <span class="admin-pill">Admin</span>
    </div>
    <div class="topbar-right">
      <span class="admin-name" id="admin-name"></span>
      <button class="btn-logout" onclick="doLogout()">Logout</button>
    </div>
  </div>
  <div class="layout">
    <div class="sidebar">
      <div class="si-section">Overview</div>
      <div class="si active" onclick="nav('dashboard')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </div>
      <div class="si-section">User Management</div>
      <div class="si" onclick="nav('users')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        All Users
      </div>
      <div class="si" onclick="nav('add-user')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        Add User
      </div>
      <div class="si-section">System</div>
      <div class="si" onclick="nav('hubs')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="9"/></svg>
        Settings
        </div>
        <div class="nav-item" onclick="nav('settings')">
        Settings
        </div>
        <div class="nav-item" onclick="nav('hubs')">
        Hub Locations
      </div>
      <div class="si" onclick="nav('permissions')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        Permissions
      </div>
      <div class="si" onclick="nav('login-activity')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Login Activity
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- MODAL -->
<div id="modal" class="modal-backdrop" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-inner"></div>
</div>

<script>
const SUPABASE_URL = 'https://jpypnrrjiagscqrucslw.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpweXBucnJqaWFnc2NxcnVjc2x3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNDU2NDAsImV4cCI6MjA5NDkyMTY0MH0.fesCaEsgS7r4Z6mV5S1-z54etaGNPpYlISdjjcnLfzM';

const ROLE_LABEL = {admin:'Admin',head:'Head',area_manager:'Area Manager',hub_manager:'Service Manager',technician:'Technician'};
const ROLE_BADGE = {admin:'b-admin',head:'b-head',area_manager:'b-area',hub_manager:'b-hub',technician:'b-tech'};

let adminUser = null;
let allUsers = [], allHubs = [], allCities = [];
let currentPage = 'dashboard';

async function sb(path, opts={}) {
  try {
    const r = await fetch(SUPABASE_URL+'/rest/v1/'+path, {
      headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY,
                'Content-Type':'application/json', Prefer:opts.prefer||'' },
      method:opts.method||'GET', body:opts.body
    });
    if (!r.ok) {
      const errText = await r.text();
      console.error('SB error', r.status, errText);
      try { return { _error:true, status:r.status, detail:JSON.parse(errText) }; }
      catch { return { _error:true, status:r.status, detail:errText }; }
    }
    const t = await r.text(); return t ? JSON.parse(t) : [];
  } catch(e) { console.error(e); return null; }
}

async function doAdminLogin() {
  const mobile = document.getElementById('mobile-input').value.trim();
  if (!/^\d{10}$/.test(mobile)) { setAlert('Not a valid mobile number'); return; }
  const btn = document.querySelector('.btn-purple');
  btn.textContent = 'Checking...'; btn.disabled = true;
  const data = await sb(`users?mobile=eq.${mobile}&select=id,name,mobile,role,is_admin,is_active&limit=1`);
  btn.textContent = 'Access Admin Portal'; btn.disabled = false;
  if (!data || !data.length) { setAlert('Mobile number not registered.'); return; }
  const user = data[0];
  if (!user.is_admin && user.role !== 'admin') { setAlert('You do not have admin access.'); return; }
  if (user.is_active === false) { setAlert('Your account is deactivated.'); return; }
  adminUser = user;
  // Log login
  await sb('login_activity', { method:'POST', prefer:'return=minimal',
    body: JSON.stringify({user_id:user.id, user_name:user.name, mobile:user.mobile, role:user.role, action:'login'})
  });
  await sb(`users?id=eq.${user.id}`, { method:'PATCH', body: JSON.stringify({last_login_at: new Date().toISOString()})});
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('app-shell').style.display = 'block';
  document.getElementById('admin-name').textContent = user.name;
  try { localStorage.setItem('bounce_admin_session', JSON.stringify({ user })); } catch(e) {}
  await loadMasterData();
  nav('dashboard');
}

function setAlert(msg) {
  document.getElementById('login-alert').innerHTML = msg
    ? `<div class="alert al-error">${msg}</div>` : '';
}

async function loadMasterData() {
  const [users, hubs, cities] = await Promise.all([
    sb('users?select=id,name,mobile,role,city_id,hub_id,assigned_hub_name,is_active,is_admin,employee_id,last_login_at,created_at&order=name'),
    sb('hubs?select=id,name,city_id,lat,lng,address&order=name'),
    sb('cities?select=id,name&order=name')
  ]);
  allUsers   = users   || [];
  allHubs    = hubs    || [];
  allCities  = cities  || [];
}

function doLogout() {
  sb('login_activity', { method:'POST', prefer:'return=minimal',
    body: JSON.stringify({user_id:adminUser.id, user_name:adminUser.name, mobile:adminUser.mobile, role:adminUser.role, action:'logout'})
  });
  try { localStorage.removeItem('bounce_admin_session'); } catch(e) {}
  adminUser = null;
  document.getElementById('app-shell').style.display='none';
  document.getElementById('login-page').style.display='flex';
  document.getElementById('mobile-input').value='';
}

function nav(page) {
  currentPage = page;
  document.querySelectorAll('.si').forEach(e=>e.classList.remove('active'));
  const pages = {dashboard:renderDashboard,users:renderUsers,'add-user':renderAddUser,hubs:renderHubs,permissions:renderPermissions,'login-activity':renderLoginActivity,settings:renderSettings};
  document.getElementById('content').innerHTML = (pages[page]||(() => ''))();
}

// ─ DASHBOARD ─
function renderDashboard() {
  const total   = allUsers.length;
  const active  = allUsers.filter(u=>u.is_active!==false).length;
  const byRole  = {};
  allUsers.forEach(u=>{ byRole[u.role]=(byRole[u.role]||0)+1; });
  return `
    <div class="page-title">Admin Dashboard</div>
    <div class="page-sub">Bounce Service Ops — User & System Overview</div>
    <div class="metrics">
      <div class="metric"><div class="metric-lbl">Total Users</div><div class="metric-val mv-purple">${total}</div></div>
      <div class="metric"><div class="metric-lbl">Active</div><div class="metric-val mv-green">${active}</div></div>
      <div class="metric"><div class="metric-lbl">Inactive</div><div class="metric-val mv-red">${total-active}</div></div>
      <div class="metric"><div class="metric-lbl">Hub Managers</div><div class="metric-val mv-blue">${byRole.hub_manager||0}</div></div>
      <div class="metric"><div class="metric-lbl">Technicians</div><div class="metric-val">${byRole.technician||0}</div></div>
      <div class="metric"><div class="metric-lbl">Hubs</div><div class="metric-val">${allHubs.length}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div class="card">
        <div style="font-size:14px;font-weight:600;margin-bottom:12px">Users by Role</div>
        ${Object.entries(byRole).map(([role,count])=>`
          <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--g100)">
            <span class="badge ${ROLE_BADGE[role]||'b-tech'}">${ROLE_LABEL[role]||role}</span>
            <span style="font-weight:600;font-size:15px">${count}</span>
          </div>`).join('')}
      </div>
      <div class="card">
        <div style="font-size:14px;font-weight:600;margin-bottom:12px">Hubs by City</div>
        ${allCities.map(c=>{
          const cnt = allHubs.filter(h=>h.city_id===c.id).length;
          return `<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--g100)">
            <span style="font-size:13px;font-weight:500">${c.name}</span>
            <span style="font-weight:600;font-size:15px;color:var(--blue)">${cnt} hubs</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

// ─ USERS ─
let userFilter = { search:'', role:'', status:'' };
function renderUsers() {
  const filtered = allUsers.filter(u => {
    if (userFilter.search && !u.name.toLowerCase().includes(userFilter.search) && !u.mobile.includes(userFilter.search)) return false;
    if (userFilter.role && u.role !== userFilter.role) return false;
    if (userFilter.status === 'active'   && u.is_active === false) return false;
    if (userFilter.status === 'inactive' && u.is_active !== false) return false;
    return true;
  });
  return `
    <div class="page-title">All Users</div>

async function doAddUser() {
  const name   = document.getElementById('add-name').value.trim();
  const mobile = document.getElementById('add-mobile').value.trim();
  const role   = document.getElementById('add-role').value;
  const empid  = document.getElementById('add-empid').value.trim();
  const cityId = document.getElementById('add-city')?.value || null;
  const hub    = document.getElementById('add-hub')?.value || null;
  const notes  = document.getElementById('add-notes').value.trim();
  if (!name||!mobile||!role) { document.getElementById('add-alert').innerHTML='<div class="alert al-error">Name, mobile and role are required.</div>'; return; }
  if (!/^\d{10}$/.test(mobile)) { document.getElementById('add-alert').innerHTML='<div class="alert al-error">Enter a valid 10-digit mobile number.</div>'; return; }
  const res = await sb('users', { method:'POST', prefer:'return=representation',
    body: JSON.stringify({ name, mobile, role, employee_id:empid||null, city_id:cityId||null,
      assigned_hub_name:hub||null, notes:notes||null, created_by:adminUser.id, is_active:true })
  });
  if (res && !res._error && res.length) {
    await loadMasterData();
    document.getElementById('add-alert').innerHTML='<div class="alert al-success">✓ User created successfully.</div>';
    setTimeout(()=>nav('users'), 1200);
  } else {
    // Surface actual Supabase error
    let errMsg = 'Failed to create user.';
    if (res && res._error) {
      const d = res.detail;
      if (d && d.message) errMsg = d.message;
      else if (d && d.code === '23505') errMsg = 'Mobile number already exists.';
      else if (typeof d === 'string' && d.includes('unique')) errMsg = 'Mobile number already exists.';
      else if (d && d.code) errMsg = `Error ${d.code}: ${d.message || d.hint || 'Unknown error'}`;
      console.error('Add user error:', d);
    }
    document.getElementById('add-alert').innerHTML=`<div class="alert al-error">${errMsg}</div>`;
  }
}

}

async function saveHubCoords(hubId) {
  const lat  = parseFloat(document.getElementById('h-lat').value);
  const lng  = parseFloat(document.getElementById('h-lng').value);
  const addr = document.getElementById('h-addr').value.trim();
  if (isNaN(lat)||isNaN(lng)) {
    document.getElementById('hub-edit-alert').innerHTML='<div class="alert al-error">Enter valid latitude and longitude.</div>';
    return;
  }
  await sb(`hubs?id=eq.${hubId}`, { method:'PATCH', prefer:'return=minimal',
    body: JSON.stringify({ lat, lng, address:addr||null })
  });
  // Update local cache
  const hub = allHubs.find(h=>h.id===hubId);
  if (hub) { hub.lat=lat; hub.lng=lng; hub.address=addr; }
  closeModal();
  nav('hubs');
}

// ─ RESTORE SESSION ON PAGE LOAD ─
window.addEventListener('DOMContentLoaded', async () => {
  const hideLoading = () => {
    const el = document.getElementById('loading-screen');
    if (el) el.style.display = 'none';
  };
  const showLogin = () => {
    hideLoading();
    document.getElementById('login-page').style.display = 'flex';
  };
  try {
    const saved = localStorage.getItem('bounce_admin_session');
    if (!saved) { showLogin(); return; }
    const sess = JSON.parse(saved);
    if (!sess || !sess.user) { showLogin(); return; }
    // Re-validate
    const check = await sb(`users?mobile=eq.${sess.user.mobile}&select=id,name,mobile,role,is_admin,is_active&limit=1`);
    if (!check || !check.length || check[0].is_active === false || (!check[0].is_admin && check[0].role !== 'admin')) {
      localStorage.removeItem('bounce_admin_session');
      showLogin(); return;
    }
    adminUser = check[0];
    hideLoading();
    document.getElementById('app-shell').style.display = 'block';
    document.getElementById('admin-name').textContent  = adminUser.name;
    await loadMasterData();
    nav('dashboard');
  } catch(e) {
    console.warn('Admin session restore failed:', e);
    localStorage.removeItem('bounce_admin_session');
    showLogin();
  }
});

// ── PASSWORD MANAGEMENT ──────────────────────────────────────────────────────
function showSetPasswordModal(userId, userName) {
  document.getElementById('modal-inner').innerHTML = `
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">Set Password</div>
    <div class="modal-sub">${userName}</div>
    <div id="pwd-modal-alert"></div>
    <div class="form-group" style="margin-top:16px">
      <label class="form-label">New Password</label>
      <input class="form-input" id="new-pwd-input" type="password" placeholder="Min 6 characters"/>
    </div>
    <div class="form-group">
      <label class="form-label">Confirm Password</label>
      <input class="form-input" id="confirm-pwd-input" type="password" placeholder="Re-enter password"/>
    </div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn btn-outline" style="flex:1" onclick="closeModal()">Cancel</button>
      <button class="btn btn-purple" style="flex:1" onclick="savePassword('${userId}')">Set Password</button>
    </div>`;
  document.getElementById('modal').style.display = 'flex';
}

async function hashPwd(pwd) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pwd));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function savePassword(userId) {
  const pwd     = document.getElementById('new-pwd-input')?.value || '';
  const confirm = document.getElementById('confirm-pwd-input')?.value || '';
  const alertEl = document.getElementById('pwd-modal-alert');
  if (pwd.length < 6) { alertEl.innerHTML='<div class="alert al-error">Password must be at least 6 characters.</div>'; return; }
  if (pwd !== confirm) { alertEl.innerHTML='<div class="alert al-error">Passwords do not match.</div>'; return; }
  const hashed = await hashPwd(pwd);
  await sb(`users?id=eq.${userId}`, { method:'PATCH', body: JSON.stringify({ password_hash: hashed, password_set_at: new Date().toISOString() }) });
  closeModal();
  const t = document.createElement('div');
  t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:white;padding:10px 20px;border-radius:8px;font-size:13px;z-index:9999';
  t.textContent = '✓ Password set successfully';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3000);
  nav('users');
}
</script>
